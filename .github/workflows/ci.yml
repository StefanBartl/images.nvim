name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: stylua --check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua/ plugin/ scripts/ TESTS/
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luarocks && sudo luarocks install luacheck 1.2.0
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          luacheck lua/ plugin/ scripts/ TESTS/ --globals vim
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-lint
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  test:
    # The side-effect-free modules only: grid layout, link detection, metadata
    # formatting, config merging. Anything that draws needs a terminal with a
    # graphics protocol and cannot be checked headless.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          LIB_NVIM_PATH=.deps/lib.nvim nvim -n -i NONE --headless -u NONE -l TESTS/run.lua
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  map:
    # Generates the map; the gate is the generator's own exit code, which is
    # non-zero when a layer rule in scripts/gen_map.lua is violated.
    #
    # NOT `--check`: that mode compares the freshly generated map against the
    # committed one, and `docs/map/` is in .gitignore here (derived output,
    # deliberately not source -- see the comment there). On a fresh checkout
    # there is nothing to compare against, so `--check` reported the map as
    # stale on every single run and this job could never go green. Staleness of
    # a working copy is the pre-commit hook's business; the layer rules are
    # what CI can meaningfully enforce.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/documentation.nvim
          path: .deps/documentation.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless -l scripts/gen_map.lua
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-map
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14
