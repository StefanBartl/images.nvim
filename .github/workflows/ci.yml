name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luarocks && sudo luarocks install luacheck
      - run: luacheck lua/ plugin/ scripts/ TESTS/ --globals vim

  test:
    # Nur die seiteneffektfreien Module: Rasteraufteilung, Linkerkennung,
    # Metadaten-Aufbereitung, Konfiguration. Alles, was zeichnet, braucht ein
    # Terminal mit Grafikprotokoll und ist headless nicht prüfbar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      - run: LIB_NVIM_PATH=.deps/lib.nvim nvim --headless -u NONE -l TESTS/run.lua

  map:
    # `--check` is the whole check: it verifies the committed module map is
    # current and that no layer rule in scripts/gen_map.lua is violated.
    # Worth having even with the pre-commit hook installed — the hook is
    # opt-in per clone, so without this the map goes stale on main unnoticed.
    #
    # windows-latest, not ubuntu: documentation.nvim's output is not identical
    # across platforms — `docs/map/index.html` and `module_map.json` come out
    # different on Linux than on Windows, where the committed copy is
    # generated, while `overview.md` matches. Checking on the platform the map
    # is authored on keeps the check meaningful instead of permanently red.
    # The real fix belongs upstream in documentation.nvim; until then this is
    # the honest configuration rather than a disabled check.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/documentation.nvim
          path: .deps/documentation.nvim
      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      - run: nvim --headless -l scripts/gen_map.lua --check
