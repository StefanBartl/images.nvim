<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>images.nvim — module map</title><style>:root{
  --bg:#fbfbfa; --panel:#fff; --ink:#1a1a19; --muted:#6b6b68; --line:#e4e4e1;
  --accent:#3b6ea8; --accent-soft:#eaf1f9;
  --error:#b3261e; --warn:#8a5a00; --info:#4a4a48;
  --mod:#3b6ea8; --ns:#7a7a76; --file:#5c8a5c;
  --dep:#a35a2a; --call:#6b4c9a; --fn:#8a5a00; --ext:#2a7a6f;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16171a; --panel:#1d1f23; --ink:#e6e6e3; --muted:#9a9a95; --line:#2e3136;
    --accent:#7aa9dd; --accent-soft:#22303f;
    --error:#f2837b; --warn:#e0b060; --info:#a8a8a3;
    --mod:#7aa9dd; --ns:#9a9a95; --file:#8fbf8f;
    --dep:#d99b6a; --call:#b09ada; --fn:#e0b060; --ext:#6fc0b3;
  }
}
:root[data-theme="light"]{
  --bg:#fbfbfa; --panel:#fff; --ink:#1a1a19; --muted:#6b6b68; --line:#e4e4e1;
  --accent:#3b6ea8; --accent-soft:#eaf1f9;
  --error:#b3261e; --warn:#8a5a00; --info:#4a4a48;
  --mod:#3b6ea8; --ns:#7a7a76; --file:#5c8a5c;
  --dep:#a35a2a; --call:#6b4c9a; --fn:#8a5a00; --ext:#2a7a6f;
}
:root[data-theme="dark"]{
  --bg:#16171a; --panel:#1d1f23; --ink:#e6e6e3; --muted:#9a9a95; --line:#2e3136;
  --accent:#7aa9dd; --accent-soft:#22303f;
  --error:#f2837b; --warn:#e0b060; --info:#a8a8a3;
  --mod:#7aa9dd; --ns:#9a9a95; --file:#8fbf8f;
  --dep:#d99b6a; --call:#b09ada; --fn:#e0b060; --ext:#6fc0b3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:20px 24px 14px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
h1 .sub{color:var(--muted);font-weight:400;font-size:14px;margin-left:8px}
.stats{margin-left:auto;display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
/* The counts are buttons, but they must not look like the toolbar's. Stripped
   back to text, gaining an underline only on hover — the affordance appears
   where the pointer already is, without five chrome buttons in the header. */
.stat-link{padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;
  border-radius:4px}
.stat-link:hover:not(:disabled){text-decoration:underline;text-underline-offset:3px}
.stat-link:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
/* A zero count is not a link. Same opacity as the surrounding muted text, so
   it reads as a number rather than as something broken. */
.stat-link:disabled{cursor:default}
/* Where an errors/warnings click lands. Fades, so the eye is drawn to the row
   without leaving a permanent highlight the reader then has to dismiss. */
@keyframes findflash{from{background:var(--accent-soft)}to{background:transparent}}
#findings tbody tr.flash td{animation:findflash 1.6s ease-out}
.toolbar{padding:12px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid var(--line)}
#q{flex:1;min-width:200px;max-width:440px;padding:7px 11px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel);color:var(--ink);font-size:14px}
#q:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
button{padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  color:var(--ink);font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line)}
.tab-btn{padding:9px 13px;border:none;background:none;color:var(--muted);font-size:13px;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.view{display:none}
.view.active{display:block}
main.view.active{display:grid}
main{grid-template-columns:minmax(300px,1.1fr) minmax(0,1.4fr);gap:0;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
#tree{padding:12px 8px 60px 16px;border-right:1px solid var(--line);
  max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#tree{max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
.row{display:flex;align-items:baseline;gap:7px;padding:3px 8px;border-radius:6px;cursor:pointer;
  white-space:nowrap}
.row:hover{background:var(--accent-soft)}
.row.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.tw{width:14px;flex:none;color:var(--muted);font-size:11px;user-select:none}
.nm{font-family:var(--mono);font-size:13px}
.k-module .nm{color:var(--mod)} .k-namespace .nm{color:var(--ns)} .k-file .nm{color:var(--file)}
.sm{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.badges{display:flex;gap:4px;flex:none}
.bd{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;
  border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.bd.rd{color:var(--accent);border-color:var(--accent)}
.bd.dep{color:var(--error);border-color:var(--error)}
.bd.tested{color:var(--accent);border-color:var(--accent)}
.kids{margin-left:15px;border-left:1px solid var(--line);padding-left:3px}
.kids.hide{display:none}
#detail{padding:22px 26px 60px;max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#detail{max-height:none}}
#detail h2{margin:0 0 3px;font-size:17px;font-family:var(--mono);font-weight:600}
.mp{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:16px;
  word-break:break-all}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.links a{font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;
  text-decoration:none;color:var(--accent);background:var(--panel)}
.links a:hover{border-color:var(--accent)}
.prose{white-space:pre-wrap;font-size:13.5px;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 15px;
  margin-bottom:18px;overflow-x:auto}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:18px 0 7px;font-weight:600}
.lst{list-style:none;margin:0;padding:0}
.lst li{font-family:var(--mono);font-size:12.5px;padding:2px 0;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;font-style:italic}
.fn{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.fn:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
.fn-sig{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600}
.fn-badges{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.fn-desc{font-size:12.5px;color:var(--muted);margin:4px 0}
.fn-dep{color:var(--error);font-size:11.5px;font-weight:600;margin:4px 0}
.fn-plist{list-style:none;margin:4px 0;padding:0;font-size:11.5px}
.fn-plist li{padding:1px 0}
.fn-plist code{background:none;padding:0;color:var(--accent)}
.fn-ex{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;background:var(--accent-soft);
  border-radius:6px;padding:8px 10px;margin-top:6px;overflow-x:auto}
.fn-see a{color:var(--accent);text-decoration:none}
.fn-see a:hover{text-decoration:underline}
/* The bounded source snippet — popup-only, see snippetHTML()'s own comment
   for why this never touches the Tree tab's detail pane. Same shape as
   `.fn-ex`'s code block, a distinct class since the content is source, not
   an authored `@example`. */
.fn-snip-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);margin-top:10px}
.fn-snip-label .bd{text-transform:none;letter-spacing:0;margin-left:6px}
.fn-snip{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;background:var(--accent-soft);
  border-radius:6px;padding:8px 10px;margin-top:4px;overflow-x:auto}
/* Annotation popup — the same fn-* markup the detail pane renders, floated
   over whichever list the reader is scanning. Every list in this map shows a
   signature and nothing else; the params, returns and prose that were
   already parsed sat one navigation away, which is what this closes.
   `position:fixed` because the trigger can live inside a scrolling panel and
   an absolutely-positioned card would scroll away from its own anchor. */
.sigpop{position:fixed;z-index:60;display:none;max-width:520px;min-width:260px;
  max-height:60vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px}
.sigpop.on{display:block}
.sigpop .fn-sig{font-size:12px}
/* The trigger. Kept at full opacity for keyboard focus and while its popup
   is open, so tabbing through a list does not chase an invisible control. */
.sigi{display:inline-block;margin-left:6px;padding:0 4px;border-radius:4px;cursor:help;
  font-size:10.5px;line-height:15px;color:var(--muted);border:1px solid var(--line);
  opacity:.45;transition:opacity .12s,color .12s;user-select:none}
.sigi:hover,.sigi:focus,.sigi.on{opacity:1;color:var(--accent);border-color:var(--accent);
  outline:none}
li:hover>.sigi,tr:hover .sigi{opacity:.8}
/* The prose-reference affordance. Rendered only where references exist, so
   unlike `.sigi` it carries information by being present at all — hence a
   accent-tinted resting state rather than `.sigi`'s near-invisible one. */
.doci{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;cursor:help;
  font-size:10.5px;line-height:15px;color:var(--accent);border:1px solid var(--line);
  background:var(--accent-soft);opacity:.75;transition:opacity .12s;user-select:none}
.doci:hover,.doci:focus,.doci.on{opacity:1;border-color:var(--accent);outline:none}
.docn{margin-left:4px;font-weight:600}
.docref{margin:7px 0;padding-left:9px;border-left:2px solid var(--line)}
.docref-where{font-family:var(--mono);font-size:11px;color:var(--accent)}
.docref-where .bd{margin-left:6px}
.docref-ctx{font-size:11.5px;color:var(--muted);margin-top:2px}
/* @overload — one block per alternative call shape, indented under the
   primary signature so it reads as "also, this" rather than a second
   function. Left border rather than a background: a filled block here would
   compete with the deprecation banner for the reader's eye, and this is a
   much quieter fact. */
.fn-overloads{margin:6px 0 0 0;padding-left:10px;border-left:2px solid var(--line)}
.fn-ov-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:2px}
.fn-ov-sig{font-family:var(--mono);font-size:12px;color:var(--ink)}
.fn-ov-raw{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-style:italic}
code{font-family:var(--mono);font-size:.92em;background:var(--accent-soft);
  padding:1px 4px;border-radius:4px}
#findings{padding:0 24px 50px}
#findings table{border-collapse:collapse;width:100%;font-size:12.5px}
#findings th{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);
  color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
#findings td{padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:top}
#findings td.msg{font-family:var(--mono);font-size:11.5px;word-break:break-word}
.sev{font-weight:650;text-transform:uppercase;font-size:10px;letter-spacing:.05em}
.sev.error{color:var(--error)} .sev.warn{color:var(--warn)} .sev.info{color:var(--info)}
details>summary{cursor:pointer;font-size:13px;color:var(--muted);padding:8px 0}
.wrap{overflow-x:auto}
#view-notes{padding:22px 26px 60px}
#view-notes h3{margin:26px 0 4px;font-size:13px;font-weight:600;color:var(--ink)}
#view-notes h3:first-child{margin-top:0}
#view-notes .nsub,#view-index .nsub,#view-analysis .nsub{font-size:12px;color:var(--muted);
  margin:0 0 10px}
#view-notes .ncount,#view-index .ncount{color:var(--muted);font-weight:400;font-size:11.5px;
  margin-left:6px}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{padding:7px 0;border-bottom:1px dashed var(--line)}
.nlist li:last-child{border-bottom:0}
.nlist .nfn{font-family:var(--mono);font-size:12.5px;color:var(--accent);
  text-decoration:none;font-weight:600;cursor:pointer}
.nlist .nfn:hover{text-decoration:underline}
.nlist .nwhere{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:8px}
.nlist .ntext{font-size:12.5px;color:var(--ink);margin-top:2px}
.nlist .ntext.none{color:var(--muted);font-style:italic}
#hist-list{padding:12px 8px 60px 16px;border-right:1px solid var(--line);
  max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#hist-list{max-height:none;border-right:0;
  border-bottom:1px solid var(--line)}}
#hist-detail{padding:22px 26px 60px;max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#hist-detail{max-height:none}}
.crow{padding:5px 8px;border-radius:6px;cursor:pointer}
.crow:hover{background:var(--accent-soft)}
.crow.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.crow .csub{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.crow .cmeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:1px}
.hist-approx{color:var(--warn);font-size:11.5px;border:1px solid var(--warn);
  border-radius:5px;padding:5px 8px;margin:0 0 12px}
.hist-sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:18px 0 7px;font-weight:600}
.hist-fn{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600}
.hist-callers{list-style:none;margin:2px 0 8px;padding:0 0 0 14px}
.hist-callers li{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:1px 0}
.hist-mods{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 4px}
.hist-mods a{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--accent);cursor:pointer;text-decoration:none}
.hist-mods a:hover{border-color:var(--accent);background:var(--accent-soft)}
.hist-mods span.gone{font-family:var(--mono);font-size:11.5px;padding:2px 7px;
  border-radius:5px;border:1px dashed var(--line);color:var(--muted)}
.hist-diff{font-family:var(--mono);font-size:11px;white-space:pre;overflow-x:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  max-height:460px;overflow-y:auto}
.hist-diff .da{color:var(--file)} .hist-diff .dd{color:var(--error)}
.hist-diff .dh{color:var(--accent);font-weight:600} .hist-diff .dm{color:var(--muted)}
#view-index{padding:22px 26px 60px}
#ixtoggle{margin-bottom:14px}
#view-analysis{padding:22px 26px 60px}
#antoggle{margin-bottom:14px}
.antable{width:100%;border-collapse:collapse;font-size:12.5px}
.antable th.ansort{cursor:pointer;user-select:none;white-space:nowrap}
.antable th.ansort:hover{color:var(--ink)}
.antable th.ansort.active{color:var(--accent)}
.antable th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;
  text-transform:uppercase;letter-spacing:.03em;padding:4px 8px;border-bottom:1px solid var(--line)}
.antable td{padding:5px 8px;border-bottom:1px dashed var(--line);font-family:var(--mono)}
.anrow{cursor:pointer}
.anrow:hover td{background:var(--accent-soft)}
.anflag{color:var(--warn);font-size:11px;border:1px solid var(--warn);
  border-radius:4px;padding:1px 5px;margin-left:6px}
.anbar{width:120px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.anfill{height:100%;background:var(--accent)}
#view-index h3{margin:22px 0 6px;font-size:15px;font-weight:700;color:var(--accent);
  font-family:var(--mono);border-bottom:1px solid var(--line);padding-bottom:3px}
.ixjump{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 6px;position:sticky;top:0;
  background:var(--bg);padding:6px 0;z-index:2}
.ixjump a{font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--accent);cursor:pointer;text-decoration:none}
.ixjump a:hover{border-color:var(--accent);background:var(--accent-soft)}
.ixlist li{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:3px 0}
.ixtag{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:0 4px}
.ixtag.dep{color:var(--error);border-color:var(--error)}
.ixtag.tested{color:var(--accent);border-color:var(--accent)}
#view-hierarchy{padding:16px 24px 60px}
.hctl{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.hctl .hpath{font-family:var(--mono);font-size:12.5px;color:var(--muted);word-break:break-all}
.hctl button{padding:4px 9px;font-size:12px}
#hgraph-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
/* Middle-drag panning. `grabbing` only while a drag is live — a permanent
   grab cursor would advertise left-drag panning, which is deliberately not
   what this does. `user-select:none` is on the dragging state only, so text
   in the boxes stays selectable the rest of the time. */
#hgraph-wrap.panning{cursor:grabbing;user-select:none}
#hgraph{position:relative}
/* The zoom lives on its own layer. #hstage carries the transform and keeps the
   analytic pixel layout; #hgraph is sized to the *scaled* extent, because a
   transform does not change layout size and the scroll area would otherwise
   not grow when zooming in. */
#hstage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#hstage.zooming{transition:none}
#hstage.jumping{transition:transform .34s cubic-bezier(.2,.7,.2,1)}
/* Level of detail: below ~0.65 the secondary line is unreadable grey noise,
   so it goes away rather than being rendered illegibly. Pure CSS — no redraw. */
#hstage.lod-min .hsm,#hstage.lod-min .hline,#hstage.lod-min .hkind{display:none}
#hstage.lod-min .hnode{padding:4px 8px}
.hzoom{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:44px;
  text-align:right}
@media (prefers-reduced-motion:reduce){#hstage.jumping{transition:none}}
.hnode{position:absolute;box-sizing:border-box;padding:7px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel);cursor:pointer;overflow:hidden}
.hnode:hover{border-color:var(--accent);z-index:1}
.hnode .hnm{font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.hnode .hsm{font-size:10.5px;color:var(--muted);margin-top:2px;max-height:2.6em;overflow:hidden}
.hnode.k-module .hnm{color:var(--mod)} .hnode.k-namespace .hnm{color:var(--ns)} .hnode.k-file .hnm{color:var(--file)}
#hsvg{position:absolute;top:0;left:0;pointer-events:none}
.hedge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.6}
.hedge-type{stroke:var(--accent);stroke-dasharray:4 3;opacity:.75}
.hedge-ext{stroke:var(--ext);stroke-width:2;opacity:.9}
.hmsg{color:var(--muted);font-size:13px;padding:20px;text-align:center}
.htrunc{color:var(--warn);font-size:12px;margin-top:8px}
.hview-toggle{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.hview-toggle button{border:none;border-radius:0;padding:4px 10px;font-size:12px}
.hview-toggle button+button{border-left:1px solid var(--line)}
.hview-toggle button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.hnode.t-class .hnm{color:var(--mod)}
.hnode.t-alias .hnm{color:var(--ns)}
.hnode .hkind{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:1px}
/* --- Stats grid + module-scope symbols in the detail pane --------------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;
  margin-bottom:6px}
.stat{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--panel)}
.stat b{display:block;font-size:15px;font-weight:650;font-family:var(--mono)}
.stat span{font-size:10.5px;color:var(--muted)}
.sec .sub{text-transform:none;letter-spacing:0;font-weight:400;font-size:10.5px}
.lst.syms li{padding:4px 0;color:var(--ink)}
.sdet{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.bd.sk-table{color:var(--mod);border-color:var(--mod)}
.bd.sk-constant{color:var(--file);border-color:var(--file)}
.bd.sk-binding{color:var(--ns)}
#findings tbody tr[data-node]{cursor:pointer}
#findings tbody tr[data-node]:hover{background:var(--accent-soft)}
/* --- Quicks ------------------------------------------------------------- */
.qk-wrap{padding:18px 24px;max-width:1100px}
.qk-col{margin-bottom:22px}
.qk-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin-bottom:9px}
.qk{border:1px solid var(--line);border-left-width:3px;border-radius:8px;background:var(--panel);
  padding:11px 14px;margin-bottom:8px}
.qk.good{border-left-color:var(--ok,#3f9142)}
.qk.bad{border-left-color:var(--error)}
.qk-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qk-line{font-size:14px;font-weight:600;color:var(--ink)}
.qk-val{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
/* The reason a verdict is allowed to be a sentence at all — see quicks.lua's
   header. Quieter than the sentence, never hidden behind a disclosure. */
.qk-basis{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.qk-acts{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap}
.qk-acts button{font-size:11.5px;padding:3px 9px}
.qk-none{color:var(--muted);font-size:13px;padding:6px 0}
/* --- Compare marks ------------------------------------------------------ */
/* Sits beside `.sigi` rather than replacing its click: that click already
   pins the annotation popup open, which is what makes a long `@example`
   readable, and taking it over would trade one affordance for another. */
.marki{display:inline-block;margin-left:3px;padding:0 4px;border-radius:4px;cursor:pointer;
  font-size:10.5px;line-height:15px;color:var(--muted);border:1px solid var(--line);
  opacity:.45;transition:opacity .12s,color .12s,background .12s;user-select:none}
.marki:hover,.marki:focus{opacity:1;color:var(--accent);border-color:var(--accent);outline:none}
li:hover>.marki,tr:hover .marki{opacity:.8}
.marki.on{opacity:1;color:var(--bg);background:var(--accent);border-color:var(--accent)}
.markbar{white-space:nowrap}
.markbar.has{color:var(--accent);border-color:var(--accent);font-weight:600}
/* --- Compare tab -------------------------------------------------------- */
#cmpbody{padding:14px 24px}
.cmp-cols{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.cmp-cols .cmp-card{flex:0 0 340px}
.cmp-stack .cmp-card{margin-bottom:12px}
.cmp-card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 14px}
.cmp-card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  margin-bottom:6px}
.cmp-where{font-family:var(--mono);font-size:11px;color:var(--accent)}
.cmp-drop{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 3px}
.cmp-drop:hover{color:var(--error)}
.cmptable{width:100%;border-collapse:collapse;font-size:12.5px}
.cmptable th,.cmptable td{border:1px solid var(--line);padding:6px 9px;text-align:left;
  vertical-align:top}
.cmptable thead th{background:var(--panel);position:sticky;top:0;font-size:11.5px}
.cmptable tbody th{background:var(--panel);font-weight:600;color:var(--muted);
  font-size:11.5px;white-space:nowrap}
/* The point of the matrix: a row where every marked object agrees is not what
   the reader came for, so the ones that differ are the ones that are lit. */
.cmptable tr.differs td{background:var(--accent-soft)}
.cmptable tr.differs th{color:var(--ink)}
.cmp-scroll{overflow-x:auto}

/* --- Function rows in the tree ------------------------------------------ */
.row.k-fn .nm{color:var(--fn)}
.row.fnhead .nm{color:var(--muted);font-style:italic}
.fnkids.hide{display:none}

/* --- Graph: edge kinds, arrowheads, legend ------------------------------ */
.hedge-dep{stroke:var(--dep);opacity:.8}
.hedge-dep.deferred{stroke-dasharray:2 4;opacity:.55}
.hedge-dep.external{stroke-dasharray:6 3;opacity:.5}
.hnode.k-external{border-style:dashed;background:none}
.hnode.k-external .hnm{color:var(--muted)}
.hnode.k-external.linked{border-style:solid;border-color:var(--accent)}
.hnode.k-external.linked .hnm{color:var(--accent)}
.hlegend .sw.dep.external{border-top-style:dashed}
#hext.active button{background:var(--accent-soft);color:var(--accent);font-weight:600}
.hedge-call{stroke:var(--call);opacity:.8}
.hedge-call.weak{stroke-dasharray:3 4;opacity:.5}
#hsvg marker path{stroke:none}
#m-tree path{fill:var(--muted)}
#m-type path{fill:var(--accent)}
#m-ext path{fill:var(--ext)}
#m-dep path{fill:var(--dep)}
#m-call path{fill:var(--call)}
.hlegend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0 0;
  font-size:11.5px;color:var(--muted)}
.hlegend .lg{display:inline-flex;align-items:center;gap:5px}
.hlegend .sw{width:20px;height:0;border-top:2px solid var(--muted)}
.hlegend .sw.type{border-top-style:dashed;border-top-color:var(--accent)}
.hlegend .sw.ext{border-top-color:var(--ext);border-top-width:3px}
.hlegend .sw.dep{border-top-color:var(--dep)}
.hlegend .sw.dep.deferred{border-top-style:dotted}
.hlegend .sw.call{border-top-color:var(--call)}
.hlegend .sw.call.weak{border-top-style:dashed}
.hlegend .bx{width:11px;height:11px;border-radius:3px;border:1px solid currentColor}
.hnode.k-fn .hnm{color:var(--fn)}
.hnode.center{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.hnode .hline{font-size:9.5px;color:var(--muted);margin-top:1px;font-family:var(--mono)}

/* --- Graph: movement ---------------------------------------------------
   Boxes keep their identity across redraws (see reconcile() in the JS), so a
   re-center animates the boxes that survive from their old position to their
   new one instead of the whole diagram cutting. left/top are transitioned
   rather than transform, because positions are already absolute pixels
   computed from the IR — a transform would need a second coordinate system
   for no gain. */
.hnode{transition:left .34s cubic-bezier(.2,.7,.2,1),top .34s cubic-bezier(.2,.7,.2,1),
  opacity .22s ease,border-color .15s ease}
.hnode.entering{opacity:0;transform:scale(.94)}
.hnode.leaving{opacity:0;pointer-events:none}
#hsvg{transition:opacity .18s ease}
#hsvg.settling{opacity:0}
.hnode.pulse{animation:hpulse .7s ease-out}
@keyframes hpulse{
  0%{box-shadow:0 0 0 0 var(--accent)}
  100%{box-shadow:0 0 0 12px transparent}
}
/* Hover focus: dim everything that is not a direct neighbour. Class-driven so
   it costs no layout recomputation on a graph that can hold 90 boxes. */
#hgraph.focusing .hnode{opacity:.22}
#hgraph.focusing .hnode.near{opacity:1}
#hgraph.focusing .hedge{opacity:.08}
#hgraph.focusing .hedge.near{opacity:1;stroke-width:2}
.hedge{transition:opacity .15s ease}
@media (prefers-reduced-motion:reduce){
  .hnode,#hsvg,.hedge{transition:none}
  .hnode.pulse{animation:none}
}

/* --- Context menu ------------------------------------------------------- */
#ctx{position:fixed;z-index:50;min-width:210px;padding:5px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel);box-shadow:0 8px 28px rgba(0,0,0,.18);display:none}

#ctx .ci .hint{margin-left:auto;font-size:10.5px;color:var(--muted)}
#ctx .sep{height:1px;background:var(--line);margin:4px 6px}
#ctx .hdr{padding:5px 10px 6px;font-family:var(--mono);font-size:11px;color:var(--muted);
  max-width:280px;overflow:hidden;text-overflow:ellipsis}

d":true,"generic":[],"internal":false,"line":215,"line_end":249,"local_refs":0,"name":"M.list","nodiscard":false,"overload":[],"params":[{"desc":"1-basierte Startzeile (für `:'<,'>Image list`)","name":"first","optional":false,"type":"integer|nil"},{"desc":"1-basierte Endzeile","name":"last","optional":false,"type":"integer|nil"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"10be0206-7d54b7b0","shape_size":327,"signature":"M.list(first, last)","snippet":"function M.list(first, last)\n  local found, missing = require(\"images.scan\").buffer(0, first, last)\n\n  if #missing > 0 then notify().warn((\"%d Bildlink(s) nicht auflösbar, z.B. %s\"):format(#missing, missing[1])) end\n  if #found == 0 then\n    notify().info(\"Keine Bilder in diesem Buffer\")\n    return\n  end\n  if #found == 1 then\n    M.show(found[1].path)\n    return\n  end\n\n  ---@param item ImagesNvim.Target\n  local function format_item(item)\n    return (\"%4d  %s\"):format(item.lnum, item.raw)\n  end\n\n  local k = kit()\n  if k and k.select then\n    k.select({\n      items = found,\n      title = \"Bilder in diesem Buffer\",\n      format_item = format_item,\n      on_select = function(choice)\n        if choice then M.show(choice.path) end\n      end,\n    })\n    return\n  end\n\n  vim.ui.select(found, { prompt = \"Bild anzeigen\", format_item = format_item }, function(choice)\n    if choice then M.show(choice.path) end\n  end)\nend","snippet_omitted":0,"summary":"Bilder des Buffers auflisten und eines zur Anzeige auswählen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":9,"documented":true,"generic":[],"internal":false,"line":254,"line_end":287,"local_refs":0,"name":"M.step","nodiscard":false,"overload":[],"params":[{"desc":"1 = weiter, -1 = zurück","name":"delta","optional":false,"type":"integer"}],"returns":[{"desc":"","name":"ok","type":"boolean"}],"see":[],"shape":"55a86ed-31d12415","shape_size":362,"signature":"M.step(delta)","snippet":"function M.step(delta)\n  local buf = vim.api.nvim_get_current_buf()\n  local found = require(\"images.scan\").buffer(buf)\n  if #found == 0 then\n    notify().info(\"Keine Bilder in diesem Buffer\")\n    return false\n  end\n\n  local index\n  if cursor_state and cursor_state.buf == buf then\n    index = cursor_state.index + delta\n  else\n    -- Erster Aufruf im Buffer: beim Bild starten, das dem Cursor am nächsten\n    -- liegt, statt stumpf bei 1 — sonst springt man aus der Mitte eines langen\n    -- Dokuments unerwartet an den Anfang.\n    local lnum = vim.api.nvim_win_get_cursor(0)[1]\n    index = 1\n    for i, t in ipairs(found) do\n      if t.lnum <= lnum then index = i end\n    end\n    if delta > 0 and found[index] and found[index].lnum <= lnum then index = index + delta end\n  end\n\n  -- Umlaufen statt an den Enden anzustoßen.\n  index = ((index - 1) % #found) + 1\n  cursor_state = { buf = buf, index = index }\n\n  local target = found[index]\n  -- Der Scan lief über den Buffer-Inhalt; die Zeile kann durch eine\n  -- zwischenzeitliche Änderung außerhalb des gültigen Bereichs liegen.\n  local line_count = vim.api.nvim_buf_line_count(buf)\n  pcall(vim.api.nvim_win_set_cursor, 0, { math.min(target.lnum, line_count), 0 })\n  return M.show(target.path)\nend","snippet_omitted":0,"summary":"Zum nächsten/vorherigen Bild des Buffers springen und es anzeigen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":true,"generic":[],"internal":false,"line":294,"line_end":321,"local_refs":11,"name":"M.info","nodiscard":false,"overload":[],"params":[{"desc":"nil = Bild unter dem Cursor","name":"path","optional":false,"type":"string|nil"}],"returns":[{"desc":"","name":"ok","type":"boolean"}],"see":[],"shape":"12daad9b-4e72e569","shape_size":272,"signature":"M.info(path)","snippet":"function M.info(path)\n  local file\n  if path then\n    file = require(\"images.resolve\").to_path(path)\n  else\n    local target = require(\"images.resolve\").under_cursor( sort(found)\n  return found\nend","snippet_omitted":0,"summary":"Bilddateien unterhalb `root` einsammeln (Breitensuche, iterativ statt rekursiv — vermeidet Stack-Tiefe bei sehr verschachtelten Bäumen).","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":true,"generic":[],"internal":false,"line":87,"line_end":90,"local_refs":1,"name":"M.scan","nodiscard":false,"overload":[],"params":[{"desc":"absoluter Verzeichnispfad","name":"root","optional":false,"type":"string"}],"returns":[{"desc":"Pfade, sortiert","name":"absolute","type":"string[]"}],"see":[],"shape":"5a578862-343b6805","shape_size":46,"signature":"M.scan(root)","snippet":"function M.scan(root)\n  local c = cfg()\n  return walk(root, c.display.browse_exclude, c.extensions)\nend","snippet_omitted":0,"summary":"Bilddateien unterhalb `root` sammeln, mit der konfigurierten Ausschlussliste und den konfigurierten Endungen.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":10,"documented":true,"generic":[],"internal":false,"line":97,"line_end":117,"local_refs":1,"name":"M.roots","nodiscard":false,"overload":[],"params":[{"desc":"\"cfile\"|\"cwd\"|\"path\"; nil = \"cwd\"","name":"scope","optional":false,"type":"string|nil"},{"desc":"bei scope=\"path\": das Zielverzeichnis","name":"arg","optional":false,"type":"string|nil"}],"returns":[{"desc":"normalisiert (siehe `images.resolve.normalize_path`)","name":"root","type":"string|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"688774e1-b1d2c5a","shape_size":307,"signature":"M.roots(scope, arg)","snippet":"function M.roots(scope, arg)\n  scope = scope or \"cwd\"\n  local resolve = require(\"images.resolve\")\n\n  if scope == \"path\" then\n    if not arg or arg == \"\" then return nil, \"`path`-Scope braucht ein Verzeichnis: :Image pickers path <dir>\" end\n    local expanded = vim.fn.fnamemodify(vim.fn.expand(arg), \":p\")\n    if vim.fn.isdirectory(expanded) == 0 then return nil, \"Kein Verzeichnis: \" .. arg end\n    return resolve.normalize_path(expanded)\n  end\n\n  if scope == \"cfile\" then\n    local name = vim.api.nvim_buf_get_name(0)\n    if name == \"\" then return nil, \"Aktueller Buffer hat keinen Dateipfad\" end\n    return resolve.normalize_path(vim.fn.fnamemodify(name, \":p:h\"))\n  end\n\n  if scope == \"cwd\" then return resolve.normalize_path(vim.uv.cwd() or vim.fn.getcwd()) end\n\n  return nil, \"Unbekannter Scope: \" .. tostring(scope) .. \" (erwartet cfile|cwd|path)\"\nend","snippet_omitted":0,"summary":"Scope-Argument zu einem einzelnen Root-Verzeichnis auflösen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":false,"generic":[],"internal":false,"line":120,"line_end":122,"local_refs":4,"name":"notify","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"-Handle aus lib.nvim","name":"notify","type":"table"}],"see":[],"shape":"3cc5bc31-1ebaec9e","shape_size":32,"signature":"notify()","snippet":"local function notify()\n  return require(\"lib.nvim.notify\").create(\"[images]\")\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":4,"documented":false,"generic":[],"internal":false,"line":125,"line_end":128,"local_refs":2,"name":"snacks_picker","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":".picker, falls installiert","name":"snacks","type":"table|nil"}],"see":[],"shape":"6043c6e9-543f75d2","shape_size":56,"signature":"snacks_picker()","snippet":"local function snacks_picker()\n  local ok, picker = pcall(require, \"snacks.picker\")\n  return (ok and type(picker) == \"table\") and picker or nil\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":true,"generic":[],"internal":false,"line":132,"line_end":134,"local_refs":1,"name":"M.snacks_available","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"boolean"}],"see":[] "files","optional":false,"type":"string[]"}],"returns":[],"see":[],"shape":"3f1cf643-347ddae9","shape_size":395,"signature":"open_snacks(root, files)","snippet":"local function open_snacks(root, files)\n  local Picker = snacks_picker()\n  if not Picker then\n    notify().error(\"snacks.picker nicht verfügbar\")\n    return\n  end\n\n  local items = {}\n  for i, path in ipairs(files) do\n    items[i] = { text = path, file = path }\n  end\n\n  Picker.pick({\n    source = \"images_browse\",\n    title = \"Bilder: \" .. root,\n    items = items,\n    format = \"file\",\n    preview = function(ctx)\n      ctx.preview:reset()\n      if not draw_in_window(ctx.item.file, ctx.win) then ctx.preview:notify(\"Bild kann hier nicht gezeichnet werden\", \"warn\") end\n    end,\n    -- `<Tab>` ist snacks' eigene Multi-Select-Taste (nicht von images.nvim\n    -- verdrahtet). `picker:selected({fallback=true})` liefert die markierten\n    -- Treffer, oder — ohne Markierung — den einen hervorgehobenen: mehrere\n    -- Bilder ergeben eine Galerie, ein einzelnes die normale Einzelanzeige.\n    confirm = function(picker, item)\n      local selected = picker:selected({ fallback = true })\n      picker:close()\n      if #selected > 1 then\n        local paths = {}\n        for i, sel in ipairs(selected) do\n          paths[i] = sel.file\n        end\n        require(\"images\").gallery(paths)\n      elseif item then\n        require(\"images\").show(item.file)\n      end\n    end,\n    -- Das Overlay hängt am Terminal, nicht am Picker-Fenster — beim Schließen\n    -- (egal ob per Auswahl oder Esc) bleibt es sonst hängen bis zum nächsten","snippet_omitted":6,"summary":"Picker mit Live-Bildvorschau über `snacks.picker` öffnen.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":4,"documented":true,"generic":[],"internal":false,"line":217,"line_end":234,"local_refs":1,"name":"open_select","nodiscard":false,"overload":[],"params":[{"desc":"","name":"root","optional":false, ") or \"\"):lower() == \"svg\"\nend","snippet_omitted":0,"summary":"","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":36,"line_end":40,"local_refs":1,"name":"cache_dir","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"113a7e20-d6864bd","shape_size":80,"signature":"cache_dir()","snippet":"local function cache_dir()\n  local dir = vim.fn.stdpath(\"cache\") .. \"/images.nvim/svg\"\n  if vim.fn.isdirectory(dir) == 0 then pcall(vim.fn.mkdir, dir, \"p\") end\n  return dir\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":9,"documented":true,"generic":[],"internal":false,"line":46,"line_end":68,"local_refs":0,"name":"M.to_png","nodiscard":false,"overload":[],"params":[{"desc":"absoluter Pfad zu einer .svg-Datei","name":"path","optional":false,"type":"string"}],"returns":[{"desc":"","name":"png_path","type":"string|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"5ea9710c-5781aec4","shape_size":333,"signature":"M.to_png(path)","snippet":"function M.to_png(path)\n  if vim.fn.executable(\"magick\") == 0 then return nil, \"SVG braucht ImageMagick (`magick` nicht gefunden)\" end\n\n  local stat = vim.uv.fs_stat(path)\n  if not stat then return nil, \"Datei nicht gefunden: \" .. path end\n\n  -- sha256 aus Pfad+mtime als Dateiname: kollisionsfrei genug für einen\n  -- Cache, und ein geändertes SVG bekommt automatisch einen neuen Schlüssel.\n  local key = vim.fn.sha256(path .. \":\" .. tostring(stat.mtime and stat.mtime.sec or 0))\n  local out = cache_dir() .. \"/\" .. key .. \".png\"\n\n  if vim.uv.fs_stat(out) then return out end\n\n  -- -background none: transparenter Hintergrund statt eines erratenen\n  -- Weiß/Schwarz, das auf einem farbigen Terminalhintergrund falsch aussähe.\n  local result = vim.system({ \"magick\", path, \"-background\", \"none\", out }, { text = true }):wait()\n  if result.code ~= 0 then\n    pcall(vim.uv.fs_unlink, out)\n    return nil, \"Konvertierung fehlgeschlagen: \" .. vim.trim(result.stderr or \"\")\n  end\n  if not vim.uv.fs_stat(out) then return nil, \"Konvertierung lieferte keine Datei\" end\n  return out\nend","snippet_omitted":0,"summary":"SVG nach PNG konvertieren, mit Cache über Quellpfad + Änderungszeit.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":78,"line_end":89,"local_refs":0,"name":"M.to_pdf","nodiscard":false,"overload":[],"params":[{"desc":"absoluter Pfad zu einer Bilddatei","name":"path","optional":false,"type":"string"}],"returns":[{"desc":"","name":"pdf_path","type":"string|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"7a23cf2b-39bd8d96","shape_size":229,"signature":"M.to_pdf(path)","snippet":"function M.to_pdf(path)\n  if vim.fn.executable(\"magick\") == 0 then return nil, \"PDF-Export braucht ImageMagick (`magick` nicht gefunden)\" end\n\n  local stat = vim.uv.fs_stat(path)\n  if not stat then return nil, \"Datei nicht gefunden: \" .. path end\n\n  local out = vim.fn.fnamemodify(path, \":r\") .. \".pdf\"\n  local result = vim.system({ \"magick\", path, out }, { text = true }):wait()\n  if result.code ~= 0 then return nil, \"Export fehlgeschlagen: \" .. vim.trim(result.stderr or \"\") end\n  if not vim.uv.fs_stat(out) then return nil, \"Export lieferte keine Datei\" end\n  return out\nend","snippet_omitted":0,"summary":"Bild als PDF exportieren, neben der Quelldatei mit derselben Basis (\"bild.png\" → \"bild.pdf\").","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":11,"documented":true,"generic":[],"internal":false,"line":99,"line_end":120,"local_refs":0,"name":"M.redact","nodiscard":false,"overload":[],"params":[{"desc":"absoluter Pfad zu einer Bilddatei","name":"path","optional":false,"type":"string"},{"desc":"Pixelrechtecke, siehe `images.scale.cell_box_to_pixels`","name":"boxes","optional":false,"type":"{ x1: integer, y1: integer, x2: integer, y2: integer }[]"}],"returns":[{"desc":"","name":"out_path","type":"string|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"1d369401-36540867","shape_size":403,"signature":"M.redact(path, boxes)","snippet":"function M.redact(path, boxes)\n  if vim.fn.executable(\"magick\") == 0 then return nil, \"Schwärzen braucht ImageMagick (`magick` nicht gefunden)\" end\n  if not boxes or #boxes == 0 then return nil, \"Keine Box zum Schwärzen angegeben\" end\n\n  local stat = vim.uv.fs_stat(path)\n  if not stat then return nil, \"Datei nicht gefunden: \" .. path end\n\n  local ext = vim.fn.fnamemodify(path, \":e\")\n  local out = vim.fn.fnamemodify(path, \":r\") .. \".redacted.\" .. (ext ~= \"\" and ext or \"png\")\n\n  local args = { \"magick\", path, \"-fill\", \"black\" }\n  for _, box in ipairs(boxes) do\n    table.insert(args, \"-draw\")\n    table.insert(args, (\"rectangle %d,%d %d,%d\"):format(box.x1, box.y1, box.x2, box.y2))\n  end\n  table.insert(args, out)\n\n  local result = vim.system(args, { text = true }):wait()\n  if result.code ~= 0 then return nil, \"Schwärzen fehlgeschlagen: \" .. vim.trim(result.stderr or \"\") end\n  if not vim.uv.fs_stat(out) then return nil, \"Schwärzen lieferte keine Datei\" end\n  return out\nend","snippet_omitted":0,"summary":"Rechtecke schwarz übermalen und als neue Datei neben der Quelldatei ablegen (\"bild.png\" → \"bild.redacted.png\"), das Original bleibt unverändert.","test":[],"tested":true,"todo":[]}],"id":"lua/images/convert.lua","kind":"file","module":"images.convert","name":"convert.lua","parent":"lua/images","path":"lua/images/convert.lua","plugins":[],"required_by":["lua/images","lua/images/redact.lua","lua/images/terminal.lua"],"requires":[],"requires_external":[],"requires_raw":[],"source":"lua/images/convert.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":5,"lines":122,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Drei unabhängige Konvertierungen, ein Modul, weil alle drei dieselbe `magick`-Abhängigkeit und dieselbe Fehlerbehandlung teilen:","symbols":[],"types":[]},{"body":"Kein Fenster, kein State, keine Seiteneffekte — dadurch ist die Aufteilung ohne Terminal testbar.","calls_raw":[{"callee":"math.ceil","from_fn":"auto_columns","line":26},{"callee":"math.sqrt","from_fn":"auto_columns","line":26},{"callee":"math.max","from_fn":"auto_columns","line":27},{"callee":"math.min","from_fn":"auto_columns","line":27},{"callee":"auto_columns","from_fn":"M.layout","line":40},{"callee":"math.max","from_fn":"M.layout","line":41},{"callee":"math.min","from_fn":"M.layout","line":41},{"callee":"math.ceil","from_fn":"M.layout","line":42},{"callee":"math.max","from_fn":"M.layout","line":44},{"callee":"math.floor","from_fn":"M.layout","line":46},{"callee":"math.floor","from_fn":"M.layout","line":47},{"callee":"ipairs","from_fn":"M.layout","line":54},{"callee":"math.floor","from_fn":"M.layout","line":56}],"children":[],"depth":1,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":24,"line_end":28,"local_refs":1,"name":"auto_columns","nodiscard":false,"overload":[],"params":[{"desc":"","name":"count","optional":false,"type":"integer"}],"returns":[{"desc":"","type":"integer"}],"see":[],"shape":"5c25ee67-35b8d05c","shape_size":71,"signature":"auto_columns(count)","snippet":"local function auto_columns(count)\n  if count <= 1 then return 1 end\n  local cols = math.ceil(math.sqrt(count))\n  return math.max(1, math.min(cols, 4))\nend","snippet_omitted":0,"summary":"Spaltenzahl schätzen, wenn keine vorgegeben ist.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":true,"generic":[],"internal":false,"line":35,"line_end":76,"local_refs":0,"name":"M.layout","nodiscard":false,"overload":[],"params":[{"desc":"Absolute Pfade","name":"files","optional":false,"type":"string[]"},{"desc":"","name":"opts","optional":false,"type":"Images.Gallery.Opts"}],"returns":[{"desc":"","name":"placements","type":"Images.Placement[]"},{"desc":"Anzahl Bilder, für die kein Platz mehr war","name":"skipped","type":"integer"}],"see":[],"shape":"42ffc947-49a8b9ad","shape_size":441,"signature":"M.layout(files, opts)","snippet":"function M.layout(files, opts)\n  local placements = {}\n  local count = #files\n  if count == 0 then return placements, 0 end\n\n  local columns = opts.columns or auto_columns(count)\n  columns = math.max(1, math.min(columns, count))\n  local rows_needed = math.ceil(count / columns)\n\n  local gap = math.max(0, opts.gap or 1)\n  -- Verfügbare Fläche minus der Lücken, aufgeteilt auf die Kacheln.\n  local tile_w = math.floor((opts.width - gap * (columns - 1)) / columns)\n  local tile_h = math.floor((opts.height - gap * (rows_needed - 1)) / rows_needed)\n\n  -- Unter dieser Größe ist eine Kachel nicht mehr aussagekräftig; dann lieber\n  -- weniger Bilder zeigen als alle unlesbar.\n  if tile_w < 8 or tile_h < 4 then return placements, count end\n\n  local skipped = 0\n  for i, file in ipairs(files) do\n    local index = i - 1\n    local grid_row = math.floor(index / columns)\n    local grid_col = index % columns\n\n    local row = opts.top + grid_row * (tile_h + gap)\n    local col = opts.left + grid_col * (tile_w + gap)\n\n    if row + tile_h - 1 > opts.top + opts.height - 1 then\n      skipped = skipped + 1\n    else\n      placements[#placements + 1] = {\n        file = file,\n        row = row,\n        col = col,\n        cols = tile_w,\n        rows = tile_h,\n      }\n    end\n  end\n","snippet_omitted":2,"summary":"Bilder auf ein Raster verteilen.","test":[],"tested":true,"todo":[]}],"id":"lua/images/gallery.lua","kind":"file","module":"images.gallery","name":"gallery.lua","parent":"lua/images","path":"lua/images/gallery.lua","plugins":[],"required_by":["lua/images"],"requires":[],"require hen\n      vim.health.ok(\"`powershell.exe` gefunden — `:Image paste` verfügbar\")\n    else\n      vim.health.warn(\"`powershell.exe` nicht gefunden — `:Image paste` funktioniert nicht\")\n    end\n    return\n  end\n\n  if vim.fn.has(\"mac\") == 1 then\n    if vim.fn.executable(\"pngpaste\") == 1 then\n      vim.health.ok(\"`pngpaste` gefunden — `:Image paste` verfügbar\")\n    else\n      vim.health.warn(\"`pngpaste` fehlt\", { \"brew install pngpaste\" })\n    end\n    return\n  end\n\n  if vim.fn.executable(\"wl-paste\") == 1 then\n    vim.health.ok(\"`wl-paste` gefunden — `:Image paste` verfügbar\")\n  elseif vim.fn.executable(\"xclip\") == 1 then\n    vim.health.ok(\"`xclip` gefunden — `:Image paste` verfügbar\")\n  else\n    vim.health.warn(\"Weder `wl-paste` noch `xclip` gefunden — `:Image paste` funktioniert nicht\")\n  end\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":4,"documented":false,"generic":[],"internal":false,"line":68,"line_end":83,"local_refs":1,"name":"check_screenshot","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"4647ca42-b1413d3","shape_size":148,"signature":"check_screenshot()","snippet":"local function check_screenshot()\n  local screenshot = require(\"images.screenshot\")\n  if screenshot.available() then\n    if vim.fn.has(\"win32\") == 1 or vim.fn.has(\"win64\") == 1 then\n      vim.health.ok(\"Snipping Tool (`ms-screenclip:`) verfügbar — `:Image screenshot`\")\n    else\n      vim.health.ok(\"`:Image screenshot` verfügbar\")\n    end\n  else\n    -- info statt warn: :Image paste bleibt der unveränderte Weg, ohne\n    -- screenshot-fähige Werkzeuge geht nur der eine Zusatzbefehl nicht.\n    vim.health.info(\n      screenshot.unavailable_reason() .. \" — `:Image screenshot` bleibt aus, `:Image paste` funktioniert weiterhin\"\n    )\n  end\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async ippet":"function M.collect(path)\n  local stat = vim.uv.fs_stat(path)\n  if not stat then return nil, \"Datei nicht gefunden: \" .. path end\n\n  ---@type Images.Info\n  local info = {\n    path = path,\n    bytes = stat.size,\n    mtime = stat.mtime and stat.mtime.sec or 0,\n  }\n\n  if vim.fn.executable(\"magick\") == 1 then\n    -- `identify` als Subcommand von `magick`, nicht als eigenes Binary: auf\n    -- Windows kollidiert `convert.exe`/`identify.exe` mit den gleichnamigen\n    -- Systemprogrammen in System32.\n    local res = vim.system({ \"magick\", \"identify\", \"-format\", \"%m %w %h\", path .. \"[0]\" }, { text = true }):wait()\n    if res.code == 0 and res.stdout then\n      local fmt, w, h = res.stdout:match(\"^(%S+)%s+(%d+)%s+(%d+)\")\n      info.format = fmt\n      info.width = tonumber(w)\n      info.height = tonumber(h)\n    end\n  end\n\n  return info\nend","snippet_omitted":0,"summary":"Metadaten sammeln.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":66,"line_end":78,"local_refs":0,"name":"M.lines","nodiscard":false,"overload":[],"params":[{"desc":"","name":"info","optional":false,"type":"Images.Info"}],"returns":[{"desc":"","type":"string[]"}],"see":[],"shape":"775b423f-3a2c5207","shape_size":224,"signature":"M.lines(info)","snippet":"function M.lines(info)\n  local out = {\n    \"Pfad:    \" .. vim.fn.fnamemodify(info.path, \":~\"),\n    \"Größe:   \" .. M.human_size(info.bytes),\n  }\n  if info.width and info.height then\n    table.insert(out, 2, (\"Format:  %s %dx%d\"):format(info.format or \"?\", info.width, info.height))\n  elseif vim.fn.executable(\"magick\") == 0 then\n    out[#out + 1] = \"Format:  (ImageMagick nicht installiert)\"\n  end\n  if info.mtime > 0 then out[#out + 1] = \"Geändert: \" .. os.date(\"%Y-%m-%d %H:%M\", info.mtime) end\n  return out\nend","snippet_omitted":0,"summary":"Metadaten als Zeilen für eine Anzeige.","test":[],"tested":true, nd","line":65}],"children":[],"depth":1,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":5,"documented":true,"generic":[],"internal":false,"line":21,"line_end":28,"local_refs":1,"name":"target_dir","nodiscard":false,"overload":[],"params":[{"desc":"","name":"buf","optional":false,"type":"integer"}],"returns":[{"desc":"","type":"string|nil"}],"see":[],"shape":"36157081-35f1edc6","shape_size":156,"signature":"target_dir(buf)","snippet":"local function target_dir(buf)\n  local name = vim.api.nvim_buf_get_name(buf)\n  if name == \"\" then return nil end\n  local resolve = require(\"images.resolve\")\n  local doc_dir = resolve.normalize_path(vim.fn.fnamemodify(name, \":p:h\"))\n  local sub = require(\"images.config\").get().paste.dir or \"\"\n  return (sub ~= \"\") and (doc_dir .. \"/\" .. sub) or doc_dir\nend","snippet_omitted":0,"summary":"Zielverzeichnis wie beim Einfügen bestimmen (Dokumentverzeichnis + `paste.dir`).","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":34,"line_end":45,"local_refs":1,"name":"list_images","nodiscard":false,"overload":[],"params":[{"desc":"Bereits normalisiert (siehe `target_dir`)","name":"dir","optional":false,"type":"string"}],"returns":[{"desc":"","type":"string[]"}],"see":[],"shape":"2c6563de-442cf601","shape_size":154,"signature":"list_images(dir)","snippet":"local function list_images(dir)\n  local out = {}\n  local resolve = require(\"images.resolve\")\n  local handle = vim.uv.fs_scandir(dir)\n  if not handle then return out end\n  while true do\n    local name, kind = vim.uv.fs_scandir_next(handle)\n    if not name then break end\n    if kind == \"file\" and resolve.is_image(name) then out[#out + 1] = dir .. \"/\" .. name end\n  end\n  return out\nend","snippet_omitted":0,"summary":"Bilddateien in `dir` auflisten.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":7,"documented":true,"generic":[] ,{"body":"Das Bild landet als PNG neben dem Dokument (oder im konfigurierten Unterverzeichnis), der Markdown-Link wird an der Cursorposition eingefügt.\n\nMit `paste.ask_alt_text = true` fragt `M.run` vor dem Einfügen nach einem\nAlt-Text (über das UI-Kit aus lib.nvim, falls vorhanden). Default `false`,\ndamit der schnelle Fall — Screenshot, ein Tastendruck, fertig — nicht\ndurch eine Eingabeaufforderung unterbrochen wird, die die meisten\nAufrufe nicht brauchen.\n\nPlattformen:\n* Windows — `powershell.exe -STA` mit `System.Windows.Forms.Clipboard`.\n  Das `-STA` ist zwingend: die Zwischenablage-API verlangt einen\n  Single-Threaded-Apartment-Thread, sonst kommt immer `null` zurück.\n  Bewusst `powershell.exe` (5.1) statt `pwsh`, weil PowerShell 7 kein `-STA`\n  kennt und WinForms dort nicht zuverlässig verfügbar ist.\n* Linux — `wl-paste` (Wayland), sonst `xclip` (X11).\n* macOS — `pngpaste`, falls installiert.","calls_raw":[{"callee":"require(\"images.config\").get","from_fn":"cfg","line":27},{"callee":"require","from_fn":"cfg","line":27},{"callee":"require(\"lib.nvim.notify\").create","from_fn":"notify","line":32},{"callee":"require","from_fn":"notify","line":32},{"callee":"pcall","from_fn":"kit","line":39},{"callee":"vim.fn.has","from_fn":"clipboard_to_file","line":56},{"callee":"vim.fn.has","from_fn":"clipboard_to_file","line":56},{"callee":"table.concat","from_fn":"clipboard_to_file","line":57},{"callee":"(\"$img.Save('%s', [System.Drawing.Imaging.ImageFormat]::Png);\"):format","from_fn":"clipboard_to_file","line":61},{"callee":"out:gsub","from_fn":"clipboard_to_file","line":61},{"callee":"vim.fn.has","from_fn":"clipboard_to_file","line":64},{"callee":"vim.fn.executable","from_fn":"clipboard_to_file","line":65},{"callee":"callback","from_fn":"clipboard_to_file","line":66},{"callee":"vim.fn.executable","from_fn":"clipboard_to_file","line":71},{"callee":"(\"wl-paste --type image/png > '%s'\"):format","from_fn":"clipboard_to_file","line":72},{"callee":"vim.fn.ex :false,"type":"fun(ok: boolean, err: string|nil)"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"4775745d-696279db","shape_size":578,"signature":"clipboard_to_file(out, callback)","snippet":"local function clipboard_to_file(out, callback)\n  local cmd ---@type string[]\n\n  if vim.fn.has(\"win32\") == 1 or vim.fn.has(\"win64\") == 1 then\n    local ps = table.concat({\n      \"Add-Type -AssemblyName System.Windows.Forms,System.Drawing;\",\n      \"$img = [System.Windows.Forms.Clipboard]::GetImage();\",\n      \"if ($img -eq $null) { exit 3 };\",\n      (\"$img.Save('%s', [System.Drawing.Imaging.ImageFormat]::Png);\"):format(out:gsub(\"'\", \"''\")),\n    }, \" \")\n    cmd = { \"powershell.exe\", \"-NoProfile\", \"-NonInteractive\", \"-STA\", \"-Command\", ps }\n  elseif vim.fn.has(\"mac\") == 1 then\n    if vim.fn.executable(\"pngpaste\") == 0 then\n      callback(false, \"`pngpaste` nicht gefunden (brew install pngpaste)\")\n      return\n    end\n    cmd = { \"pngpaste\", out }\n  else\n    if vim.fn.executable(\"wl-paste\") == 1 then\n      cmd = { \"sh\", \"-c\", (\"wl-paste --type image/png > '%s'\"):format(out) }\n    elseif vim.fn.executable(\"xclip\") == 1 then\n      cmd = { \"sh\", \"-c\", (\"xclip -selection clipboard -t image/png -o > '%s'\"):format(out) }\n    else\n      callback(false, \"Weder `wl-paste` noch `xclip` gefunden\")\n      return\n    end\n  end\n\n  vim.system(cmd, { text = true }, function(result)\n    vim.schedule(function()\n      if result.code == 3 then\n        callback(false, \"Kein Bild in der Zwischenablage\")\n        return\n      end\n      if result.code ~= 0 then\n        callback(\n          false,\n          (\"Zwischenablage konnte nicht gelesen werden (exit %d): %s\"):format(result.code, vim.trim(result.stderr or \"\"))\n        )\n        return","snippet_omitted":12,"summary":"Zwischenablage-Bild nach `out` schreiben.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":110,"line_end":115,"local_refs":1,"name":"default_filename","nodiscard":false,"overload":[],"params":[{"desc":"","name":"buf","optional":false,"type":"integer"}],"returns":[{"desc":"nil, falls der Buffer keinen Dateinamen hat","name":"suggestion","type":"string|nil"}],"see":[],"shape":"6435c972-710284a4","shape_size":99,"signature":"default_filename(buf)","snippet":"local function default_filename(buf)\n  local name = vim.api.nvim_buf_get_name(buf)\n  if name == \"\" then return nil end\n  local doc_stem = vim.fn.fnamemodify(name, \":t:r\")\n  return cfg().paste.name_template:format(doc_stem, os.time())\nend","snippet_omitted":0,"summary":"Vorgeschlagener Dateiname nach dem Template — Vorbelegung für die Namensabfrage und Fallback, wenn keine eigene Eingabe kommt.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":5,"documented":true,"generic":[],"internal":false,"line":126,"line_end":131,"local_refs":4,"name":"sanitize_filename","nodiscard":false,"overload":[],"params":[{"desc":"Roher User-Input","name":"input","optional":false,"type":"string"}],"returns":[{"desc":"Dateiname mit `.png`, oder nil ohne brauchbaren Rest","name":"bereinigter","type":"string|nil"}],"see":[],"shape":"21d4304e-23897c02","shape_size":122,"signature":"sanitize_filename(input)","snippet":"local function sanitize_filename(input)\n  local base = vim.fn.fnamemodify(vim.trim(input or \"\"), \":t\")\n  local stem = vim.trim(vim.fn.fnamemodify(base, \":r\"))\n  if stem == \"\" or stem == \".\" or stem == \"..\" then return nil end\n  return stem .. \".png\"\nend","snippet_omitted":0,"summary":"User-Eingabe zu einem sicheren Dateinamen machen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":10,"documented":true,"generic":[],"internal":false,"line":141,"line_end":160,"local_refs":1,"name":"target_paths","nodiscard":false,"overload":[],"params":[{"desc":"","name":"buf","optional":false,"type":"integer"},{"desc":"bereits sanitisierter Name; nil = Template","name":"filename_override","optional":false,"type":"string|nil"}],"returns":[{"desc":"Pfad","name":"absoluter","type":"string|nil"},{"desc":"Pfad für den Link","name":"relativer","type":"string|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"3d494aab-6f21bc67","shape_size":324,"signature":"target_paths(buf, filename_override)","snippet":"local function target_paths(buf, filename_override)\n  local name = vim.api.nvim_buf_get_name(buf)\n  if name == \"\" then return nil, nil, \"Buffer hat keinen Dateinamen — bitte zuerst speichern\" end\n\n  local c = cfg().paste\n  local doc_dir = vim.fn.fnamemodify(name, \":p:h\")\n  local doc_stem = vim.fn.fnamemodify(name, \":t:r\")\n\n  local sub = c.dir or \"\"\n  local dir = (sub ~= \"\") and (doc_dir .. \"/\" .. sub) or doc_dir\n  if vim.fn.isdirectory(dir) == 0 then\n    local ok = pcall(vim.fn.mkdir, dir, \"p\")\n    if not ok then return nil, nil, \"Verzeichnis konnte nicht angelegt werden: \" .. dir end\n  end\n\n  local file = filename_override or c.name_template:format(doc_stem, os.time())\n  local abs = dir .. \"/\" .. file\n  local rel = (sub ~= \"\") and (sub .. \"/\" .. file) or file\n  return abs, rel, nil\nend","snippet_omitted":0,"summary":"Zielpfad für ein neues Bild bestimmen und das Verzeichnis anlegen.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":7,"documented":true,"generic":[],"internal":false,"line":174,"line_end":198,"local_refs":4,"name":"insert_link","nodiscard":false,"overload":[],"params":[{"desc":"","name":"buf","optional":false,"type":"integer"},{"desc":"Pfad relativ zum Dokument","name":"rel","optional":false,"type":"string"},{"desc":"Alt-Text; leer oder nil = kein Alt-Text","name":"alt","optional":false,"type":"string|nil"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"53f00e43-5d034abd","shape_size":348,"signature":"insert_link(buf, rel, alt)","snippet":"local function insert_link(buf, rel, alt)\n  if not vim.api.nvim_buf_is_valid(buf) then\n    notify().warn(\"Buffer nicht mehr vorhanden — Bild liegt unter \" .. rel)\n    return\n  end\n  if not vim.bo[buf].modifiable then\n    notify().warn(\"Buffer nicht änderbar — Bild liegt unter \" .. rel)\n    return\n  end\n\n  -- Backslashes im Link vermeiden: Markdown-Pfade sind portabler mit `/`.\n  local forward = (rel:gsub(\"\\\\\", \"/\"))\n  local c = cfg().paste\n  local link = (alt and alt ~= \"\") and c.alt_link_template:format(alt, forward) or c.link_template:format(forward)\n\n  local pos = vim.api.nvim_win_get_cursor(0)\n  local inserted = pcall(vim.api.nvim_buf_set_text, buf, pos[1] - 1, pos[2], pos[1] - 1, pos[2], { link })\n  if not inserted then\n    notify().warn(\"Link konnte nicht eingefügt werden — Bild liegt unter \" .. rel)\n    return\n  end\n  pcall(vim.api.nvim_win_set_cursor, 0, { pos[1], pos[2] + #link })\n\n  notify().info(\"Bild gespeichert: \" .. rel)\nend","snippet_omitted":0,"summary":"Link an der zum Zeitpunkt des Aufrufs gültigen Cursorposition einfügen.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":9,"documented":true,"generic":[],"internal":false,"line":212,"line_end":250,"local_refs":3,"name":"paste_with_name","nodiscard":false,"overload":[],"params":[{"desc":"","name":"buf","optional":false,"type":"integer"},{"desc":"bereits sanitisiert; nil = Template","name":"filename_override","optional":false,"type":"string|nil"},{"desc":"","name":"capture","optional":false,"type":"fun(out: string, cb: fun(ok: boolean, err: string|nil))"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"61f7d696-208c5db4","shape_size":276,"signature":"paste_with_name(buf, filename_override, capture)","snippet":"local function paste_with_name(buf, filename_override, capture)\n  local abs, rel, err = target_paths(buf, filename_override)\n  if not abs or not rel then\n    notify().error(err or \"Zielpfad unbestimmbar\")\n    return\n  end\n\n  capture(abs, function(ok, cap_err)\n    if not ok then\n      notify().warn(cap_err or \"Einfügen fehlgeschlagen\")\n      return\n    end\n\n    if not cfg().paste.ask_alt_text then\n      insert_link(buf, rel, nil)\n      return\n    end\n\n    local k = kit()\n    if k and k.input then\n      k.input({\n        title = \"Alt-Text (leer = ohne)\",\n        on_submit = function(alt)\n          insert_link(buf, rel, alt)\n        end,\n        -- Abbrechen soll den Link trotzdem setzen, nur ohne Alt-Text — das\n        -- Bild liegt an dieser Stelle bereits auf der Platte, ein verlorener\n        -- Link (kit.input ruft ohne on_cancel bei <Esc> gar nichts auf) wäre\n        -- die schlechtere Überraschung als ein Link ohne Alt-Text.\n        on_cancel = function()\n          insert_link(buf, rel, nil)\n        end,\n      })\n    else\n      local alt = vim.fn.input(\"Alt-Text (leer = ohne): \")\n      insert_link(buf, rel, alt)\n    end\n  end)\nend","snippet_omitted":0,"summary":"Zweiter Teil von `M.run`/`M.screenshot`, nach einer optionalen Namensabfrage: Bilddatei über `capture(abs, cb)` erzeugen und danach optional nach Alt-Text…","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":258,"line_end":290,"local_refs":2,"name":"capture_with_optional_name","nodiscard":false,"overload":[],"params":[{"desc":"","name":"capture","optional":false,"type":"fun(out: string, cb: fun(ok: boolean, err: string|nil))"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"307e740a-5a4c0b","shape_size":258,"signature":"capture_with_optional_name(capture)","snippet":"local function capture_with_optional_name(capture)\n  local buf = vim.api.nvim_get_current_buf()\n\n  if not cfg().paste.ask_filename then\n    paste_with_name(buf, nil, capture)\n    return\n  end\n\n  local suggested = default_filename(buf)\n  local k = kit()\n  if k and k.input then\n    k.input({\n      title = \"Dateiname\",\n      default = suggested,\n      on_submit = function(name)\n        paste_with_name(buf, sanitize_filename(name), capture)\n      end,\n      -- Anders als bei der Alt-Text-Abfrage: hier wurde noch nichts\n      -- aufgenommen oder geschrieben — Abbrechen heißt also tatsächlich\n      -- \"nichts tun\", nicht \"mit Standardwerten weitermachen\".\n      on_cancel = function()\n        notify().info(\"Abgebrochen\")\n      end,\n    })\n  else\n    local name = vim.fn.input(\"Dateiname: \", suggested or \"\")\n    if name == \"\" then\n      notify().info(\"Abgebrochen\")\n      return\n    end\n    paste_with_name(buf, sanitize_filename(name), capture)\n  end\nend","snippet_omitted":0,"summary":"Optional nach einem Dateinamen fragen, dann `paste_with_name` mit `capture` als Aufnahmefunktion ausführen.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":true,"generic":[],"internal":false,"line":295,"line_end":297,"local_refs":0,"name":"M.run","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"142eefe1-1447ad4b","shape_size":17,"signature":"M.run()","snippet":"function M.run()\n  capture_with_optional_name(clipboard_to_file)\nend","snippet_omitted":0,"summary":"Bild aus der Zwischenablage speichern und den Link an der Cursorposition einfügen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":303,"line_end":310,"local_refs":4,"name":"M.screenshot","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"595aa319-559f085d","shape_size":73,"signature":"M.screenshot()","snippet":"function M.screenshot()\n  local screenshot = require(\"images.screenshot\")\n  if not screenshot.available() then\n    notify().error(screenshot.unavailable_reason())\n    return\n  end\n  capture_with_optional_name(screenshot.capture)\nend","snippet_omitted":0,"summary":"Interaktive Bildschirm-Auswahl direkt in eine Datei aufne ation: Screenshot machen, `:Image paste`, fertig.","symbols":[{"detail":"sanitize_filename","kind":"binding","line":133,"name":"M.sanitize_filename","summary":""}],"types":[]},{"body":"Motivation: casedesk-Anhänge (Screenshots mit Kundendaten in `Ressources/`), die vor einer künftigen KI-Übergabe unkenntlich gemacht werden müssen können.\n\nDie eigentliche Hürde ist, dass ein per OSC 1337 gezeichnetes Bild für\nNeovim nicht interaktiv ist — Maus/Cursor liefern nur Zellkoordinaten,\nnie Pixelkoordinaten im Bild. Die Lösung hier: die Auswahl selbst passiert\nkomplett in Zellen, über echten Neovim-Visual-Mode auf einem mit\nLeerzeichen gefüllten Scratch-Buffer in Bildgröße (`v`/`<C-v>` + `<CR>`\nmarkiert eine Box, dieselbe Idee wie Visual-Block) — kein neues\nEingabe-System, keine Pixelmathematik während der Auswahl. Erst beim\nSchreiben (`w`) wird einmalig umgerechnet: `images.scale.fit_cells` wählt\ndie Zeichenbox so, dass `preserveAspectRatio=1` kaum noch etwas zu\nletterboxen hat (die Zellzahl wird an das Bildseitenverhältnis über eine\nangenommene, dokumentierte Zellbreite/-höhe angepasst, `images.scale.\nCELL_ASPECT` — keine echte Zellmessung, siehe dort), und `images.scale.\ncell_box_to_pixels` rechnet mit einer Sicherheitsmarge in Pixelkoordinaten\num. Gebrannt wird über `images.convert.redact` (ImageMagick, dritte\nbewusste Ausnahme von der \"kein ImageMagick als Pflicht\"-Leitplanke neben\nSVG-Anzeige und `:Image export`).\n\n**Nicht Teil der automatisierten Testsuite**: die Tastenlogik selbst\n(Visual-Mode-Erfassung, Fensteraufbau) braucht ein echtes Terminal mit\nOSC-1337-Unterstützung, um wirklich verifiziert zu werden — wie überall\nin dieser Suite bleibt \"Zeichnen\" ungeprüft (siehe TESTS/zen_spec.lua).\nDie reine Geometrie (`images.scale.fit_cells`/`cell_box_to_pixels`) und\ndas Brennen (`images.convert.redact`) sind dagegen getestet.","calls_raw":[{"callee":"require(\"images.config\").get","from_fn":"cfg","line":36},{"callee":"require","from_fn":"cfg" ail":"empty","kind":"table","line":64,"name":"boxes","summary":""},{"detail":"vim.api.nvim_create_namespace(\"images.redact\")","kind":"binding","line":66,"name":"ns","summary":""}],"types":[]},{"body":"`display.remote.enabled = true` schaltet es bewusst ein.\n\nGreift nur beim expliziten Anzeigen eines einzelnen Bildes (`:Image show`,\nHover), nicht beim Scannen (`:Image list`/`gallery`/`next`/`prev`/\n`orphans`, `images.resolve.to_path`) — sonst würde ein bloßes Auflisten\nder Bilder eines Buffers N Netzwerkanfragen auslösen, nur um eine Liste\nzu zeigen. `:Image gallery`/`compare`/`browse`/`zen` unterstützen\nRemote-Bilder aus demselben Grund (noch) nicht — offene Arbeit, siehe\ndocs/ROADMAP/FEATURES.md.","calls_raw":[{"callee":"target:match","from_fn":"M.is_remote","line":26},{"callee":"vim.fn.stdpath","from_fn":"cache_dir","line":31},{"callee":"vim.fn.isdirectory","from_fn":"cache_dir","line":32},{"callee":"pcall","from_fn":"cache_dir","line":32},{"callee":"vim.fn.sha256","from_fn":"cache_path","line":44},{"callee":"url:gsub","from_fn":"cache_path","line":45},{"callee":"path_part:match","from_fn":"cache_path","line":46},{"callee":"cache_dir","from_fn":"cache_path","line":47},{"callee":"ext:lower","from_fn":"cache_path","line":47},{"callee":"require(\"images.config\").get","from_fn":"cfg","line":52},{"callee":"require","from_fn":"cfg","line":52},{"callee":"cfg","from_fn":"M.fetch","line":61},{"callee":"cache_path","from_fn":"M.fetch","line":64},{"callee":"vim.uv.fs_stat","from_fn":"M.fetch","line":65},{"callee":"math.max","from_fn":"M.fetch","line":67},{"callee":"math.floor","from_fn":"M.fetch","line":67},{"callee":"vim.fn.executable","from_fn":"M.fetch","line":71},{"callee":"tostring","from_fn":"M.fetch","line":76},{"callee":"tostring","from_fn":"M.fetch","line":78},{"callee":"vim.fn.executable","from_fn":"M.fetch","line":83},{"callee":"tostring","from_fn":"M.fetch","line":85},{"callee":"tostring","from_fn":"M.fetch","line":85},{"callee":"vim.system(cmd, { text path(url)","snippet":"local function cache_path(url)\n  local key = vim.fn.sha256(url)\n  local path_part = url:gsub(\"[?#].*$\", \"\")\n  local ext = path_part:match(\"%.([%w]+)$\")\n  return cache_dir() .. \"/\" .. key .. (ext and (\".\" .. ext:lower()) or \"\")\nend","snippet_omitted":0,"summary":"Cache-Pfad für eine URL: Hash der URL, mit der Endung aus dem Pfadanteil (ohne Query/Fragment), falls erkennbar.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":false,"generic":[],"internal":false,"line":51,"line_end":53,"local_refs":1,"name":"cfg","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"ImagesNvim.Config"}],"see":[],"shape":"126cf180-7079429f","shape_size":28,"signature":"cfg()","snippet":"local function cfg()\n  return require(\"images.config\").get()\nend","snippet_omitted":0,"summary":"","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":11,"documented":true,"generic":[],"internal":false,"line":60,"line_end":103,"local_refs":0,"name":"M.fetch","nodiscard":false,"overload":[],"params":[{"desc":"","name":"url","optional":false,"type":"string"}],"returns":[{"desc":"","name":"local_path","type":"string|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"6b8cf92d-1833cbf8","shape_size":489,"signature":"M.fetch(url)","snippet":"function M.fetch(url)\n  local c = cfg().display.remote\n  if not c.enabled then return nil, \"Remote-Bilder sind deaktiviert (`display.remote.enabled = true` zum Einschalten)\" end\n\n  local out = cache_path(url)\n  if vim.uv.fs_stat(out) then return out end\n\n  local timeout_s = math.max(1, math.floor((c.timeout_ms or 10000) / 1000))\n  local max_bytes = c.max_bytes or (20 * 1024 * 1024)\n\n  local cmd\n  if vim.fn.executable(\"curl\") == 1 then\n    cmd = {\n      \"curl\",\n      \"-fsSL\",\n      \"--max-time\",\n      tostring(timeout_s),\n      \"--max-filesize\",\n      tostring(max_bytes),\n      \"-o\",\n      out,\n      url,\n    }\n  elseif vim.fn.executable(\"wget\") == 1 then\n    -- -Q<bytes>: Quota, das nächstbeste Aequivalent zu curls --max-filesize.\n    cmd = { \"wget\", \"-q\", \"--timeout=\" .. tostring(timeout_s), \"-Q\" .. tostring(max_bytes), \"-O\", out, url }\n  else\n    return nil, \"Weder `curl` noch `wget` gefunden\"\n  end\n\n  local result = vim.system(cmd, { text = true }):wait()\n  if result.code ~= 0 then\n    pcall(vim.uv.fs_unlink, out)\n    return nil, (\"Download fehlgeschlagen (exit %d): %s\"):format(result.code, vim.trim(result.stderr or \"\"))\n  end\n\n  local stat = vim.uv.fs_stat(out)\n  if not stat or stat.size == 0 then\n    pcall(vim.uv.fs_unlink, out)\n    return nil, \"Download lieferte keine Datei\"","snippet_omitted":4,"summary":"Bild von `url` laden, gecacht — ein zweiter Aufruf mit derselben URL lädt nicht erneut, sondern trifft den Cache.","test":[],"tested":true,"todo":[]}],"id":"lua/images/remote.lua","kind":"file","module":"images.remote","name":"remote.lua","parent":"lua/images","path":"lua/images/remote.lua","plugins":[],"required_by":["lua/images","lua/images/bindings/usrcmds.lua","lua/images/resolve.lua"],"requires":["lua/images/config"],"requires_external":[],"requires_raw":[{"deferred":true,"line":52,"module":"images.config"}],"source":"lua/images/remote.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":5,"lines":105,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Standardmäßig AUS: Ein Markdown-Dokument mit einem Remote-Bild-Link würde sonst schon beim bloßen Hover eine ausgehende Netzwerkanfrage auslösen —…","symbols":[],"types":[]},{"body":"","calls_raw":[{"callee":"require(\"images.config\").get","from_fn":"cfg","line":8},{"callee":"require","from_fn":"cfg","line":8},{"callee":"target:match","from_fn":"M.is_image","line":15},{"callee":"target:match","from_fn":"M.is_image","line":15},{"callee":"ext:lower","from_fn":"M.is_image","line":17},{"callee":"ipairs","from_fn":"M.is_image","line":18},{"call "signature":"M.links_in_line(line)","snippet":"function M.links_in_line(line)\n  local out = {}\n  local init = 1\n  while true do\n    local s, e, target = line:find(\"%]%(([^)]+)%)\", init)\n    if not s then break end\n    -- Beginn des Links inklusive `![alt` bzw. `[text`, damit der Cursor\n    -- irgendwo im Link genügt und nicht nur im Klammerteil stehen muss.\n    local from = line:sub(1, s):find(\"!?%[[^%[]*$\") or s\n    out[#out + 1] = { target = target, from = from, to = e }\n    init = e + 1\n  end\n  return out\nend","snippet_omitted":0,"summary":"Alle Markdown-Link-Ziele einer Zeile mit ihren Spaltenbereichen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":3,"documented":true,"generic":[],"internal":false,"line":53,"line_end":57,"local_refs":4,"name":"normalize","nodiscard":false,"overload":[],"params":[{"desc":"","name":"p","optional":false,"type":"string"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"7d6fb32d-234fe3ad","shape_size":78,"signature":"normalize(p)","snippet":"local function normalize(p)\n  local ok, utils = pcall(require, \"lib.nvim.normalize.utils\")\n  if ok and utils.normalize_path then return utils.normalize_path(p) end\n  return (p:gsub(\"\\\\\", \"/\"))\nend","snippet_omitted":0,"summary":"Pfad normalisieren: konsequent `/` statt eines Mixes aus `/` und `\\`.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":13,"documented":true,"generic":[],"internal":false,"line":66,"line_end":92,"local_refs":2,"name":"M.to_path","nodiscard":false,"overload":[],"params":[{"desc":"","name":"target","optional":false,"type":"string"},{"desc":"Buffer, gegen dessen Verzeichnis aufgelöst wird","name":"buf","optional":false,"type":"integer|nil"}],"returns":[{"desc":"Pfad, falls die Datei existiert","name":"absoluter","type":"string|nil"}],"see":[],"shape":"11ffce1d-695555e6","shape_size":381,"signature":"M.to_path(target, buf)","snippet":"function M.to_path(target, buf)\n  if target:match(\"^%a+://\") then\n    return nil -- Remote-URLs werden (noch) nicht geladen\n  end\n\n  local ok, path_util = pcall(require, \"markdown.util.path\")\n  if ok and type(path_util.resolve) == \"function\" then\n    local resolved = path_util.resolve(target)\n    if resolved and vim.uv.fs_stat(resolved) then return normalize(resolved) end\n  end\n\n  local expanded = vim.fn.expand(target)\n  if vim.uv.fs_stat(expanded) then return normalize(vim.fn.fnamemodify(expanded, \":p\")) end\n\n  local bases = {}\n  local name = vim.api.nvim_buf_get_name(buf or 0)\n  if name ~= \"\" then bases[#bases + 1] = vim.fn.fnamemodify(name, \":p:h\") end\n  bases[#bases + 1] = vim.uv.cwd()\n\n  for _, base in ipairs(bases) do\n    if base and base ~= \"\" then\n      local candidate = base .. \"/\" .. expanded\n      if vim.uv.fs_stat(candidate) then return normalize(vim.fn.fnamemodify(candidate, \":p\")) end\n    end\n  end\n  return nil\nend","snippet_omitted":0,"summary":"Relativen Pfad auflösen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":4,"documented":true,"generic":[],"internal":false,"line":105,"line_end":111,"local_refs":2,"name":"resolve_target","nodiscard":false,"overload":[],"params":[{"desc":"","name":"raw","optional":false,"type":"string"},{"desc":"","name":"lnum","optional":false,"type":"integer"}],"returns":[{"desc":"","type":"ImagesNvim.Target|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"132a9cfd-64210655","shape_size":138,"signature":"resolve_target(raw, lnum)","snippet":"local function resolve_target(raw, lnum)\n  if not M.is_image(raw) then return nil, \"Kein Bildziel: \" .. raw end\n  if require(\"images.remote\").is_remote(raw) then return { raw = raw, path = raw, lnum = lnum } end\n  local path = M.to_path(raw)\n  if not path then return nil, \"Bild nicht gefunden: \" .. raw end\n  return { raw = raw, path = path, lnum = lnum }\nend","snippet_omitted":0,"summary":"Ein rohes Ziel (Link-Text oder `<cfile>`) zu einem
