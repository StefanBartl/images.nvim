d":true,"todo":[]},{"async":false,"bug":[],"complexity":14,"documented":true,"generic":[],"internal":false,"line":40,"line_end":79,"local_refs":3,"name":"walk","nodiscard":false,"overload":[],"params":[{"desc":"absoluter Pfad","name":"root","optional":false,"type":"string"},{"desc":"zusätzliche Verzeichnisnamen zum Überspringen","name":"exclude","optional":false,"type":"string[]|nil"},{"desc":"erlaubte Endungen, ohne Punkt","name":"extensions","optional":false,"type":"string[]"}],"returns":[{"desc":"Bildpfade, sortiert","name":"gefundene","type":"string[]"}],"see":[],"shape":"7d2835fd-2ac74025","shape_size":392,"signature":"walk(root, exclude, extensions)","snippet":"local function walk(root, exclude, extensions)\n  local exclude_set = vim.deepcopy(ALWAYS_EXCLUDE)\n  for _, name in ipairs(exclude or {}) do\n    exclude_set[name] = true\n  end\n\n  local ext_set = {}\n  for _, e in ipairs(extensions) do\n    ext_set[e:lower()] = true\n  end\n\n  local found = {}\n  local visited = 0\n  local stack = { root }\n\n  while #stack > 0 do\n    local dir = table.remove(stack)\n    local handle = vim.uv.fs_scandir(dir)\n    if handle then\n      while true do\n        local name, kind = vim.uv.fs_scandir_next(handle)\n        if not name then break end\n        visited = visited + 1\n        if visited > MAX_ENTRIES then\n          table.sort(found)\n          return found\n        end\n        if kind == \"directory\" then\n          if not exclude_set[name] then stack[#stack + 1] = dir .. \"/\" .. name end\n        elseif kind == \"file\" then\n          local ext = name:match(\"%.([%w]+)$\")\n          if ext and ext_set[ext:lower()] then found[#found + 1] = dir .. \"/\" .. name end\n        end\n      end\n    end\n  end\n\n  table.sort(found)\n  return found\nend","snippet_omitted":0,"summary":"Bilddateien unterhalb `root` einsammeln (Breitensuche, iterativ statt rekursiv — vermeidet Stack-Tiefe bei sehr verschachtelten Bäumen).","test":[],"tested":true,"todo":[]},{"asy n_window(ctx.item.file, ctx.win) then ctx.preview:notify(\"Bild kann hier nicht gezeichnet werden\", \"warn\") end\n    end,\n    -- `<Tab>` ist snacks' eigene Multi-Select-Taste (nicht von images.nvim\n    -- verdrahtet). `picker:selected({fallback=true})` liefert die markierten\n    -- Treffer, oder — ohne Markierung — den einen hervorgehobenen: mehrere\n    -- Bilder ergeben eine Galerie, ein einzelnes die normale Einzelanzeige.\n    confirm = function(picker, item)\n      local selected = picker:selected({ fallback = true })\n      picker:close()\n      if #selected > 1 then\n        local paths = {}\n        for i, sel in ipairs(selected) do\n          paths[i] = sel.file\n        end\n        require(\"images\").gallery(paths)\n      elseif item then\n        require(\"images\").show(item.file)\n      end\n    end,\n    -- Das Overlay hängt am Terminal, nicht am Picker-Fenster — beim Schließen\n    -- (egal ob per Auswahl oder Esc) bleibt es sonst hängen bis zum nächsten","snippet_omitted":6,"summary":"Picker mit Live-Bildvorschau über `snacks.picker` öffnen.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":4,"documented":true,"generic":[],"internal":false,"line":211,"line_end":228,"local_refs":1,"name":"open_select","nodiscard":false,"overload":[],"params":[{"desc":"","name":"root","optional":false,"type":"string"},{"desc":"","name":"files","optional":false,"type":"string[]"}],"returns":[],"see":[],"shape":"1c0fa1d5-237b7644","shape_size":175,"signature":"open_select(root, files)","snippet":"local function open_select(root, files)\n  ---@param path string\n  local function format_item(path)\n    return path:sub(#root + 2)\n  end\n\n  local function on_pick(choice)\n    if choice then require(\"images\").show(choice) end\n  end\n\n  local ok, kit = pcall(require, \"lib.nvim.ui.kit\")\n  if ok and kit.select then\n    kit.select({ items = files, title = \"Bilder: \" .. root, format_item = format_item, on_select = on_pick })\n    return\ F neben\nder Quelldatei ablegen, z.B. um einen Screenshot an ein Ticket\nanzuhängen, das eine PDF erwartet. Kein Cache — anders als SVG-Anzeige\nist das ein einmaliger, expliziter Export, kein wiederholter Zeichenpfad.\n\nIst `pdfport.nvim` installiert und meldet `can_create(\"image\")` einen\nverfügbaren Producer, läuft der Export darüber (asynchron, verlustfrei\nüber `img2pdf`, sonst `magick` — welcher Producer greift, entscheidet\npdfports eigene `create_chain`, nicht dieses Plugin). Ohne pdfport bleibt\nder bisherige synchrone `magick`-Pfad unverändert die einzige Option.\nSoft-Dependency über `pcall`, wie überall in diesem Repo (siehe\nCROSS-PLUGIN.md).\n\n`M.redact` — Rechtecke (Pixelkoordinaten, siehe `images.scale`) schwarz\nübermalen und als neue Datei ablegen, siehe docs/ROADMAP/REDACT.md für\ndas volle Konzept (Motivation: casedesk-Anhänge mit Kundendaten, die vor\neiner künftigen KI-Übergabe unkenntlich gemacht werden müssen). Kein\nCache, wie `M.to_pdf` — ein einmaliger Export, kein Zeichenpfad.","calls_external":[],"calls_raw":[{"callee":"(path:match(\"%.([%w]+)$\") or \"\"):lower","from_fn":"M.is_svg","line":40},{"callee":"path:match","from_fn":"M.is_svg","line":40},{"callee":"vim.fn.stdpath","from_fn":"cache_dir","line":45},{"callee":"vim.fn.isdirectory","from_fn":"cache_dir","line":46},{"callee":"pcall","from_fn":"cache_dir","line":46},{"callee":"vim.fn.executable","from_fn":"M.to_png","line":55},{"callee":"vim.uv.fs_stat","from_fn":"M.to_png","line":57},{"callee":"vim.fn.sha256","from_fn":"M.to_png","line":62},{"callee":"tostring","from_fn":"M.to_png","line":62},{"callee":"cache_dir","from_fn":"M.to_png","line":63},{"callee":"vim.uv.fs_stat","from_fn":"M.to_png","line":65},{"callee":"vim.system({ \"magick\", path, \"-background\", \"none\", out }, { text = true }):wait","from_fn":"M.to_png","line":69},{"callee":"vim.system","from_fn":"M.to_png","line":69},{"callee":"pcall","from_fn":"M.to_png","line":71},{"callee":"vim.trim","from_fn":"M.to_png","l ":[{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":39,"line_end":41,"local_refs":0,"name":"M.is_svg","nodiscard":false,"overload":[],"params":[{"desc":"","name":"path","optional":false,"type":"string"}],"returns":[{"desc":"","type":"boolean"}],"see":[],"shape":"73c8185b-4cda9bb8","shape_size":48,"signature":"M.is_svg(path)","snippet":"function M.is_svg(path)\n  return (path:match(\"%.([%w]+)$\") or \"\"):lower() == \"svg\"\nend","snippet_omitted":0,"summary":"","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":44,"line_end":48,"local_refs":1,"name":"cache_dir","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"113a7e20-d6864bd","shape_size":80,"signature":"cache_dir()","snippet":"local function cache_dir()\n  local dir = vim.fn.stdpath(\"cache\") .. \"/images.nvim/svg\"\n  if vim.fn.isdirectory(dir) == 0 then pcall(vim.fn.mkdir, dir, \"p\") end\n  return dir\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":9,"documented":true,"generic":[],"internal":false,"line":54,"line_end":76,"local_refs":0,"name":"M.to_png","nodiscard":false,"overload":[],"params":[{"desc":"absoluter Pfad zu einer .svg-Datei","name":"path","optional":false,"type":"string"}],"returns":[{"desc":"","name":"png_path","type":"string|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"5ea9710c-5781aec4","shape_size":333,"signature":"M.to_png(path)","snippet":"function M.to_png(path)\n  if vim.fn.executable(\"magick\") == 0 then return nil, \"SVG braucht ImageMagick (`magick` nicht gefunden)\" end\n\n  local stat = vim.uv.fs_stat(path)\n  if not stat then return nil, \"Datei nicht gefunden: \" .. path end\n\n  -- sha256 aus Pfad+mtime als Dateiname: kollisionsfrei genug für einen\n  -- Cache, und ein geändertes SVG bekommt automatisch einen neuen Schlüssel.\n  local key = vim.fn.sha256(path .. \":\" .. tostring(stat.mtime and stat.mtime.sec or 0))\n  local out = cache_dir() .. \"/\" .. key .. \".png\"\n\n  if vim.uv.fs_stat(out) then return out end\n\n  -- -background none: transparenter Hintergrund statt eines erratenen\n  -- Weiß/Schwarz, das auf einem farbigen Terminalhintergrund falsch aussähe.\n  local result = vim.system({ \"magick\", path, \"-background\", \"none\", out }, { text = true }):wait()\n  if result.code ~= 0 then\n    pcall(vim.uv.fs_unlink, out)\n    return nil, \"Konvertierung fehlgeschlagen: \" .. vim.trim(result.stderr or \"\")\n  end\n  if not vim.uv.fs_stat(out) then return nil, \"Konvertierung lieferte keine Datei\" end\n  return out\nend","snippet_omitted":0,"summary":"SVG nach PNG konvertieren, mit Cache über Quellpfad + Änderungszeit.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":17,"documented":true,"generic":[],"internal":false,"line":91,"line_end":136,"local_refs":0,"name":"M.to_pdf","nodiscard":false,"overload":[],"params":[{"desc":"absoluter Pfad zu einer Bilddatei","name":"path","optional":false,"type":"string"},{"desc":"","name":"on_done","optional":false,"type":"fun(ok: boolean, out_path_or_err: string)|nil"}],"returns":[{"desc":"nur im synchronen (magick) Erfolgsfall gesetzt","name":"pdf_path","type":"string|nil"},{"desc":"nur im synchronen (magick) Fehlerfall gesetzt","name":"err","type":"string|nil"}],"see":[],"shape":"6fe13203-658fec28","shape_size":492,"signature":"M.to_pdf(path, on_done)","snippet":"function M.to_pdf(path, on_done)\n  local ok_pp, pdfport = pcall(require, \"pdfport\")\n  if ok_pp and type(pdfport.can_create) == \"function\" and pdfport.can_create(\"image\") then\n    pdfport.create({\n      inputs = { path },\n      from = \"image\",\n      __callback = function(result)\n        if not on_done then return end\n        if result.status == \"ok\" then\n          on_done(true, result.path)\n        else\n          on_done(false, result.error or \"Export fehlgeschlagen (pdfport)\")\n        end\n      end,\n    })\n    return nil, nil\n  end\n\n  if vim.fn.executable(\"magick\") == 0 then\n    local err = \"PDF-Export braucht ImageMagick (`magick` nicht gefunden)\"\n    if on_done then on_done(false, err) end\n    return nil, err\n  end\n\n  local stat = vim.uv.fs_stat(path)\n  if not stat then\n    local err = \"Datei nicht gefunden: \" .. path\n    if on_done then on_done(false, err) end\n    return nil, err\n  end\n\n  local out = vim.fn.fnamemodify(path, \":r\") .. \".pdf\"\n  local result = vim.system({ \"magick\", path, out }, { text = true }):wait()\n  if result.code ~= 0 then\n    local err = \"Export fehlgeschlagen: \" .. vim.trim(result.stderr or \"\")\n    if on_done then on_done(false, err) end\n    return nil, err\n  end\n  if not vim.uv.fs_stat(out) then\n    local err = \"Export lieferte keine Datei\"","snippet_omitted":6,"summary":"Bild als PDF exportieren, neben der Quelldatei mit derselben Basis (\"bild.png\" → \"bild.pdf\").","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":11,"documented":true,"generic":[],"internal":false,"line":146,"line_end":167,"local_refs":0,"name":"M.redact","nodiscard":false,"overload":[],"params":[{"desc":"absoluter Pfad zu einer Bilddatei","name":"path","optional":false,"type":"string"},{"desc":"Pixelrechtecke, siehe `images.scale.cell_box_to_pixels`","name":"boxes","optional":false,"type":"{ x1: integer, y1: integer, x2: integer, y2: integer }[]"}],"returns":[{"desc":"","name":"out_path","type":"string|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"1d369401-36540867","shape_size":403,"signature":"M.redact(path, boxes)","snippet":"function M.redact(path, boxes)\n  if vim.fn.executable(\"magick\") == 0 then return nil, \"Schwärzen braucht ImageMagick (`magick` nicht gefunden)\" end\n  if not boxes or #boxes == 0 then return nil, \"Keine Box zum Schwärzen angegeben\" end\n\n  local stat = vim.uv.fs_stat(path)\n  if not stat then return nil, \"Datei nicht gefunden: \" .. path end\n\n  local ext = vim.fn.fnamemodify(path, \":e\")\n  local out = vim.fn.fnamemodify(path, \":r\") .. \".redacted.\" .. (ext ~= \"\" and ext or \"png\")\n\n  local args = { \"magick\", path, \"-fill\", \"black\" }\n  for _, box in ipairs(boxes) do\n    table.insert(args, \"-draw\")\n    table.insert(args, (\"rectangle %d,%d %d,%d\"):format(box.x1, box.y1, box.x2, box.y2))\n  end\n  table.insert(args, out)\n\n  local result = vim.system(args, { text = true }):wait()\n  if result.code ~= 0 then return nil, \"Schwärzen fehlgeschlagen: \" .. vim.trim(result.stderr or \"\") end\n  if not vim.uv.fs_stat(out) then return nil, \"Schwärzen lieferte keine Datei\" end\n  return out\nend","snippet_omitted":0,"summary":"Rechtecke schwarz übermalen und als neue Datei neben der Quelldatei ablegen (\"bild.png\" → \"bild.redacted.png\"), das Original bleibt unverändert.","test":[],"tested":true,"todo":[]}],"id":"lua/images/convert.lua","kind":"file","module":"images.convert","name":"convert.lua","parent":"lua/images","path":"lua/images/convert.lua","plugins":[],"required_by":["lua/images","lua/images/redact.lua","lua/images/terminal.lua"],"requires":[],"requires_external":["pdfport"],"requires_raw":[{"deferred":true,"line":92,"module":"pdfport"}],"source":"lua/images/convert.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":5,"lines":169,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Drei unabhängige Konvertierungen, ein Modul, weil alle drei dieselbe `magick`-Abhängigkeit und dieselbe Fehlerbehandlung teilen:","symbols":[],"types":[]},{"body":"Kein Fenster, kein State, keine Seiteneffekte — dadurch ist die Aufteilung ohne Terminal testbar.","calls_external":[],"calls_raw":[{"callee":"math.ceil","from_fn":"auto_columns","line":26},{"callee":"math.sqrt","from_fn":"auto_columns","line":26},{"callee":"math.max","from_fn":"auto_columns","line":27},{"callee":"math.min","from_fn":"auto_columns","line":27},{"callee":"auto_columns","from_fn":"M.layout","line":40},{"callee":"math.max","from_fn":"M.layout","line":41},{"callee":"math.min","from_fn":"M.layout","line":41},{"callee":"math.ceil","from_fn":"M.layout","line":42},{"callee":"math.max","from_fn":"M.layout","line":44},{"callee":"math.floor","from_fn":"M.layout","line":46},{"callee":"math.floor","from_fn":"M.layout","line":47},{"callee":"ipairs","from_fn":"M.layout","line":54},{"callee":"math.floor","from_fn":"M.layout","line":56}],"children":[],"depth":2,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":24,"line_end":28,"local_refs":1,"name":"auto_columns","nodiscard":false,"overload":[],"params":[{"desc":"","name":"count","optional":false,"type":"integer"}],"returns":[{"desc":"","type":"integer"}],"see":[],"shape":"5c25ee67-35b8d05c","shape_size":71,"signature":"auto_columns(count)","snippet":"local function auto_columns(count)\n  if count <= 1 then return 1 end\n  local cols = math.ceil(math.sqrt(count))\n  return math.max(1, math.min(cols, 4))\nend","snippet_omitted":0,"summary":"Spaltenzahl schätzen, wenn keine vorgegeben ist.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":true,"generic":[],"internal":false,"line":35,"line_end":76,"local_refs":0,"name":"M.layout","nodiscard":false,"overload":[],"params":[{"desc":"Absolute Pfade","name":"files","optional":false,"type":"string[]"},{"desc":"","name":"opts","optional":false,"type":"Images.Gallery.Opts"}],"returns":[{"desc":"","name":"placements","type":"Images.Placement[]"},{"desc":"Anzahl Bilder, für die kein Platz mehr war","name":"skipped","type":"integer"}],"see":[],"shape":"42ffc947-49a8b9ad","shape_size":441,"signature":"M.layout(files, opts)","snippet":"function M.layout(files, opts)\n  local placements = {}\n  local count = #files\n  if count == 0 then return placements, 0 end\n\n  local columns = opts.columns or auto_columns(count)\n  columns = math.max(1, math.min(columns, count))\n  local rows_needed = math.ceil(count / columns)\n\n  local gap = math.max(0, opts.gap or 1)\n  -- Verfügbare Fläche minus der Lücken, aufgeteilt auf die Kacheln.\n  local tile_w = math.floor((opts.width - gap * (columns - 1)) / columns)\n  local tile_h = math.floor((opts.height - gap * (rows_needed - 1)) / rows_needed)\n\n  -- Unter dieser Größe ist eine Kachel nicht mehr aussagekräftig; dann lieber\n  -- weniger Bilder zeigen als alle unlesbar.\n  if tile_w < 8 or tile_h < 4 then return placements, count end\n\n  local skipped = 0\n  for i, file in ipairs(files) do\n    local index = i - 1\n    local grid_row = math.floor(index / columns)\n    local grid_col = index % columns\n\n    local row = opts.top + grid_row * (tile_h + gap)\n    local col = opts.left + grid_col * (tile_w + gap)\n\n    if row + tile_h - 1 > opts.top + opts.height - 1 then\n      skipped = skipped + 1\n    else\n      placements[#placements + 1] = {\n        file = file,\n        row = row,\n        col = col,\n        cols = tile_w,\n        rows = tile_h,\n      }\n    end\n  end\n","snippet_omitted":2,"summary":"Bilder auf ein Raster verteilen.","test":[],"tested":true,"todo":[]}],"id":"lua/images/gallery.lua","kind":"file","module":"images.gallery","name":"gallery.lua","parent":"lua/images","path":"lua/images/gallery.lua","plugins":[],"required_by":["lua/images"],"requires":[],"requires_external":[],"requires_raw":[],"source":"lua/images/gallery.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":2,"lines":78,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Rein rechnerisches Modul: es verteilt N Bilder auf ein Raster und liefert Platzierungen für `images.terminal.draw_many`.","symbols":[],"types":[]},{"body":"Ein harter Abbruch wäre falsch — die Erkennung ist eine Heuristik über Umgebungsvariablen, weil OSC 1337 keine Fähigkeitsabfrage kennt, und ein Fehlalarm würde ein funkt ert nicht\")\n    end\n    return\n  end\n\n  if vim.fn.has(\"mac\") == 1 then\n    if vim.fn.executable(\"pngpaste\") == 1 then\n      vim.health.ok(\"`pngpaste` gefunden — `:Image paste` verfügbar\")\n    else\n      vim.health.warn(\"`pngpaste` fehlt\", { \"brew install pngpaste\" })\n    end\n    return\n  end\n\n  if vim.fn.executable(\"wl-paste\") == 1 then\n    vim.health.ok(\"`wl-paste` gefunden — `:Image paste` verfügbar\")\n  elseif vim.fn.executable(\"xclip\") == 1 then\n    vim.health.ok(\"`xclip` gefunden — `:Image paste` verfügbar\")\n  else\n    vim.health.warn(\"Weder `wl-paste` noch `xclip` gefunden — `:Image paste` funktioniert nicht\")\n  end\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":4,"documented":false,"generic":[],"internal":false,"line":68,"line_end":83,"local_refs":1,"name":"check_screenshot","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"4647ca42-b1413d3","shape_size":148,"signature":"check_screenshot()","snippet":"local function check_screenshot()\n  local screenshot = require(\"images.screenshot\")\n  if screenshot.available() then\n    if vim.fn.has(\"win32\") == 1 or vim.fn.has(\"win64\") == 1 then\n      vim.health.ok(\"Snipping Tool (`ms-screenclip:`) verfügbar — `:Image screenshot`\")\n    else\n      vim.health.ok(\"`:Image screenshot` verfügbar\")\n    end\n  else\n    -- info statt warn: :Image paste bleibt der unveränderte Weg, ohne\n    -- screenshot-fähige Werkzeuge geht nur der eine Zusatzbefehl nicht.\n    vim.health.info(\n      screenshot.unavailable_reason() .. \" — `:Image screenshot` bleibt aus, `:Image paste` funktioniert weiterhin\"\n    )\n  end\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":false,"generic":[],"internal":false,"line":86,"line_end":103,"local_refs":1,"name":"check_imagemagick","nodiscard":false,"overload" e":"err","type":"string|nil"}],"see":[],"shape":"e329079-3f43e275","shape_size":279,"signature":"M.collect(path)","snippet":"function M.collect(path)\n  local stat = vim.uv.fs_stat(path)\n  if not stat then return nil, \"Datei nicht gefunden: \" .. path end\n\n  ---@type Images.Info\n  local info = {\n    path = path,\n    bytes = stat.size,\n    mtime = stat.mtime and stat.mtime.sec or 0,\n  }\n\n  if vim.fn.executable(\"magick\") == 1 then\n    -- `identify` als Subcommand von `magick`, nicht als eigenes Binary: auf\n    -- Windows kollidiert `convert.exe`/`identify.exe` mit den gleichnamigen\n    -- Systemprogrammen in System32.\n    local res = vim.system({ \"magick\", \"identify\", \"-format\", \"%m %w %h\", path .. \"[0]\" }, { text = true }):wait()\n    if res.code == 0 and res.stdout then\n      local fmt, w, h = res.stdout:match(\"^(%S+)%s+(%d+)%s+(%d+)\")\n      info.format = fmt\n      info.width = tonumber(w)\n      info.height = tonumber(h)\n    end\n  end\n\n  return info\nend","snippet_omitted":0,"summary":"Metadaten sammeln.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":66,"line_end":78,"local_refs":0,"name":"M.lines","nodiscard":false,"overload":[],"params":[{"desc":"","name":"info","optional":false,"type":"Images.Info"}],"returns":[{"desc":"","type":"string[]"}],"see":[],"shape":"775b423f-3a2c5207","shape_size":224,"signature":"M.lines(info)","snippet":"function M.lines(info)\n  local out = {\n    \"Pfad:    \" .. vim.fn.fnamemodify(info.path, \":~\"),\n    \"Größe:   \" .. M.human_size(info.bytes),\n  }\n  if info.width and info.height then\n    table.insert(out, 2, (\"Format:  %s %dx%d\"):format(info.format or \"?\", info.width, info.height))\n  elseif vim.fn.executable(\"magick\") == 0 then\n    out[#out + 1] = \"Format:  (ImageMagick nicht installiert)\"\n  end\n  if info.mtime > 0 then out[#out + 1] = \"Geändert: \" .. os.date(\"%Y-%m-%d %H:%M\", info.mtime) end\n  return out\nend","snippet_omitted":0,"summary":"Metadaten als Zeilen für eine Anzeige.","test":[],"tested":true,"todo":[]}],"id":"lua/images/info.lua","kind":"file","module":"images.info","name":"info.lua","parent":"lua/images","path":"lua/images/info.lua","plugins":[],"required_by":["lua/images","lua/images/ascii.lua","lua/images/compare.lua","lua/images/redact.lua"],"requires":[],"requires_external":[],"requires_raw":[],"source":"lua/images/info.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":3,"lines":80,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Format und Abmessungen kommen von ImageMagick, falls vorhanden.","symbols":[],"types":[]},{"body":"Betrachtet wird ausschließlich das konfigurierte `paste.dir`, nicht der ganze Baum: das ist das einzige Verzeichnis, in das images.nvim selbst schreibt, und ein Bild irgendwo sonst im Projekt kann aus gutem Grund unverlinkt liegen.","calls_external":[],"calls_raw":[{"callee":"vim.api.nvim_buf_get_name","from_fn":"target_dir","line":22},{"callee":"require","from_fn":"target_dir","line":24},{"callee":"resolve.normalize_path","from_fn":"target_dir","line":25},{"callee":"vim.fn.fnamemodify","from_fn":"target_dir","line":25},{"callee":"require(\"images.config\").get","from_fn":"target_dir","line":26},{"callee":"require","from_fn":"target_dir","line":26},{"callee":"require","from_fn":"list_images","line":36},{"callee":"vim.uv.fs_scandir","from_fn":"list_images","line":37},{"callee":"vim.uv.fs_scandir_next","from_fn":"list_images","line":40},{"callee":"resolve.is_image","from_fn":"list_images","line":42},{"callee":"vim.api.nvim_get_current_buf","from_fn":"M.find","line":52},{"callee":"target_dir","from_fn":"M.find","line":53},{"callee":"vim.fn.isdirectory","from_fn":"M.find","line":54},{"callee":"ipairs","from_fn":"M.find","line":57},{"callee":"require(\"images.scan\").buffer","from_fn":"M.find","line":57},{"callee":"require","from_fn":"M.find","line":57},{"callee":"ipairs","from_fn":"M. mary":"Das Gegenstück zu `images.scan`, das unauflösbare Links meldet — hier ist es umgekehrt: Dateien, die niemand mehr referenziert.","symbols":[],"types":[]},{"body":"Das Bild landet als PNG neben dem Dokument (oder im konfigurierten Unterverzeichnis), der Markdown-Link wird an der Cursorposition eingefügt.\n\nMit `paste.ask_alt_text = true` fragt `M.run` vor dem Einfügen nach einem\nAlt-Text (über das UI-Kit aus lib.nvim, falls vorhanden). Default `false`,\ndamit der schnelle Fall — Screenshot, ein Tastendruck, fertig — nicht\ndurch eine Eingabeaufforderung unterbrochen wird, die die meisten\nAufrufe nicht brauchen.\n\nPlattformen:\n* Windows — `powershell.exe -STA` mit `System.Windows.Forms.Clipboard`.\n  Das `-STA` ist zwingend: die Zwischenablage-API verlangt einen\n  Single-Threaded-Apartment-Thread, sonst kommt immer `null` zurück.\n  Bewusst `powershell.exe` (5.1) statt `pwsh`, weil PowerShell 7 kein `-STA`\n  kennt und WinForms dort nicht zuverlässig verfügbar ist.\n* Linux — `wl-paste` (Wayland), sonst `xclip` (X11).\n* macOS — `pngpaste`, falls installiert.","calls_external":[{"count":1,"member":"create","module":"lib.nvim.notify"}],"calls_raw":[{"callee":"require(\"images.config\").get","from_fn":"cfg","line":27},{"callee":"require","from_fn":"cfg","line":27},{"callee":"require(\"lib.nvim.notify\").create","from_fn":"notify","line":32},{"callee":"require","from_fn":"notify","line":32},{"callee":"pcall","from_fn":"kit","line":39},{"callee":"vim.fn.has","from_fn":"clipboard_to_file","line":56},{"callee":"vim.fn.has","from_fn":"clipboard_to_file","line":56},{"callee":"table.concat","from_fn":"clipboard_to_file","line":57},{"callee":"(\"$img.Save('%s', [System.Drawing.Imaging.ImageFormat]::Png);\"):format","from_fn":"clipboard_to_file","line":61},{"callee":"out:gsub","from_fn":"clipboard_to_file","line":61},{"callee":"vim.fn.has","from_fn":"clipboard_to_file","line":64},{"callee":"vim.fn.executable","from_fn":"clipboard_to_file","line":65},{"callee":"callb ","name":"callback","optional":false,"type":"fun(ok: boolean, err: string|nil)"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"4775745d-696279db","shape_size":578,"signature":"clipboard_to_file(out, callback)","snippet":"local function clipboard_to_file(out, callback)\n  local cmd ---@type string[]\n\n  if vim.fn.has(\"win32\") == 1 or vim.fn.has(\"win64\") == 1 then\n    local ps = table.concat({\n      \"Add-Type -AssemblyName System.Windows.Forms,System.Drawing;\",\n      \"$img = [System.Windows.Forms.Clipboard]::GetImage();\",\n      \"if ($img -eq $null) { exit 3 };\",\n      (\"$img.Save('%s', [System.Drawing.Imaging.ImageFormat]::Png);\"):format(out:gsub(\"'\", \"''\")),\n    }, \" \")\n    cmd = { \"powershell.exe\", \"-NoProfile\", \"-NonInteractive\", \"-STA\", \"-Command\", ps }\n  elseif vim.fn.has(\"mac\") == 1 then\n    if vim.fn.executable(\"pngpaste\") == 0 then\n      callback(false, \"`pngpaste` nicht gefunden (brew install pngpaste)\")\n      return\n    end\n    cmd = { \"pngpaste\", out }\n  else\n    if vim.fn.executable(\"wl-paste\") == 1 then\n      cmd = { \"sh\", \"-c\", (\"wl-paste --type image/png > '%s'\"):format(out) }\n    elseif vim.fn.executable(\"xclip\") == 1 then\n      cmd = { \"sh\", \"-c\", (\"xclip -selection clipboard -t image/png -o > '%s'\"):format(out) }\n    else\n      callback(false, \"Weder `wl-paste` noch `xclip` gefunden\")\n      return\n    end\n  end\n\n  vim.system(cmd, { text = true }, function(result)\n    vim.schedule(function()\n      if result.code == 3 then\n        callback(false, \"Kein Bild in der Zwischenablage\")\n        return\n      end\n      if result.code ~= 0 then\n        callback(\n          false,\n          (\"Zwischenablage konnte nicht gelesen werden (exit %d): %s\"):format(result.code, vim.trim(result.stderr or \"\"))\n        )\n        return","snippet_omitted":12,"summary":"Zwischenablage-Bild nach `out` schreiben.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":110,"line_end":115,"local_refs":1,"name":"default_filename","nodiscard":false,"overload":[],"params":[{"desc":"","name":"buf","optional":false,"type":"integer"}],"returns":[{"desc":"nil, falls der Buffer keinen Dateinamen hat","name":"suggestion","type":"string|nil"}],"see":[],"shape":"6435c972-710284a4","shape_size":99,"signature":"default_filename(buf)","snippet":"local function default_filename(buf)\n  local name = vim.api.nvim_buf_get_name(buf)\n  if name == \"\" then return nil end\n  local doc_stem = vim.fn.fnamemodify(name, \":t:r\")\n  return cfg().paste.name_template:format(doc_stem, os.time())\nend","snippet_omitted":0,"summary":"Vorgeschlagener Dateiname nach dem Template — Vorbelegung für die Namensabfrage und Fallback, wenn keine eigene Eingabe kommt.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":5,"documented":true,"generic":[],"internal":false,"line":126,"line_end":136,"local_refs":5,"name":"sanitize_filename","nodiscard":false,"overload":[],"params":[{"desc":"Roher User-Input","name":"input","optional":false,"type":"string"}],"returns":[{"desc":"Dateiname mit `.png`, oder nil ohne brauchbaren Rest","name":"bereinigter","type":"string|nil"}],"see":[],"shape":"74bd21d8-623a1634","shape_size":159,"signature":"sanitize_filename(input)","snippet":"local function sanitize_filename(input)\n  -- `fnamemodify(\":t\")` erkennt `\\` nur unter Windows als Pfadtrenner -- unter\n  -- Linux/macOS ist Backslash ein gültiges Dateinamenszeichen, also bliebe ein\n  -- eingegebenes \"C:\\Windows\\name\" dort unverändert stehen. Erst manuell auf\n  -- `/` normalisieren macht die Trennung plattformunabhängig.\n  local normalized = vim.trim(input or \"\"):gsub(\"\\\\\", \"/\")\n  local base = vim.fn.fnamemodify(normalized, \":t\")\n  local stem = vim.trim(vim.fn.fnamemodify(base, \":r\"))\n  if stem == \"\" or stem == \".\" or stem == \"..\" then return nil end\n  return stem .. \".png\"\nend","snippet_omitted":0,"summary":"User-Eingabe zu einem sicheren Dateinamen machen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":8,"documented":true,"generic":[],"internal":false,"line":149,"line_end":163,"local_refs":3,"name":"find_existing_resource_dir","nodiscard":false,"overload":[],"params":[{"desc":"","name":"doc_dir","optional":false,"type":"string"}],"returns":[{"desc":"des gefundenen Verzeichnisses, wie im Dateisystem","name":"Name","type":"string|nil"}],"see":[],"shape":"35e0e35f-76e3fc8c","shape_size":186,"signature":"find_existing_resource_dir(doc_dir)","snippet":"local function find_existing_resource_dir(doc_dir)\n  local candidates = cfg().paste.existing_dir_names\n  if not candidates or #candidates == 0 then return nil end\n\n  local wanted = {}\n  for _, n in ipairs(candidates) do\n    wanted[n:lower()] = true\n  end\n\n  local entries = vim.fn.readdir(doc_dir) or {}\n  for _, entry in ipairs(entries) do\n    if wanted[entry:lower()] and vim.fn.isdirectory(doc_dir .. \"/\" .. entry) == 1 then return entry end\n  end\n  return nil\nend","snippet_omitted":0,"summary":"Bereits vorhandenes Ressourcen-Verzeichnis im Dokumentverzeichnis finden (z.B.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":11,"documented":true,"generic":[],"internal":false,"line":176,"line_end":195,"local_refs":1,"name":"target_paths","nodiscard":false,"overload":[],"params":[{"desc":"","name":"buf","optional":false,"type":"integer"},{"desc":"bereits sanitisierter Name; nil = Template","name":"filename_override","optional":false,"type":"string|nil"}],"returns":[{"desc":"Pfad","name":"absoluter","type":"string|nil"},{"desc":"Pfad für den Link","name":"relativer","type":"string|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"7fb88357-57cce0f8","shape_size":332,"signature":"target_paths(buf, filename_override)","snippet":"local function target_paths(buf, filename_override)\n  local name = vim.api.nvim_buf_get_name(buf)\n  if name == \"\" then return nil, nil, \"Buffer hat keinen Dateinamen — bitte zuerst speichern\" end\n\n  local c = cfg().paste\n  local doc_dir = vim.fn.fnamemodify(name, \":p:h\")\n  local doc_stem = vim.fn.fnamemodify(name, \":t:r\")\n\n  local sub = find_existing_resource_dir(doc_dir) or c.dir or \"\"\n  local dir = (sub ~= \"\") and (doc_dir .. \"/\" .. sub) or doc_dir\n  if vim.fn.isdirectory(dir) == 0 then\n    local ok = pcall(vim.fn.mkdir, dir, \"p\")\n    if not ok then return nil, nil, \"Verzeichnis konnte nicht angelegt werden: \" .. dir end\n  end\n\n  local file = filename_override or c.name_template:format(doc_stem, os.time())\n  local abs = dir .. \"/\" .. file\n  local rel = (sub ~= \"\") and (sub .. \"/\" .. file) or file\n  return abs, rel, nil\nend","snippet_omitted":0,"summary":"Zielpfad für ein neues Bild bestimmen und das Verzeichnis anlegen.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":3,"documented":true,"generic":[],"internal":false,"line":203,"line_end":210,"local_refs":1,"name":"move_file","nodiscard":false,"overload":[],"params":[{"desc":"","name":"src","optional":false,"type":"string"},{"desc":"","name":"dst","optional":false,"type":"string"}],"returns":[{"desc":"","name":"ok","type":"boolean"}],"see":[],"shape":"6afc2584-5b0c1a94","shape_size":76,"signature":"move_file(src, dst)","snippet":"local function move_file(src, dst)\n  if vim.uv.fs_rename(src, dst) then return true end\n  if vim.uv.fs_copyfile(src, dst) then\n    pcall(vim.uv.fs_unlink, src)\n    return true\n  end\n  return false\nend","snippet_omitted":0,"summary":"`src` nach `dst` verschieben.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":7,"documented":true,"generic":[],"internal":false,"line":224,"line_end":248,"local_refs":4,"name":"insert_link","nodiscard":false,"overload":[],"params":[{"desc":"","name":"buf","optional":false,"type":"integer"},{"desc":"Pfad relativ zum Dokument","name":"rel","optional":false,"type":"string"},{"desc":"Alt-Text; leer oder nil = kein Alt-Text","name":"alt","optional":false,"type":"string|nil"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"53f00e43-5d034abd","shape_size":348,"signature":"insert_link(buf, rel, alt)","snippet":"local function insert_link(buf, rel, alt)\n  if not vim.api.nvim_buf_is_valid(buf) then\n    notify().warn(\"Buffer nicht mehr vorhanden — Bild liegt unter \" .. rel)\n    return\n  end\n  if not vim.bo[buf].modifiable then\n    notify().warn(\"Buffer nicht änderbar — Bild liegt unter \" .. rel)\n    return\n  end\n\n  -- Backslashes im Link vermeiden: Markdown-Pfade sind portabler mit `/`.\n  local forward = (rel:gsub(\"\\\\\", \"/\"))\n  local c = cfg().paste\n  local link = (alt and alt ~= \"\") and c.alt_link_template:format(alt, forward) or c.link_template:format(forward)\n\n  local pos = vim.api.nvim_win_get_cursor(0)\n  local inserted = pcall(vim.api.nvim_buf_set_text, buf, pos[1] - 1, pos[2], pos[1] - 1, pos[2], { link })\n  if not inserted then\n    notify().warn(\"Link konnte nicht eingefügt werden — Bild liegt unter \" .. rel)\n    return\n  end\n  pcall(vim.api.nvim_win_set_cursor, 0, { pos[1], pos[2] + #link })\n\n  notify().info(\"Bild gespeichert: \" .. rel)\nend","snippet_omitted":0,"summary":"Link an der zum Zeitpunkt des Aufrufs gültigen Cursorposition einfügen.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":11,"documented":true,"generic":[],"internal":false,"line":269,"line_end":322,"local_refs":6,"name":"paste_with_name","nodiscard":false,"overload":[],"params":[{"desc":"","name":"buf","optional":false,"type":"integer"},{"desc":"bereits sanitisiert; nil = Template","name":"filename_override","optional":false,"type":"string|nil"},{"desc":"","name":"capture","optional":false,"type":"fun(out: string, cb: fun(ok: boolean, err: string|nil))"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"4ee81472-73b3199e","shape_size":418,"signature":" ppet":"local function capture_with_optional_name(capture, direct_name)\n  local buf = vim.api.nvim_get_current_buf()\n\n  if direct_name then\n    local sanitized = sanitize_filename(direct_name)\n    if not sanitized then\n      notify().error(\"Ungültiger Dateiname: \" .. direct_name)\n      return\n    end\n    paste_with_name(buf, sanitized, capture)\n    return\n  end\n\n  if not cfg().paste.ask_filename then\n    paste_with_name(buf, nil, capture)\n    return\n  end\n\n  local suggested = default_filename(buf)\n  local k = kit()\n  if k and k.input then\n    k.input({\n      title = \"Dateiname\",\n      default = suggested,\n      on_submit = function(name)\n        paste_with_name(buf, sanitize_filename(name), capture)\n      end,\n      -- Anders als bei der Alt-Text-Abfrage: hier wurde noch nichts\n      -- aufgenommen oder geschrieben — Abbrechen heißt also tatsächlich\n      -- \"nichts tun\", nicht \"mit Standardwerten weitermachen\".\n      on_cancel = function()\n        notify().info(\"Abgebrochen\")\n      end,\n    })\n  else\n    local name = vim.fn.input(\"Dateiname: \", suggested or \"\")\n    if name == \"\" then\n      notify().info(\"Abgebrochen\")\n      return\n    end","snippet_omitted":3,"summary":"Optional nach einem Dateinamen fragen, dann `paste_with_name` mit `capture` als Aufnahmefunktion ausführen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":true,"generic":[],"internal":false,"line":384,"line_end":386,"local_refs":0,"name":"M.run","nodiscard":false,"overload":[],"params":[{"desc":"bereits vorgegebener Dateiname (`:Image paste {name}`) — überspringt jede Namensabfrage","name":"name","optional":false,"type":"string|nil"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"64e0fa5c-61b6afa7","shape_size":20,"signature":"M.run(name)","snippet":"function M.run(name)\n  capture_with_optional_name(clipboard_to_file, name)\nend","snippet_omitted":0,"summary":"Bild aus der Zwischenablage speich x so, dass `preserveAspectRatio=1` kaum noch etwas zu\nletterboxen hat (die Zellzahl wird an das Bildseitenverhältnis über eine\nangenommene, dokumentierte Zellbreite/-höhe angepasst, `images.scale.\nCELL_ASPECT` — keine echte Zellmessung, siehe dort), und `images.scale.\ncell_box_to_pixels` rechnet mit einer Sicherheitsmarge in Pixelkoordinaten\num. Gebrannt wird über `images.convert.redact` (ImageMagick, dritte\nbewusste Ausnahme von der \"kein ImageMagick als Pflicht\"-Leitplanke neben\nSVG-Anzeige und `:Image export`).\n\n**Nicht Teil der automatisierten Testsuite**: die Tastenlogik selbst\n(Visual-Mode-Erfassung, Fensteraufbau) braucht ein echtes Terminal mit\nOSC-1337-Unterstützung, um wirklich verifiziert zu werden — wie überall\nin dieser Suite bleibt \"Zeichnen\" ungeprüft (siehe TESTS/zen_spec.lua).\nDie reine Geometrie (`images.scale.fit_cells`/`cell_box_to_pixels`) und\ndas Brennen (`images.convert.redact`) sind dagegen getestet.","calls_external":[{"count":1,"member":"create","module":"lib.nvim.notify"}],"calls_raw":[{"callee":"require(\"images.config\").get","from_fn":"cfg","line":36},{"callee":"require","from_fn":"cfg","line":36},{"callee":"require(\"lib.nvim.notify\").create","from_fn":"notify","line":41},{"callee":"require","from_fn":"notify","line":41},{"callee":"vim.api.nvim_create_namespace","line":66},{"callee":"vim.api.nvim_win_is_valid","from_fn":"M.is_open","line":71},{"callee":"vim.api.nvim_win_is_valid","from_fn":"M.close","line":79},{"callee":"pcall","from_fn":"M.close","line":79},{"callee":"require(\"images.terminal\").clear","from_fn":"M.close","line":80},{"callee":"require","from_fn":"M.close","line":80},{"callee":"vim.api.nvim_buf_clear_namespace","from_fn":"redraw_boxes","line":88},{"callee":"ipairs","from_fn":"redraw_boxes","line":89},{"callee":"pcall","from_fn":"redraw_boxes","line":90},{"callee":"notify().warn","from_fn":"undo_box","line":101},{"callee":"notify","from_fn":"undo_box","line":101},{"callee":"table.remove","from_fn":"u \n\n  local px, info_err = require(\"images.info\").collect(target)\n  if not px or not px.width or not px.height then\n    notify().error(info_err or \"Bildmaße nicht ermittelbar — `:Image redact` braucht ImageMagick\")\n    return false\n  end\n\n  require(\"images.guard\").check()\n  M.close()\n\n  local max_cols, max_rows = require(\"images.zen\").dimensions(cfg().display.zen)\n  local cols, rows = require(\"images.scale\").fit_cells(max_cols, max_rows, px)\n\n  local lines = {}\n  local blank = (\" \"):rep(cols)\n  for i = 1, rows do\n    lines[i] = blank\n  end\n\n  local win, buf = require(\"lib.nvim.window.make_scratch\")({\n    lines = lines,\n    width = cols,\n    height = rows,\n    modifiable = false,\n    nice_quit = true,\n    title = \" Redact: \" .. vim.fn.fnamemodify(target, \":t\") .. \" \",\n  })\n  if not win or not buf then\n    notify().error(\"Redact-Fenster konnte nicht geöffnet werden\")\n    return false\n  end\n\n  winid, bufnr, file, image_px, draw_cols, draw_rows = win, buf, target, px, cols, rows\n  boxes = {}","snippet_omitted":28,"summary":"Bild — oder das unter dem Cursor — im Zensur-Modus öffnen.","test":[],"tested":true,"todo":[]}],"id":"lua/images/redact.lua","kind":"file","module":"images.redact","name":"redact.lua","parent":"lua/images","path":"lua/images/redact.lua","plugins":[],"required_by":["lua/images"],"requires":["lua/images/anchor.lua","lua/images/config","lua/images/convert.lua","lua/images/guard.lua","lua/images/info.lua","lua/images/resolve.lua","lua/images/scale.lua","lua/images/terminal.lua","lua/images/zen.lua"],"requires_external":["lib.nvim.notify","lib.nvim.window.make_scratch"],"requires_raw":[{"deferred":true,"line":36,"module":"images.config"},{"deferred":true,"line":41,"module":"lib.nvim.notify"},{"deferred":true,"line":80,"module":"images.terminal"},{"deferred":true,"line":143,"module":"images.scale"},{"deferred":true,"line":146,"module":"images.convert"},{"alias":"target","deferred":true,"line":160,"membe ":false,"overload":[],"params":[{"desc":"Zellen","name":"win_width","optional":false,"type":"integer"},{"desc":"Zellen","name":"win_height","optional":false,"type":"integer"},{"desc":"einer von `M.POSITIONS`","name":"position","optional":false,"type":"string"},{"desc":"0 < scale <= 1; ignoriert bei `position = \"full\"`","name":"scale","optional":false,"type":"number|nil"}],"returns":[{"desc":", integer|nil rows, integer|nil col_offset, integer|nil row_offset, string|nil err","name":"cols","type":"integer|nil"}],"see":[],"shape":"118e7561-695fde44","shape_size":262,"signature":"M.anchor_box(win_width, win_height, position, scale)","snippet":"function M.anchor_box(win_width, win_height, position, scale)\n  local anchor = ANCHORS[position]\n  if not anchor then\n    return nil,\n      nil,\n      nil,\n      nil,\n      (\"Unbekannte Position: %s (erwartet %s)\"):format(tostring(position), table.concat(M.POSITIONS, \"|\"))\n  end\n\n  local effective_scale = (position == \"full\") and 1 or math.max(0.05, math.min(1, scale or M.DEFAULT_ANCHOR_SCALE))\n\n  local cols = math.max(1, math.floor(win_width * effective_scale))\n  local rows = math.max(1, math.floor(win_height * effective_scale))\n  local col_offset = math.floor((win_width - cols) * anchor.h)\n  local row_offset = math.floor((win_height - rows) * anchor.v)\n  return cols, rows, col_offset, row_offset, nil\nend","snippet_omitted":0,"summary":"Zellenbox innerhalb eines Fensters an einer benannten Position bestimmen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":5,"documented":true,"generic":[],"internal":false,"line":145,"line_end":154,"local_refs":0,"name":"M.fit_cells","nodiscard":false,"overload":[],"params":[{"desc":"","name":"max_cols","optional":false,"type":"integer"},{"desc":"","name":"max_rows","optional":false,"type":"integer"},{"desc":"","name":"image_px","optional":false,"type":"Images.Scale.Dims|nil"}],"returns":[{"desc":", integer rows","name":"cols","type":"integer"}],"see":[],"shape":"7c2b8033-6826edc7","shape_size":159,"signature":"M.fit_cells(max_cols, max_rows, image_px)","snippet":"function M.fit_cells(max_cols, max_rows, image_px)\n  if not (image_px and image_px.width > 0 and image_px.height > 0) then return max_cols, max_rows end\n\n  local image_aspect = image_px.width / image_px.height\n  local cols = math.floor(max_rows * image_aspect / M.CELL_ASPECT)\n  if cols <= max_cols then return math.max(1, cols), max_rows end\n\n  local rows = math.floor(max_cols * M.CELL_ASPECT / image_aspect)\n  return max_cols, math.max(1, rows)\nend","snippet_omitted":0,"summary":"Zeichenbox in Zellen bestimmen, die `image_px`s Seitenverhältnis (über `M.CELL_ASPECT` in Zellen ausgedrückt) innerhalb der Maximalgröße ausfüllt —…","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":168,"line_end":190,"local_refs":0,"name":"M.cell_box_to_pixels","nodiscard":false,"overload":[],"params":[{"desc":"","name":"box","optional":false,"type":"{ row1: integer, col1: integer, row2: integer, col2: integer }"},{"desc":"","name":"draw_cols","optional":false,"type":"integer"},{"desc":"","name":"draw_rows","optional":false,"type":"integer"},{"desc":"","name":"image_px","optional":false,"type":"Images.Scale.Dims"},{"desc":"","name":"padding_cells","optional":false,"type":"integer|nil"}],"returns":[{"desc":"","type":"{ x1: integer, y1: integer, x2: integer, y2: integer }"}],"see":[],"shape":"78420088-3dee845","shape_size":359,"signature":"M.cell_box_to_pixels(box, draw_cols, draw_rows, image_px, padding_cells)","snippet":"function M.cell_box_to_pixels(box, draw_cols, draw_rows, image_px, padding_cells)\n  padding_cells = padding_cells or 0\n\n  local col1 = math.max(1, box.col1 - padding_cells)\n  local row1 = math.max(1, box.row1 - padding_cells)\n  local col2 = math.min(draw_cols, box.col2 + padding_cells)\n  local row2 = math.min(draw_rows, box.row2 + padding_cells)\n\n  local scale_x = image_px.width / draw_cols\n  local scale_y = image_px.height / draw_rows\n\n  local x1 = math.floor((col1 - 1) * scale_x)\n  local y1 = math.floor((row1 - 1) * scale_y)\n  local x2 = math.ceil(col2 * scale_x)\n  local y2 = math.ceil(row2 * scale_y)\n\n  return {\n    x1 = math.max(0, math.min(x1, image_px.width)),\n    y1 = math.max(0, math.min(y1, image_px.height)),\n    x2 = math.max(0, math.min(x2, image_px.width)),\n    y2 = math.max(0, math.min(y2, image_px.height)),\n  }\nend","snippet_omitted":0,"summary":"Eine 1-basierte, einschließende Zellbox (relativ zur Zeichenbox) in eine Pixelbox der Quelldatei umrechnen.","test":[],"tested":true,"todo":[]}],"id":"lua/images/scale.lua","kind":"file","module":"images.scale","name":"scale.lua","parent":"lua/images","path":"lua/images/scale.lua","plugins":[],"required_by":["lua/images/anchor.lua","lua/images/ascii.lua","lua/images/bindings/usrcmds.lua","lua/images/compare.lua","lua/images/redact.lua"],"requires":[],"requires_external":[],"requires_raw":[],"source":"lua/images/scale.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":4,"lines":192,"modules":0,"namespaces":0,"symbols":5,"types":0},"summary":"Ohne das würde `:Image compare` jedes Bild unabhängig auf seine Pane strecken — ein 200x100-Icon neben einem 4000x2000-Foto sähen dann gleich groß aus,…","symbols":[{"detail":"0.35","kind":"constant","line":20,"name":"M.MIN_SCALE","summary":"Wie stark ein Bild relativ zum größeren geschrumpft wird, bevor es unlesbar würde."},{"detail":"0.45","kind":"constant","line":58,"name":"M.DEFAULT_ANCHOR_SCALE","summary":"Standard-Skalierung für eine benannte Position ohne expliziten `scale` (siehe `M.anchor_box`) — klein genug, um Randbereiche wie \"top-left\" erkennbar von…"},{"detail":"10 fields","kind":"table","line":66,"name":"ANCHORS","summary":"Horizontaler/vertikaler Anteil (0 = Kante, 0.5 = mittig, 1 = Gegenkante), den eine Box vom übrigen Platz einnimmt — dieselbe Formel für alle neun…"},{"detail":"1 - 1 or 0\n  local to = last or -1\n  local lines = vim.api.nvim_buf_get_lines(buf, from, to, false)\n\n  local found, missing = {}, {}\n  for i, line in ipairs(lines) do\n    for _, link in ipairs(resolve.links_in_line(line)) do\n      if resolve.is_image(link.target) then\n        local path = resolve.to_path(link.target, buf)\n        if path then\n          found[#found + 1] = { raw = link.target, path = path, lnum = from + i }\n        else\n          missing[#missing + 1] = link.target\n        end\n      end\n    end\n  end\n  return found, missing\nend","snippet_omitted":0,"summary":"Bildziele eines Buffers, optional auf einen Zeilenbereich beschränkt.","test":[],"tested":true,"todo":[]}],"id":"lua/images/scan.lua","kind":"file","module":"images.scan","name":"scan.lua","parent":"lua/images","path":"lua/images/scan.lua","plugins":[],"required_by":["lua/images","lua/images/orphans.lua"],"requires":["lua/images/resolve.lua"],"requires_external":[],"requires_raw":[{"alias":"resolve","deferred":true,"line":15,"module":"images.resolve"}],"source":"lua/images/scan.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":1,"lines":37,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Alle Bildlinks eines Buffers einsammeln.","symbols":[],"types":[]},{"body":"Durchgehend asynchron (`vim.system` ohne `:wait()`, jede Fortsetzung in\n`vim.schedule`), nie ein blockierendes `sleep`: Der User braucht für eine\nAuswahl Sekunden bis zu einer Minute, und `:wait()` blockiert Neovims\ngesamte Event-Loop für die Dauer des Subprozesses — ein eingefrorenes\nNeovim, während man eigentlich nur einen Bereich zieht. Derselbe Aufbau\nwie `lib.nvim.system.job`, das aus genau diesem Grund nie `:wait()`\nverwendet.\n\nPlattformen, unterschiedlich zuverlässig:\n\n* macOS — `screencapture -i`: interaktive Auswahl per Ziehen oder Klick\n  auf ein Fenster, schreibt direkt in die Zieldatei. Bricht der User mit\n  <Esc> ab, liefert `screencapture` trotzdem Exit-Code 0 — daran ist ein\n  Abbruch nicht zu erkennen, nur an der fehlenden/leeren Datei.\n\n* Linux — `grim -g \"$(slurp)\"` (Wayland, beide Werkzeuge nötig) oder\n  `maim -s` (X11, ein Werkzeug reicht). `slurp` liefert die vom User\n  gezogene Region auf stdout; bricht der User ab, liefert es nichts, und\n  `grim` wird gar nicht erst aufgerufen.\n\n* Windows — der unsicherste der drei Wege. Es gibt keinen dokumentierten\n  CLI-Aufruf, der das moderne Snipping-Tool direkt in eine Datei\n  schreiben lässt. `explorer.exe ms-screenclip:` startet die\n  Auswahl-Oberfläche (dasselbe wie Win+Shift+S), kehrt aber sofort zurück\n  und kopiert das Ergebnis nach Abschluss in die Zwischenablage — ohne\n  Signal, wann das passiert. Dieses Modul pollt die Zwischenablage\n  danach per Timer (nicht blockierend) auf ein *neues* Bild, mit\n  Timeout. Die Polling-/Vergleichslogik selbst wurde manuell gegen eine\n  künstlich zeitversetzt veränderte Zwischenablage verifiziert; ob\n  `ms-screenclip:` in jeder Windows-Version wie dokumentiert startet, war\n  in dieser Umgebung nicht simulierbar — `:Image paste` bleibt der\n  unveränderte, bewährte Zwei-Schritt-Weg, falls diese Automatisierung\n  einmal nicht greift.","calls_external":[],"calls_raw":[{"callee":"require(\"images.config\").get","from_fn":"cfg","line":47},{"callee":"require","from_fn":"cfg","line":47},{"callee":"vim.uv.fs_stat","from_fn":"finish_from_file","line":57},{"callee":"pcall","from_fn":"finish_from_file","line":59},{"callee":"callback","from_fn":"finish_from_file","line":60},{"callee":"callback","from_fn":"finish_from_file","line":63},{"callee":"vim.system","from_fn":"capture_mac","line":72},{"callee":"vim.schedule","from_fn":"capture_mac","line":73},{"callee":"finish_from_file","from_fn":"capture_mac","line":74},{"callee":"vim.fn.executable","from_fn":"capture_linux","line":85},{"callee":"vim.fn.executable","from_fn":"capture_linux","line":85},{"callee":"vim.system","from_fn":"capture_linux","line":86},{"callee":"vim.schedule", "optional":false,"type":"fun(ok: boolean, err: string|nil)"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"6bb5274b-52ee081f","shape_size":404,"signature":"capture_linux(out, callback)","snippet":"local function capture_linux(out, callback)\n  if vim.fn.executable(\"grim\") == 1 and vim.fn.executable(\"slurp\") == 1 then\n    vim.system({ \"slurp\" }, { text = true }, function(sel)\n      vim.schedule(function()\n        if sel.code ~= 0 or vim.trim(sel.stdout or \"\") == \"\" then\n          callback(false, \"Abgebrochen\")\n          return\n        end\n        vim.system({ \"grim\", \"-g\", vim.trim(sel.stdout), out }, { text = true }, function(gr)\n          vim.schedule(function()\n            if gr.code ~= 0 then\n              callback(false, \"grim fehlgeschlagen: \" .. vim.trim(gr.stderr or \"\"))\n              return\n            end\n            finish_from_file(out, callback)\n          end)\n        end)\n      end)\n    end)\n  elseif vim.fn.executable(\"maim\") == 1 then\n    -- -s: interaktive Auswahl per Ziehen. Abbruch (<Esc>) liefert exit != 0.\n    vim.system({ \"maim\", \"-s\", out }, { text = true }, function(result)\n      vim.schedule(function()\n        if result.code ~= 0 then\n          callback(false, \"Abgebrochen\")\n          return\n        end\n        finish_from_file(out, callback)\n      end)\n    end)\n  else\n    callback(false, \"Weder `grim`+`slurp` (Wayland) noch `maim` (X11) gefunden\")\n  end\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":7,"documented":true,"generic":[],"internal":false,"line":136,"line_end":152,"local_refs":2,"name":"read_clipboard_image_async","nodiscard":false,"overload":[],"params":[{"desc":"","name":"callback","optional":false,"type":"fun(data: string|nil)"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"767cd887-47d5ced3","shape_size":183,"signature":"read_clipboard_image_async(callback)","snippet":"local function read_clipboard_image_async(callback)\n  vim.system(\n    { \"powershell.exe\", \"-NoProfile\", \"-NonInteractive\", \"-STA\", \"-Command\", PS_READ_CLIPBOARD_B64 },\n    { text = true },\n    function(result)\n      vim.schedule(function()\n        local out = vim.trim(result.stdout or \"\")\n        if result.code ~= 0 or out == \"\" then\n          callback(nil)\n          return\n        end\n        local ok, decoded = pcall(vim.base64.decode, out)\n        callback((ok and decoded ~= \"\") and decoded or nil)\n      end)\n    end\n  )\nend","snippet_omitted":0,"summary":"Aktuellen Zwischenablage-Bildinhalt lesen, asynchron.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":9,"documented":true,"generic":[],"internal":false,"line":159,"line_end":207,"local_refs":1,"name":"capture_windows","nodiscard":false,"overload":[],"params":[{"desc":"","name":"out","optional":false,"type":"string"},{"desc":"","name":"callback","optional":false,"type":"fun(ok: boolean, err: string|nil)"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"691ab571-45f95fd","shape_size":379,"signature":"capture_windows(out, callback)","snippet":"local function capture_windows(out, callback)\n  read_clipboard_image_async(function(baseline)\n    vim.system({ \"explorer.exe\", \"ms-screenclip:\" }, { text = true }, function(launch)\n      vim.schedule(function()\n        if launch.code ~= 0 then\n          callback(false, \"Snipping Tool konnte nicht gestartet werden\")\n          return\n        end\n\n        local c = cfg().display.screenshot\n        local timeout_ms = c.windows_timeout_ms or 60000\n        local interval_ms = c.windows_poll_interval_ms or 600\n        local elapsed = 0\n\n        local timer = assert(vim.uv.new_timer())\n        local function stop()\n          if not timer:is_closing() then\n            timer:stop()\n            timer:close()\n          end\n        end\n\n        timer:start(\n          interval_ms,\n          interval_ms,\n          vim.schedule_wrap(function()\n            elapsed = elapsed + interval_ms\n            read_clipboard_image_async(function(current)\n              if current and current ~= baseline then\n                stop()\n                local fd = io.open(out, \"wb\")\n                if not fd then\n                  callback(false, \"Zieldatei nicht schreibbar: \" .. out)\n                  return\n                end\n                fd:write(current)\n                fd:close()\n                callback(true)\n              elseif elapsed >= timeout_ms then\n                stop()","snippet_omitted":9,"summary":"Snip-Oberfläche starten, per Timer (nicht blockierend) auf ein *neues* Zwischenablage-Bild warten, dann nach `out` schreiben.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":213,"line_end":221,"local_refs":0,"name":"M.available","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"boolean"}],"see":[],"shape":"18e4b908-23bb743e","shape_size":171,"signature":"M.available()","snippet":"function M.available()\n  if vim.fn.has(\"mac\") == 1 then\n    return vim.fn.executable(\"screencapture\") == 1\n  elseif vim.fn.has(\"win32\") == 1 or vim.fn.has(\"win64\") == 1 then\n    return true -- ms-screenclip: gehört zu Windows, kein separates Tool nötig\n  else\n    return (vim.fn.executable(\"grim\") == 1 and vim.fn.executable(\"slurp\") == 1) or vim.fn.executable(\"maim\") == 1\n  end\nend","snippet_omitted":0,"summary":"Ob auf dieser Plattform überhaupt ein Aufnahmeweg zur Verfügung steht.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":225,"line_end":228,"local_refs":0,"name":"M.unavailable_reason","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"59b6421d-41fa7067","shape_size":48,"signature":"M.unavailable_reason()","snippet":"function M.unavailable_reason()\n  if vim.fn.has(\"mac\") == 1 then return \"`screencapture` nicht gefunden (gehört normalerweise zu macOS)\" end\n  return \"Weder `grim`+`slurp` (Wayland) noch `maim` (X11) gefunden\"\nend","snippet_omitted":0,"summary":"Begründung, wenn `available()` false ist — für die Fehlermeldung.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":4,"documented":true,"generic":[],"internal":false,"line":236,"line_end":244,"local_refs":0,"name":"M.capture","nodiscard":false,"overload":[],"params":[{"desc":"Zielpfad (PNG)","name":"out","optional":false,"type":"string"},{"desc":"","name":"callback","optional":false,"type":"fun(ok: boolean, err: string|nil)"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"23f9d687-1ebaacf0","shape_size":106,"signature":"M.capture(out, callback)","snippet":"function M.capture(out, callback)\n  if vim.fn.has(\"mac\") == 1 then\n    capture_mac(out, callback)\n  elseif vim.fn.has(\"win32\") == 1 or vim.fn.has(\"win64\") == 1 then\n    capture_windows(out, callback)\n  else\n    capture_linux(out, callback)\n  end\nend","snippet_omitted":0,"summary":"Interaktive Bildschirmauswahl starten und nach `out` schreiben.","test":[],"tested":false,"todo":[]}],"id":"lua/images/screenshot.lua","kind":"file","module":"images.screenshot","name":"screenshot.lua","parent":"lua/images","path":"lua/images/screenshot.lua","plugins":[],"required_by":["lua/images/health.lua","lua/images/paste.lua"],"requires":["lua/images/config"],"requires_external":[],"requires_raw":[{"deferred":true,"line":47,"module":"images.config"}],"source":"lua/images/screenshot.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":9,"lines":246,"modules":0,"namespaces":0,"symbols":1,"types":0},"summary":"Ersetzt für den Alltagsfall drei Schritte (Screenshot-Tool von Hand starten → Zwischenablage → `:Image paste`) durch einen: `:Image screenshot` startet…","symbols":[{"detail":"table.concat({ \"Add-Type -AssemblyName System.W…","kind":"binding","line":124,"name":"PS_READ_CLIPBOARD_B64","summary":"PowerShell-Fragment: aktuelles Zwischenablage-Bild als Base64 ausgeben, oder nichts, wenn keins da ist."}],"types":[]},{"body":"Auf nativem Windows-Neovim in WezTerm zeichnet das Terminal aus Neovim heraus\nausschließlich OSC 1337. Kitty-APC (`ESC _G`) kommt nie an — in rohem pwsh\nfunktionieren beide Protokolle, der Unterschied entsteht erst durch Neovims\nAusgabeschicht. Da `snacks.image` und `image.nvim` beide nur Kitty-APC senden,\nsind sie dort prinzipiell unbrauchbar, unabhängig von jeder Konfiguration.\n\nDrei Eigenheiten, die beim Bauen Zeit gekostet haben:\n\n* Geschrieben wird über `vim.api.nvim_ui_send`, nicht über `io.stdout:write`.\n  Letzteres zeichnet nur beim ersten Mal pro Terminal-Session.\n* Ohne Cursor-Positionierung landet das Bild am unteren Rand und schiebt die\n  Statusline hoch. Daher `ESC[s` / `ESC[<row>;<col>H` / Payload / `ESC[u`.\n* `width`/`height` werden in **Zellen** angegeben, nicht in Pixeln. Zusammen\n  mit `preserveAspectRatio=1` skaliert das Terminal selbst, und die Zellgröße\n  in Pixeln muss nirgends bekannt sein.\n\nDas Protokoll kennt keine Bild-IDs: Gezeichnetes lässt sich nicht einzeln\nentfernen, nur der ganze Schirm neu zeichnen. Deshalb hält dieses Modul\nlediglich ein Flag statt einer Platzierungs-Verwaltung.","calls_external":[],"calls_raw":[{"callee":"type","from_fn":"M.available","line":43},{"callee":"(vim.env.TERM_PROGRAM or \"\"):lower","line":70},{"callee":"tp:find","line":71},{"callee":"(vim.env.LC_TERMINAL or \"\"):lower():find","line":71},{"callee":"(vim.env.LC_TERMINAL or \"\"):lower","line":71},{"callee":"M.available","from_fn":"M.capability","line":96},{"callee":"ipairs","from_fn":"M.capability","line":106},{"callee":"pcall","from_fn":"M.capability","line":107},{"callee":"type","from_fn":"read_file","line":150},{"callee":"require(\"images.convert\").is_svg","from_fn":"read_file","line":153},{"callee":"require","from_fn":"read_file" ent. \"\n        .. \"Funktioniert es, `display.assume_supported = true` setzen.\",\n    }\n  end\n\n  -- tmux reicht die Sequenzen nur mit allow-passthrough durch. Das gilt auch\n  -- für ein erkanntes Terminal, deshalb hier und nicht im else-Zweig.\n  if vim.env.TMUX and vim.env.TMUX ~= \"\" and capability.ok then\n    capability.hint = \"In tmux: `set -g allow-passthrough on` nötig, sonst kommt nichts an\"\n  end\n","snippet_omitted":2,"summary":"Prüfen, ob dieses Terminal Bilder darstellen kann.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":true,"generic":[],"internal":false,"line":139,"line_end":141,"local_refs":0,"name":"M.reset_capability","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"54590c9d-26830660","shape_size":17,"signature":"M.reset_capability()","snippet":"function M.reset_capability()\n  capability = nil\nend","snippet_omitted":0,"summary":"Gemerktes Prüfergebnis verwerfen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":9,"documented":true,"generic":[],"internal":false,"line":149,"line_end":165,"local_refs":2,"name":"read_file","nodiscard":false,"overload":[],"params":[{"desc":"","name":"file","optional":false,"type":"string"}],"returns":[{"desc":"","name":"data","type":"string|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"1b840fb8-6a5e42f2","shape_size":238,"signature":"read_file(file)","snippet":"local function read_file(file)\n  if type(file) ~= \"string\" or file == \"\" then return nil, \"Kein Dateipfad angegeben\" end\n\n  local effective = file\n  if require(\"images.convert\").is_svg(file) then\n    local png, conv_err = require(\"images.convert\").to_png(file)\n    if not png then return nil, conv_err end\n    effective = png\n  end\n\n  local fd, open_err = io.open(effective, \"rb\")\n  if not fd then return nil, (\"Datei nicht lesbar: %s (%s)\"):format(effective, open_err or \"?\") end\n  local raw = fd:read(\"*a\")\n  fd:close()\n  if not raw or raw == \"\" then return nil, \"Datei ist leer: \" .. effective end\n  return raw\nend","snippet_omitted":0,"summary":"Dateiinhalt lesen.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":true,"generic":[],"internal":false,"line":172,"line_end":186,"local_refs":2,"name":"payload_for","nodiscard":false,"overload":[],"params":[{"desc":"Rohe Dateibytes","name":"raw","optional":false,"type":"string"},{"desc":"Breite in Zellen","name":"cols","optional":false,"type":"integer"},{"desc":"Höhe in Zellen","name":"rows","optional":false,"type":"integer"}],"returns":[{"desc":"","type":"string"}],"see":[],"shape":"10adac65-8e0dc29","shape_size":101,"signature":"payload_for(raw, cols, rows)","snippet":"local function payload_for(raw, cols, rows)\n  -- table.concat statt wiederholter `..`-Verkettung: der Base64-Anteil ist\n  -- bei großen Bildern mehrere hundert KB groß, jede Zwischenkopie zählt.\n  return table.concat({\n    ESC,\n    \"]1337;File=inline=1\",\n    \";size=\" .. #raw,\n    \";width=\" .. cols,\n    \";height=\" .. rows,\n    \";preserveAspectRatio=1\",\n    \":\",\n    vim.base64.encode(raw),\n    BEL,\n  })\nend","snippet_omitted":0,"summary":"OSC-1337-Sequenz für einen Bilddateiinhalt bauen.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":1,"documented":true,"generic":[],"internal":false,"line":202,"line_end":204,"local_refs":2,"name":"flush_pending_redraw","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"162dfc66-52414deb","shape_size":23,"signature":"flush_pending_redraw()","snippet":"local function flush_pending_redraw()\n  pcall(vim.cmd, \"redraw\")\nend","snippet_omitted":0,"summary":"Anstehende Bildschirmausgabe erzwingen, BEVOR gezeichnet wird.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":3,"documented":true,"generic":[],"internal":false,"line":214,"line_end":232,"local_refs":0,"name":"M.draw","nodiscard":false,"overload":[],"params":[{"desc":"Absoluter Pfad zu einer Bilddatei","name":"file","optional":false,"type":"string"},{"desc":"1-basierte Terminalzeile","name":"row","optional":false,"type":"integer"},{"desc":"1-basierte Terminalspalte","name":"col","optional":false,"type":"integer"},{"desc":"Maximale Breite in Zellen","name":"cols","optional":false,"type":"integer"},{"desc":"Maximale Höhe in Zellen","name":"rows","optional":false,"type":"integer"}],"returns":[{"desc":"","name":"ok","type":"boolean"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"78809958-2f6a7124","shape_size":177,"signature":"M.draw(file, row, col, cols, rows)","snippet":"function M.draw(file, row, col, cols, rows)\n  if not M.available() then return false, \"Terminalausgabe nicht verfügbar (nvim_ui_send fehlt, benötigt API-Level 14)\" end\n\n  -- Vor dem Lesen: schlägt das Lesen fehl, war der Flush umsonst, aber\n  -- harmlos — umgekehrt käme er zu spät.\n  local raw, err = read_file(file)\n  if not raw then return false, err end\n\n  flush_pending_redraw()\n\n  local send = vim.api.nvim_ui_send\n  send(ESC .. \"[s\")\n  send(ESC .. \"[\" .. row .. \";\" .. col .. \"H\")\n  send(payload_for(raw, cols, rows))\n  send(ESC .. \"[u\")\n\n  showing = true\n  return true\nend","snippet_omitted":0,"summary":"Ein Bild an einer Terminalposition zeichnen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":true,"generic":[],"internal":false,"line":247,"line_end":270,"local_refs":0,"name":"M.draw_many","nodiscard":false,"overload":[],"params":[{"desc":"","name":"placements","optional":false,"type":"Images.Placement[]"}],"returns":[{"desc":"Anzahl tatsächlich gezeichneter Bilder","name":"drawn","type":"integer"},{"desc":"Fehlermeldungen der übersprungenen Bilder","name":"errors","type":"string[]"}],"see":[],"shape":"5f992dc4-1e215a80","shape_size":264,"signature":"M.draw_many(placements)","snippet":"function M.draw_many(placements)\n  if not M.available() then return 0, { \"Terminalausgabe nicht verfügbar (nvim_ui_send fehlt)\" } end\n\n  local send = vim.api.nvim_ui_send\n  local drawn, errors = 0, {}\n\n  flush_pending_redraw()\n\n  send(ESC .. \"[s\")\n  for _, p in ipairs(placements) do\n    local raw, err = read_file(p.file)\n    if raw then\n      send(ESC .. \"[\" .. p.row .. \";\" .. p.col .. \"H\")\n      send(payload_for(raw, p.cols, p.rows))\n      drawn = drawn + 1\n    else\n      errors[#errors + 1] = err or (\"Übersprungen: \" .. tostring(p.file))\n    end\n  end\n  send(ESC .. \"[u\")\n\n  if drawn > 0 then showing = true end\n  return drawn, errors\nend","snippet_omitted":0,"summary":"Mehrere Bilder in einem Rutsch zeichnen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":275,"line_end":279,"local_refs":0,"name":"M.clear","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"448e9c80-77c32c78","shape_size":41,"signature":"M.clear()","snippet":"function M.clear()\n  if not showing then return end\n  showing = false\n  pcall(vim.cmd, \"mode\")\nend","snippet_omitted":0,"summary":"Alle angezeigten Bilder entfernen.","test":[],"tested":true,"todo":[]}],"id":"lua/images/terminal.lua","kind":"file","module":"images.terminal","name":"terminal.lua","parent":"lua/images","path":"lua/images/terminal.lua","plugins":[],"required_by":["lua/images","lua/images/anchor.lua","lua/images/bindings/autocmds.lua","lua/images/browse.lua","lua/images/compare.lua","lua/images/guard.lua","lua/images/health.lua","lua/images/hover_float.lua","lua/images/redact.lua","lua/images/zen.lua"],"requires":["lua/images/convert.lua"],"requires_external":[],"requires_raw":[{"deferred":true,"line":153,"module":"images.convert"},{"deferred":true,"line":154,"module":"images.convert"}],"source":"lua/images/terminal.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,         var mcEdge = moduleCallEdgeByPair[pairKey];
        if(!mcEdge){
          mcEdge = { from: e.from, to: e.to, weight: 0 };
          moduleCallEdgeByPair[pairKey] = mcEdge;
          push(moduleCallOut, e.from, mcEdge);
          push(moduleCallIn, e.to, mcEdge);
        }
        mcEdge.weight++;
      }
    } else if(e.kind === "type"){
      typeEdges.push(e);
    } else if(e.kind === "extends"){
      extendsEdges.push(e);
      push(extUp, e.from_class, e);
      push(extDown, e.to_class, e);
    }
  });

  // Classes that take part in at least one inheritance relation. The
  // Inheritance view seeds from these rather than from every class the
  // centered node declares: a class with no parent and no subclass is an
  // isolated box in a view that exists to show relationships, and most nodes
  // declare several of those — they would crowd out the handful of boxes that
  // actually connect.
  var inInheritance = {};
  extendsEdges.forEach(function(e){
    inInheritance[e.from_class] = true;
    inInheritance[e.to_class] = true;
  });

  // @see target -> owning node id. Same three resolution shapes as
  // docmap.check's check_see_targets, kept in sync deliberately: a bare
  // module path, "module.bareName" (the qualified form a reader would
  // actually write), and the raw declared name (e.g. "M.scan_full") as a
  // fallback for targets copy-pasted straight from source.
  var seeIndex = {};
  IR.nodes.forEach(function(n){
    if(n.module) seeIndex[n.module] = n.id;
    (n.functions || []).forEach(function(fn){
      seeIndex[fn.name] = n.id;
      if(n.module){
        var bare = fn.name.replace(/^[A-Z][\w]*\./, "");
        seeIndex[n.module + "." + bare] = n.id;
      }
    });
  });

  var repo = IR.meta.repo_url, branch = IR.meta.branch || "main";
  function srcUrl(p){ return repo ? repo + "/blob/" + branch + "/" + p : null; }

  function esc(s){ return (s||"").replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // The affordance that opens the annotation popup, for any list that shows
  // a function. `tabindex` because a keyboard reader must be able to reach
  // it; `aria-label` rather than `title` because a native tooltip would open
  // *beside* the card this control exists to open, saying less.
  // Emits the mark trigger alongside, rather than making six call sites
  // remember to render both. The two controls are a pair — "tell me about
  // this" and "set this aside" — and a list that grew one without the other
  // would be a list the compare tab silently cannot reach.
  function sigTrigger(nodeId, fnName){
    var key = fnKey(nodeId, fnName);
    return '<span class="sigi" tabindex="0" role="button" aria-label="Annotations"' +
      ' data-sig="' + esc(key) + '">&#9432;</span>' + markTrigger(key);
  }

  var DOCREFS = (IR.docs && IR.docs.refs) || {};

  // The same affordance for prose references, and deliberately **only
  // rendered when there are some**. An always-present icon that is usually
  // empty trains the reader to ignore it; one that appears exactly when a
  // document mentions this thing is itself the signal, before it is clicked.
  // `key` is a node id for a module or `nodeId#fnName` for a function — the
  // shape `docs.lua` files references under.
  function docTrigger(key){
    var refs = DOCREFS[key];
    if(!refs || !refs.length) return "";
    return '<span class="doci" tabindex="0" role="button" data-doc="' + esc(key) +
      '" aria-label="Mentioned in ' + refs.length + ' place' +
      (refs.length === 1 ? '' : 's') + ' in the docs">&#182;' +
      (refs.length > 1 ? '<span class="docn">' + refs.length + '</span>' : '') + '</span>';
  }

  // =====================================================================
  // Compiler Explorer (opts.godbolt, experimental, session 2026-08-10) —
  // a genuine `luac -l -l -p` bytecode disassembly for Lua, not a
  // workaround: verified against Compiler Explorer's own `/api/languages`
  // (lua is a real language id there) and its compiler source (the "lua"
  // compiler class runs exactly that), after an earlier version of this
  // roadmap item wrongly assumed Lua had no meaningful compiled output to
  // show. `godbolt.org/clientstate/<base64 JSON>` is Compiler Explorer's
  // own documented, fully client-side link format — no API call needed to
  // build one, so opening it is the only network access this feature ever
  // causes, the same posture every other external link on this page
  // (`srcUrl`, `tag_links`) already has.
  //
  // No new IR field: built lazily, on click, from `fn.snippet` — already
  // serialized for the existing hover-preview feature, already bounded the
  // same way `core/snippet.lua` bounds it. A very long function's snippet
  // may be truncated (`snippet_omitted` says by how much); the bytecode
  // Compiler Explorer shows for it is correspondingly a compile of that
  // same truncated fragment — the same honesty the in-page preview already
  // has, not a new limitation this feature introduces. A module's own link
  // concatenates its functions' snippets in declaration order — an
  // approximation of the file, not the file itself (comments/requires/
  // symbols outside a function are not part of any `fn.snippet`), which is
  // why this is marked experimental rather than a byte-perfect "whole
  // project" view — Compiler Explorer's own Lua compiler (`luac`) takes
  // exactly one file per compile in any case; there is no project mode for
  // it the way CMake/C++ has.
  function godboltUrl(source){
    var state = { sessions: [{ id: 1, language: "lua", source: source,
      compilers: [{ id: "lua547", options: "" }] }] };
    // btoa is Latin1-only; encodeURIComponent/unescape is the standard
    // UTF-8-safe detour around that (Lua source can carry UTF-8 in
    // comments/strings). The result then needs the url-safe substitution
    // Compiler Explorer's own clientstate format documents.
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(state))))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    return "https://godbolt.org/clientstate/" + b64;
  }

  // Emits nothing at all unless `opts.godbolt` was set at generation time
  // — same "render nothing when not applicable" shape `docTrigger` above
  // already has, just gated by a build-time flag instead of runtime data.
  // The URL itself is *not* built here: constructing and base64-encoding a
  // clientstate JSON for every function/module on a large tree, on every
  // page load, for a link most readers will never click, would be
  // needless work — `kind`/`key` are carried on the element instead, and
  // the real URL is built once, lazily, in the click handler below.
  // Functions only. `kind` is kept on the element because the click handler
  // reads it, not because there is a second kind left to pass.
  //
  // The notice is a real box on hover and on focus, not a `title`. What it
  // has to say is that clicking sends this function's source to a third
  // party — a `title` tooltip is the wrong weight for that, it appears after
  // a delay, never appears for keyboard users, and cannot be read by anyone
  // who is deciding whether to click.
  function godboltTrigger(kind, key){
    if(!IR.meta.godbolt) return "";
    return '<span class="godi-wrap"><a href="#" class="godi" data-godbolt="' + kind +
      '" data-godbolt-key="' + esc(key) + '">⚙ Compiler Explorer ↗</a>' +
      '<span class="godi-tip" role="note"><b>Experimental — leaves your machine.</b> ' +
      'Opens Compiler Explorer in a new tab and hands it this function’s source, so ' +
      'godbolt.org compiles it and shows you real <code>luac</code> bytecode. The code ' +
      'travels inside the link itself: nothing is uploaded ahead of time and nothing is ' +
      'stored there. It is still someone else’s server, and this map has no other ' +
      'outbound request anywhere.</span></span>';
  }

  // Where a mention lives, and the line it sits on. Rendered into the same
  // card the annotation popup uses rather than a second floating thing with
  // its own lifecycle — one set of rules for one page.
  function docRefsHTML(key){
    var refs = DOCREFS[key] || [];
    var h = ['<div class="fn-sig">Mentioned in the docs<span class="fn-badges">' +
      '<span class="bd">' + refs.length + '</span></span></div>'];
    refs.forEach(function(r){
      h.push('<div class="docref">' +
        '<div class="docref-where">' + esc(r.doc) + ':' + r.line +
        (r.confidence === "heuristic"
          ? '<span class="bd" title="matched on a bare, tree-unique name">heuristic</span>'
          : '') +
        '</div>' +
        '<div class="docref-ctx">' + esc(r.context) + '</div></div>');
    });
    if(refs.more){
      h.push('<div class="fn-desc">… and ' + refs.more +
        ' more, not carried into the artifact.</div>');
    }
    return h.join("");
  }

  // Everything a function's annotations say, as HTML: signature line with
  // badges, deprecation, summary, params, returns, overloads, see-also,
  // example.
  //
  // Shared on purpose between the Tree tab's detail pane (which has always
  // rendered this) and the annotation popup (which is the whole reason this
  // was extracted). Two copies of "how a function's annotations look" is
  // exactly the drift this plugin exists to detect, and shipping one inside
  // it would be hard to defend — the same argument the `?` key-hint overlay
  // already makes for rendering from the same KEYS table it binds from.
  //
  // What deliberately stays with the caller: the `<div class="fn">` wrapper
  // and the Calls-view links, both of which only make sense in the detail
  // pane, where `callOut`/`callIn` counts and a stable per-function anchor
  // exist.
  function fnAnnotationHTML(fn){
    var h = [];
    var badges = [];
    if(fn.deprecated !== undefined) badges.push('<span class="bd dep">deprecated</span>');
