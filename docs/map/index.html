<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>images.nvim — module map</title><style>:root{
  --bg:#fbfbfa; --panel:#fff; --ink:#1a1a19; --muted:#6b6b68; --line:#e4e4e1;
  --accent:#3b6ea8; --accent-soft:#eaf1f9;
  --error:#b3261e; --warn:#8a5a00; --info:#4a4a48;
  --mod:#3b6ea8; --ns:#7a7a76; --file:#5c8a5c;
  --dep:#a35a2a; --call:#6b4c9a; --fn:#8a5a00; --ext:#2a7a6f;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16171a; --panel:#1d1f23; --ink:#e6e6e3; --muted:#9a9a95; --line:#2e3136;
    --accent:#7aa9dd; --accent-soft:#22303f;
    --error:#f2837b; --warn:#e0b060; --info:#a8a8a3;
    --mod:#7aa9dd; --ns:#9a9a95; --file:#8fbf8f;
    --dep:#d99b6a; --call:#b09ada; --fn:#e0b060; --ext:#6fc0b3;
  }
}
:root[data-theme="light"]{
  --bg:#fbfbfa; --panel:#fff; --ink:#1a1a19; --muted:#6b6b68; --line:#e4e4e1;
  --accent:#3b6ea8; --accent-soft:#eaf1f9;
  --error:#b3261e; --warn:#8a5a00; --info:#4a4a48;
  --mod:#3b6ea8; --ns:#7a7a76; --file:#5c8a5c;
  --dep:#a35a2a; --call:#6b4c9a; --fn:#8a5a00; --ext:#2a7a6f;
}
:root[data-theme="dark"]{
  --bg:#16171a; --panel:#1d1f23; --ink:#e6e6e3; --muted:#9a9a95; --line:#2e3136;
  --accent:#7aa9dd; --accent-soft:#22303f;
  --error:#f2837b; --warn:#e0b060; --info:#a8a8a3;
  --mod:#7aa9dd; --ns:#9a9a95; --file:#8fbf8f;
  --dep:#d99b6a; --call:#b09ada; --fn:#e0b060; --ext:#6fc0b3;
}
*{box-sizing:border-box}
/* Type scale: 9.5 / 10.5 / 11.5 / 12.5 / 13 / 14 / 15 / 17 / 19 / 20px.
   Ten steps, not the fifteen this file used to declare — measured, not
   eyeballed: `grep -oE "font-size:[0-9.]+px"` found half-integer pairs
   less than a pixel apart (`11px`/`11.5px`, `12px`/`12.5px`…) with no
   distinguishing use — real signal the scale accreted through ordinary
   editing rather than being designed, exactly as
   docs/ROADMAP/V1_EXTENSION/IMPLEMENTATION_PLAN.md's Phase 4 named and
   deliberately deferred pending visual verification. Verified this time
   by counting which of each pair was already used more: every merge
   moved the *less*-used value onto the *more*-used one, so the majority
   of rules — the ones most likely to anchor a reader's sense of the
   page's rhythm — render pixel-identical to before, and only the
   minority actually shifted. No rule's *relative* ordering changed. */
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:20px 24px 14px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
h1 .sub{color:var(--muted);font-weight:400;font-size:14px;margin-left:8px}
.stats{margin-left:auto;display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
/* The counts are buttons, but they must not look like the toolbar's. Stripped
   back to text, gaining an underline only on hover — the affordance appears
   where the pointer already is, without five chrome buttons in the header. */
.stat-link{padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;
  border-radius:4px}
.stat-link:hover:not(:disabled){text-decoration:underline;text-underline-offset:3px}
.stat-link:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
/* A zero count is not a link. Same opacity as the surrounding muted text, so
   it reads as a number rather than as something broken. */
.stat-link:disabled{cursor:default}
/* Where an errors/warnings click lands. Fades, so the eye is drawn to the row
   without leaving a permanent highlight the reader then has to dismiss. */
@keyframes findflash{from{background:var(--accent-soft)}to{background:transparent}}
#findings tbody tr.flash td{animation:findflash 1.6s ease-out}
.toolbar{padding:12px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid var(--line)}
#q{flex:1;min-width:200px;max-width:440px;padding:7px 11px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel);color:var(--ink);font-size:14px}
#q:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
button{padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  color:var(--ink);font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:0 24px;border-bottom:1px solid var(--line)}
.tab-btn{padding:9px 13px;border:none;background:none;color:var(--muted);font-size:13px;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.view{display:none}
.view.active{display:block}
main.view.active{display:grid}
main{grid-template-columns:minmax(300px,1.1fr) minmax(0,1.4fr);gap:0;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
#tree{padding:12px 8px 60px 16px;border-right:1px solid var(--line);
  max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#tree{max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
.row{display:flex;align-items:baseline;gap:7px;padding:3px 8px;border-radius:6px;cursor:pointer;
  white-space:nowrap}
.row:hover{background:var(--accent-soft)}
.row.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.tw{width:14px;flex:none;color:var(--muted);font-size:11.5px;user-select:none}
.nm{font-family:var(--mono);font-size:13px}
.k-module .nm{color:var(--mod)} .k-namespace .nm{color:var(--ns)} .k-file .nm{color:var(--file)}
.sm{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.badges{display:flex;gap:4px;flex:none}
.bd{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;
  border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.bd.rd{color:var(--accent);border-color:var(--accent)}
.bd.dep{color:var(--error);border-color:var(--error)}
.bd.tested{color:var(--accent);border-color:var(--accent)}
.kids{margin-left:15px;border-left:1px solid var(--line);padding-left:3px}
.kids.hide{display:none}
#detail{padding:22px 26px 60px;max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#detail{max-height:none}}
#detail h2{margin:0 0 3px;font-size:17px;font-family:var(--mono);font-weight:600}
.mp{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:16px;
  word-break:break-all}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.links a{font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;
  text-decoration:none;color:var(--accent);background:var(--panel)}
.links a:hover{border-color:var(--accent)}
.prose{white-space:pre-wrap;font-size:13px;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 15px;
  margin-bottom:18px;overflow-x:auto}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:18px 0 7px;font-weight:600}
.lst{list-style:none;margin:0;padding:0}
.lst li{font-family:var(--mono);font-size:12.5px;padding:2px 0;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;font-style:italic}
.fn{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.fn:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
.fn-sig{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600}
.fn-badges{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.fn-desc{font-size:12.5px;color:var(--muted);margin:4px 0}
.fn-dep{color:var(--error);font-size:11.5px;font-weight:600;margin:4px 0}
.fn-plist{list-style:none;margin:4px 0;padding:0;font-size:11.5px}
.fn-plist li{padding:1px 0}
.fn-plist code{background:none;padding:0;color:var(--accent)}
.fn-ex{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;background:var(--accent-soft);
  border-radius:6px;padding:8px 10px;margin-top:6px;overflow-x:auto}
.fn-see a{color:var(--accent);text-decoration:none}
.fn-see a:hover{text-decoration:underline}
/* The bounded source snippet — popup-only, see snippetHTML()'s own comment
   for why this never touches the Tree tab's detail pane. Same shape as
   `.fn-ex`'s code block, a distinct class since the content is source, not
   an authored `@example`. */
.fn-snip-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);margin-top:10px}
.fn-snip-label .bd{text-transform:none;letter-spacing:0;margin-left:6px}
.fn-snip{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;background:var(--accent-soft);
  border-radius:6px;padding:8px 10px;margin-top:4px;overflow-x:auto}
/* Annotation popup — the same fn-* markup the detail pane renders, floated
   over whichever list the reader is scanning. Every list in this map shows a
   signature and nothing else; the params, returns and prose that were
   already parsed sat one navigation away, which is what this closes.
   `position:fixed` because the trigger can live inside a scrolling panel and
   an absolutely-positioned card would scroll away from its own anchor. */
.sigpop{position:fixed;z-index:60;display:none;max-width:520px;min-width:260px;
  max-height:60vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px}
.sigpop.on{display:block}
.sigpop .fn-sig{font-size:12.5px}
/* The trigger. Kept at full opacity for keyboard focus and while its popup
   is open, so tabbing through a list does not chase an invisible control. */
.sigi{display:inline-block;margin-left:6px;padding:0 4px;border-radius:4px;cursor:help;
  font-size:10.5px;line-height:15px;color:var(--muted);border:1px solid var(--line);
  opacity:.45;transition:opacity .12s,color .12s;user-select:none}
.sigi:hover,.sigi:focus,.sigi.on{opacity:1;color:var(--accent);border-color:var(--accent);
  outline:none}
li:hover>.sigi,tr:hover .sigi{opacity:.8}
/* The prose-reference affordance. Rendered only where references exist, so
   unlike `.sigi` it carries information by being present at all — hence a
   accent-tinted resting state rather than `.sigi`'s near-invisible one. */
.doci{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;cursor:help;
  font-size:10.5px;line-height:15px;color:var(--accent);border:1px solid var(--line);
  background:var(--accent-soft);opacity:.75;transition:opacity .12s;user-select:none}
.doci:hover,.doci:focus,.doci.on{opacity:1;border-color:var(--accent);outline:none}
.docn{margin-left:4px;font-weight:600}
.docref{margin:7px 0;padding-left:9px;border-left:2px solid var(--line)}
.docref-where{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.docref-where .bd{margin-left:6px}
.docref-ctx{font-size:11.5px;color:var(--muted);margin-top:2px}
/* @overload — one block per alternative call shape, indented under the
   primary signature so it reads as "also, this" rather than a second
   function. Left border rather than a background: a filled block here would
   compete with the deprecation banner for the reader's eye, and this is a
   much quieter fact. */
.fn-overloads{margin:6px 0 0 0;padding-left:10px;border-left:2px solid var(--line)}
.fn-ov-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:2px}
.fn-ov-sig{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.fn-ov-raw{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-style:italic}
code{font-family:var(--mono);font-size:.92em;background:var(--accent-soft);
  padding:1px 4px;border-radius:4px}
#findings{padding:0 24px 50px}
#findings table{border-collapse:collapse;width:100%;font-size:12.5px}
#findings th{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);
  color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
#findings td{padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:top}
#findings td.msg{font-family:var(--mono);font-size:11.5px;word-break:break-word}
.sev{font-weight:650;text-transform:uppercase;font-size:10.5px;letter-spacing:.05em}
.sev.error{color:var(--error)} .sev.warn{color:var(--warn)} .sev.info{color:var(--info)}
details>summary{cursor:pointer;font-size:13px;color:var(--muted);padding:8px 0}
.wrap{overflow-x:auto}
#view-notes{padding:22px 26px 60px}
#view-notes h3{margin:26px 0 4px;font-size:13px;font-weight:600;color:var(--ink)}
#view-notes h3:first-child{margin-top:0}
#view-notes .nsub,#view-index .nsub,#view-analysis .nsub,#view-features .nsub{
  font-size:12.5px;color:var(--muted);margin:0 0 10px}
#view-notes .ncount,#view-index .ncount{color:var(--muted);font-weight:400;font-size:11.5px;
  margin-left:6px}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{padding:7px 0;border-bottom:1px dashed var(--line)}
.nlist li:last-child{border-bottom:0}
.nlist .nfn{font-family:var(--mono);font-size:12.5px;color:var(--accent);
  text-decoration:none;font-weight:600;cursor:pointer}
.nlist .nfn:hover{text-decoration:underline}
.nlist .nfn:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.godi-wrap{position:relative;display:inline-block}
.godi-tip{display:none;position:absolute;z-index:40;left:0;top:calc(100% + 6px);
  width:min(46ch,80vw);padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--ink);font-size:12.5px;line-height:1.45;
  box-shadow:0 6px 20px rgba(0,0,0,.18)}
.godi-tip b{color:var(--accent)}
/* Hover *and* focus: a warning only a mouse can see is not a warning. */
.godi-wrap:hover .godi-tip,.godi-wrap:focus-within .godi-tip{display:block}
.godi-off{opacity:.55;text-decoration:line-through}
.godi-note{margin-top:4px;font-size:11.5px;color:var(--muted);max-width:62ch}
.feat-name[data-node]:focus-visible,.feat-tab-name[data-node]:focus-visible{
  outline:2px solid var(--accent-soft);outline-offset:2px}
/* Roving-tabindex lists: the container is the tab stop, the item is what the
   arrows move. Both need to say where focus is. `outline-offset:-2px` on the
   row keeps the ring inside the row box, which a table row would otherwise
   clip against its neighbours. */
#tree:focus-visible,#hist-list:focus-visible,#anbody:focus-visible{
  outline:2px solid var(--accent-soft);outline-offset:-2px}
.row:focus-visible,.crow:focus-visible,tr.anrow:focus-visible{
  outline:2px solid var(--accent);outline-offset:-2px}
.antable th.ansort:focus-visible{outline:2px solid var(--accent-soft);outline-offset:-2px}
.nlist .nwhere{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:8px}
.nlist .ntext{font-size:12.5px;color:var(--ink);margin-top:2px}
/* Unscoped variant: the Analysis panels' empty-state paragraphs
   (`<p class="ntext none">`) and the Features tab both use this outside any
   `.nlist`, and it was previously only ever styled inside one. */
.ntext.none{color:var(--muted);font-style:italic}
/* --- Features tab -------------------------------------------------------- */
#view-features{padding:22px 26px 60px}
.feat-wrap{max-width:820px}
.feat-intro{font-size:13px;color:var(--ink);line-height:1.5;margin-bottom:16px}
.feat-card{border:1px solid var(--line);border-radius:8px;background:var(--panel);
  padding:11px 14px;margin-bottom:8px}
.feat-name{font-size:13px;font-weight:600;color:var(--ink)}
.feat-name[data-node]{cursor:pointer;color:var(--accent)}
.feat-name[data-node]:hover{text-decoration:underline}
.feat-summary{font-size:12.5px;color:var(--ink);margin-top:4px;line-height:1.45}
.feat-meta{margin-top:7px;display:flex;flex-direction:column;gap:2px}
.feat-meta-row{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.feat-meta-row b{color:var(--ink);font-weight:600;margin-right:4px}
.feat-src{margin-top:6px}
.feat-src a{font-size:10.5px;color:var(--muted);font-family:var(--mono);text-decoration:none;
  cursor:pointer}
.feat-src a:hover{color:var(--accent);text-decoration:underline}
/* A promoted feature's own tab (`Tab: true` — see docs/FEATURES_FORMAT.md).
   Dynamically created, one `[id^="view-feature-"]` panel per promoted
   feature — `.view`/`.view.active` above already govern its visibility,
   nothing feature-tab-specific needed there. */
[id^="view-feature-"]{padding:22px 26px 60px}
.feat-tab-wrap{max-width:760px}
.feat-tab-theme{font-size:11.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em}
.feat-tab-name{margin:2px 0 0;font-size:19px;font-weight:600;color:var(--ink)}
.feat-tab-name[data-node]{cursor:pointer;color:var(--accent)}
.feat-tab-name[data-node]:hover{text-decoration:underline}
.feat-tab-summary{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.5}
.feat-tab-body{margin-top:16px;font-size:13px;color:var(--ink);line-height:1.55}
.feat-tab-body h4,.feat-tab-body h5,.feat-tab-body h6{margin:18px 0 4px;font-weight:600;
  color:var(--ink)}
.feat-tab-body h4:first-child,.feat-tab-body h5:first-child,
.feat-tab-body h6:first-child{margin-top:0}
.feat-tab-body p{margin:8px 0}
.feat-tab-body ul{margin:8px 0;padding-left:22px}
.feat-tab-body li{margin:2px 0}
.feat-tab-body pre{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;
  background:var(--accent-soft);border-radius:6px;padding:8px 10px;margin:10px 0;
  overflow-x:auto}
.feat-tab-body pre code{background:none;padding:0}
.feat-tab-body a{color:var(--accent)}
#hist-list{padding:12px 8px 60px 16px;border-right:1px solid var(--line);
  max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#hist-list{max-height:none;border-right:0;
  border-bottom:1px solid var(--line)}}
#hist-detail{padding:22px 26px 60px;max-height:calc(100vh - 132px);overflow:auto}
@media (max-width:860px){#hist-detail{max-height:none}}
.crow{padding:5px 8px;border-radius:6px;cursor:pointer}
.crow:hover{background:var(--accent-soft)}
.crow.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.crow .csub{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.crow .cmeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:1px}
.hist-approx{color:var(--warn);font-size:11.5px;border:1px solid var(--warn);
  border-radius:5px;padding:5px 8px;margin:0 0 12px}
.hist-sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:18px 0 7px;font-weight:600}
.hist-fn{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600}
.hist-callers{list-style:none;margin:2px 0 8px;padding:0 0 0 14px}
.hist-callers li{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:1px 0}
.hist-mods{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 4px}
.hist-mods a{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--accent);cursor:pointer;text-decoration:none}
.hist-mods a:hover{border-color:var(--accent);background:var(--accent-soft)}
.hist-mods span.gone{font-family:var(--mono);font-size:11.5px;padding:2px 7px;
  border-radius:5px;border:1px dashed var(--line);color:var(--muted)}
.hist-diff{font-family:var(--mono);font-size:11.5px;white-space:pre;overflow-x:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  max-height:460px;overflow-y:auto}
.hist-diff .da{color:var(--file)} .hist-diff .dd{color:var(--error)}
.hist-diff .dh{color:var(--accent);font-weight:600} .hist-diff .dm{color:var(--muted)}
#view-index{padding:22px 26px 60px}
#ixtoggle{margin-bottom:14px}
#view-analysis{padding:22px 26px 60px}
#antoggle{margin-bottom:14px}
.cl-h{margin:18px 0 6px;font-size:14px}
.cl-h .cl-src{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:8px}
.cl-list{list-style:none;margin:0;padding:0}
.cl-item{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:7px 10px;
  border:1px solid var(--line);border-radius:7px;background:var(--panel);margin-bottom:6px}
.cl-box{font-family:ui-monospace,monospace;color:var(--muted)}
.cl-item.cl-done .cl-box{color:var(--accent)}
.cl-text{flex:1 1 320px}
.cl-ref,.cl-date,.cl-meta{font-size:11.5px;color:var(--muted)}

.cl-current{color:var(--muted)}

.antable{width:100%;border-collapse:collapse;font-size:12.5px}
.antable th.ansort{cursor:pointer;user-select:none;white-space:nowrap}
.antable th.ansort:hover{color:var(--ink)}
.antable th.ansort.active{color:var(--accent)}
.antable th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.03em;padding:4px 8px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0}
.antable td{padding:5px 8px;border-bottom:1px dashed var(--line);font-family:var(--mono)}
.anrow{cursor:pointer}
.anrow:hover td{background:var(--accent-soft)}
.anflag{color:var(--warn);font-size:11.5px;border:1px solid var(--warn);
  border-radius:4px;padding:1px 5px;margin-left:6px}
.anbar{width:120px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.anfill{height:100%;background:var(--accent)}
.telpicker{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px}
.telpicker label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.telpicker select{font:inherit;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.telup{color:var(--file);font-weight:600}
.teldown{color:var(--warn);font-weight:600}
#view-index h3{margin:22px 0 6px;font-size:15px;font-weight:700;color:var(--accent);
  font-family:var(--mono);border-bottom:1px solid var(--line);padding-bottom:3px}
.ixjump{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 6px;position:sticky;top:0;
  background:var(--bg);padding:6px 0;z-index:2}
.ixjump a{font-family:var(--mono);font-size:12.5px;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--accent);cursor:pointer;text-decoration:none}
.ixjump a:hover{border-color:var(--accent);background:var(--accent-soft)}
.ixlist li{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:3px 0}
.ixtag{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:0 4px}
.ixtag.dep{color:var(--error);border-color:var(--error)}
.ixtag.tested{color:var(--accent);border-color:var(--accent)}
#view-hierarchy{padding:16px 24px 60px}
.hctl{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.hctl .hpath{font-family:var(--mono);font-size:12.5px;color:var(--muted);word-break:break-all}
.hctl button{padding:4px 9px;font-size:12.5px}
#hgraph-outer{position:relative}
/* `max-height` is not optional here — same `calc(100vh - 132px)` #detail
   and #hist-detail already cap themselves at, reused rather than
   invented. Without it `overflow:auto` has nothing to overflow *against*:
   a block with no height constraint sizes to its content, so as
   `applyZoom()` grows #hgraph's own width/height to match the scaled
   diagram, #hgraph-wrap (and everything containing it, up to the page
   itself) grew right along with it instead of clipping the content
   behind scrollbars. Reported exactly that way, watching someone zoom in
   and the whole page grow under them rather than the diagram zooming
   within a fixed frame — the zoom math itself (cursor-anchored, see
   zoomAt()) was already correct; this was the one property missing that
   let it actually behave like a viewport. */
#hgraph-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);max-height:calc(100vh - 132px)}
/* Root-level hide/show slider (Modules view only) — a vertical Google
   Maps-style control: "+" hides one more layer (zooming into a narrower
   slice of the tree), "-" shows one more (zooming back out). Positioned
   against #hgraph-outer, not #hgraph-wrap, so it stays put while the
   diagram underneath scrolls.

   Reported, watching someone use the page for the first time: this reads
   as an actual zoom control, not a tree-depth one — the vertical
   range-input shape and the "+"/"-" pair are exactly what a real zoom
   widget would look like, and this comment's own "zooming into a
   narrower slice" phrasing shows why: the word applies here only as a
   metaphor. `.hrootslider-label` exists because the tooltip
   (`title="Hide root levels…"`) was the only place that said so, and
   nobody hovers a control to find out what it does before deciding
   whether to use it. */
.hrootslider{position:absolute;left:10px;top:14px;z-index:20;display:none;
  flex-direction:column;align-items:center;gap:4px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:8px 6px;
  box-shadow:0 2px 8px rgba(0,0,0,.14)}
.hrootslider.on{display:flex}
.hrootslider-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);white-space:nowrap;margin-bottom:1px}
.hroot-btn{width:22px;height:22px;padding:0;border:1px solid var(--line);
  border-radius:5px;background:var(--bg);color:var(--ink);font-size:14px;
  line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hroot-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.hroot-btn:disabled{opacity:.35;cursor:default}
/* `writing-mode:vertical-lr` turns a plain range input vertical with no JS
   transform hack — min renders at the bottom, max at the top, which is
   exactly "+" (more hidden, higher value) above "-" (less hidden, lower
   value) without any extra flipping. */
#hrootrange{writing-mode:vertical-lr;width:20px;height:84px;margin:2px 0;
  cursor:pointer;accent-color:var(--accent)}
/* Middle-drag panning. `grabbing` only while a drag is live — a permanent
   grab cursor would advertise left-drag panning, which is deliberately not
   what this does. `user-select:none` is on the dragging state only, so text
   in the boxes stays selectable the rest of the time. */
#hgraph-wrap.panning{cursor:grabbing;user-select:none}
#hgraph{position:relative}
/* The zoom lives on its own layer. #hstage carries the transform and keeps the
   analytic pixel layout; #hgraph is sized to the *scaled* extent, because a
   transform does not change layout size and the scroll area would otherwise
   not grow when zooming in. */
#hstage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#hstage.zooming{transition:none}
#hstage.jumping{transition:transform .34s cubic-bezier(.2,.7,.2,1)}
/* Level of detail: below ~0.65 the secondary line is unreadable grey noise,
   so it goes away rather than being rendered illegibly. Pure CSS — no redraw. */
#hstage.lod-min .hsm,#hstage.lod-min .hline,#hstage.lod-min .hkind{display:none}
#hstage.lod-min .hnode{padding:4px 8px}
.hzoom{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:44px;
  text-align:right}
@media (prefers-reduced-motion:reduce){#hstage.jumping{transition:none}}
.hnode{position:absolute;box-sizing:border-box;padding:7px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel);cursor:pointer;overflow:hidden}
.hnode:hover{border-color:var(--accent);z-index:1}
.hnode .hnm{font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.hnode .hsm{font-size:10.5px;color:var(--muted);margin-top:2px;max-height:2.6em;overflow:hidden}
.hnode.k-module .hnm{color:var(--mod)} .hnode.k-namespace .hnm{color:var(--ns)} .hnode.k-file .hnm{color:var(--file)}
#hsvg{position:absolute;top:0;left:0;pointer-events:none}
.hedge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.6}
.hedge-type{stroke:var(--accent);stroke-dasharray:4 3;opacity:.75}
.hedge-ext{stroke:var(--ext);stroke-width:2;opacity:.9}
.hmsg{color:var(--muted);font-size:13px;padding:20px;text-align:center}
.htrunc{color:var(--warn);font-size:12.5px;margin-top:8px}
/* Sits directly before `#hdepth`'s button group. "1"/"2"/"3"/"∞" alone
   read as a slider or a zoom control — reported exactly that way after
   watching someone use the page for the first time — because every other
   number on this toolbar (`#hzoomlabel`) *is* a percentage. Direction and
   view-switcher groups need no such label; their own button text
   ("← In", "Out →", "Modules") already says what they do. */
.hctl-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);align-self:center}
.hview-toggle{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.hview-toggle button{border:none;border-radius:0;padding:4px 10px;font-size:12.5px}
.hview-toggle button+button{border-left:1px solid var(--line)}
.hview-toggle button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* Marks a panel/mode that only does anything when a soft-dependency plugin
   (or, for Tools, a project-level manifest file) is present -- same signal
   `--ext` already carries for "connects outside this map" in the Hierarchy
   graphs, reused here for "depends on something outside this plugin". The
   badge is the primary cue (readable even without color); the tint is a
   second one for a quick scan of the tab bar. */
.hview-toggle button.plugin-gated{color:var(--ext)}
.hview-toggle button.plugin-gated::after{content:"\1F50C";font-size:9.5px;margin-left:3px;opacity:.85}
.hview-toggle button.plugin-gated.active{background:var(--ext);color:var(--bg);font-weight:600}
.hnode.t-class .hnm{color:var(--mod)}
.hnode.t-alias .hnm{color:var(--ns)}
.hnode .hkind{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:1px}
/* --- Stats grid + module-scope symbols in the detail pane --------------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;

.stat span{font-size:10.5px;color:var(--muted)}
.sec .sub{text-transform:none;letter-spacing:0;font-weight:400;font-size:10.5px}
.lst.syms li{padding:4px 0;color:var(--ink)}
.sdet{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.bd.sk-table{color:var(--mod);border-color:var(--mod)}
.bd.sk-constant{color:var(--file);border-color:var(--file)}
.bd.sk-binding{color:var(--ns)}
#findings tbody tr[data-node]{cursor:pointer}

/* --- Quicks ------------------------------------------------------------- */
.qk-wrap{padding:18px 24px;max-width:1100px}
.qk-col{margin-bottom:22px}

  margin-bottom:9px}
.qk{border:1px solid var(--line);border-left-width:3px;border-radius:8px;background:var(--panel);

.qk.good{border-left-color:var(--ok,#3f9142)}
.qk.bad{border-left-color:var(--error)}
.qk-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qk-line{font-size:14px;font-weight:600;color:var(--ink)}
.qk-val{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
/* The reason a verdict is allowed to be a sentence at all — see quicks.lua's
   header. Quieter than the sentence, never hidden behind a disclosure. */
.qk-basis{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.qk-acts{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap}
.qk-acts button{font-size:11.5px;padding:3px 9px}
.qk-none{color:var(--muted);font-size:13px;padding:6px 0}
/* --- Compare marks ------------------------------------------------------ */
/* Sits beside `.sigi` rather than replacing its click: that click already
   pins the annotation popup open, which is what makes a long `@example`
   readable, and taking it over would trade one affordance for another. */
.marki{display:inline-block;margin-left:3px;padding:0 4px;border-radius:4px;cursor:pointer;
  font-size:10.5px;line-height:15px;color:var(--muted);border:1px solid var(--line);
  opacity:.45;transition:opacity .12s,color .12s,background .12s;user-select:none}
.marki:hover,.marki:focus{opacity:1;color:var(--accent);border-color:var(--accent);outline:none}
li:hover>.marki,tr:hover .marki{opacity:.8}
.marki.on{opacity:1;color:var(--bg);background:var(--accent);border-color:var(--accent)}
.markbar{white-space:nowrap}
.markbar.has{color:var(--accent);border-color:var(--accent);font-weight:600}
/* --- Compare tab -------------------------------------------------------- */
#cmpbody{padding:14px 24px}
.cmp-cols{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.cmp-cols .cmp-card{flex:0 0 340px}
.cmp-stack .cmp-card{margin-bottom:12px}
.cmp-card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 14px}
.cmp-card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  margin-bottom:6px}
.cmp-where{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.cmp-drop{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 3px}
.cmp-drop:hover{color:var(--error)}
.cmptable{width:100%;border-collapse:collapse;font-size:12.5px}
.cmptable th,.cmptable td{border:1px solid var(--line);padding:6px 9px;text-align:left;
  vertical-align:top}
.cmptable thead th{background:var(--panel);position:sticky;top:0;font-size:11.5px}
.cmptable tbody th{background:var(--panel);font-weight:600;color:var(--muted);
  font-size:11.5px;white-space:nowrap}
/* The point of the matrix: a row where every marked object agrees is not what
   the reader came for, so the ones that differ are the ones that are lit. */
.cmptable tr.differs td{background:var(--accent-soft)}
.cmptable tr.differs th{color:var(--ink)}
.cmp-scroll{overflow-x:auto}

/* --- Function rows in the tree ------------------------------------------ */
.row.k-fn .nm{color:var(--fn)}
.row.fnhead .nm{color:var(--muted);font-style:italic}
.fnkids.hide{display:none}

/* --- Graph: edge kinds, arrowheads, legend ------------------------------ */
.hedge-dep{stroke:var(--dep);opacity:.8}
.hedge-dep.deferred{stroke-dasharray:2 4;opacity:.55}
.hedge-dep.external{stroke-dasharray:6 3;opacity:.5}
.hnode.k-external{border-style:dashed;background:none}
.hnode.k-external .hnm{color:var(--muted)}
.hnode.k-external.linked{border-style:solid;border-color:var(--accent)}
.hnode.k-external.linked .hnm{color:var(--accent)}
.hlegend .sw.dep.external{border-top-style:dashed}
#hext.active button{background:var(--accent-soft);color:var(--accent);font-weight:600}
.hedge-call{stroke:var(--call);opacity:.8}
.hedge-call.weak{stroke-dasharray:3 4;opacity:.5}
/* An invisible, much wider companion path per edge. A 1.5px line is a 1.5px
   hover target, which is not a target — the weighted Module Calls edges made
   that obvious, since the thing worth reading (how many calls, which way) was
   hardest to point at on the thinnest edges. `stroke:transparent` rather than
   `opacity:0`: an `opacity:0` element still paints nothing *and* still takes
   pointer events, but reads to a future editor as "hidden, delete me".
   `pointer-events:stroke` is not optional here — #hsvg itself is
   `pointer-events:none` (so the HTML boxes stacked on top of the SVG stay
   clickable through it), and every path inside inherits that unless it
   opts back in. Missed the first time, and invisible to any test that
   fires the handler directly instead of a real hit-tested mouse event:
   `element.dispatchEvent(new MouseEvent(...))` runs the listener
   regardless of `pointer-events`, since that property only gates the
   browser's own hit-testing for real input, not a manually dispatched
   event. `document.elementFromPoint` at a hedge-hit's own screen
   coordinates returned the background `<div>` underneath, never the SVG
   at all, until this line existed. `stroke` rather than `auto`: this
   shape is `fill:none`, so only the stroked band should ever be
   clickable — `auto` happens to behave the same way here, `stroke` says
   so without depending on that being true. */
.hedge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:default;pointer-events:stroke}
/* Edge readout. `position:fixed` for exactly the reason `.sigpop` is: the
   graph lives in a pannable, zoomable stage, and an absolutely-positioned
   card would ride along with that transform instead of staying by the
   cursor. `pointer-events:none` so it can never sit between the cursor and
   the edge it describes and flicker the hover off. */
.hedge-tip{position:fixed;z-index:60;display:none;pointer-events:none;
  background:var(--bg);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);padding:6px 9px;font-size:11.5px;
  max-width:300px;line-height:1.5}
.hedge-tip.on{display:block}
.hedge-tip .et-row{white-space:nowrap;font-family:var(--mono);color:var(--ink)}
.hedge-tip .et-n{font-weight:650;color:var(--call)}
/* The reverse direction, when the pair calls both ways. Muted because it is
   context for the edge under the cursor, not the edge itself. */
.hedge-tip .et-back{color:var(--muted)}
.hedge-tip .et-back .et-n{color:var(--muted)}
#hsvg marker path{stroke:none}
#m-tree path{fill:var(--muted)}
#m-type path{fill:var(--accent)}
#m-ext path{fill:var(--ext)}
#m-dep path{fill:var(--dep)}
#m-call path{fill:var(--call)}
.hlegend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0 0;
  font-size:11.5px;color:var(--muted)}
.hlegend .lg{display:inline-flex;align-items:center;gap:5px}
.hlegend .sw{width:20px;height:0;border-top:2px solid var(--muted)}
.hlegend .sw.type{border-top-style:dashed;border-top-color:var(--accent)}
.hlegend .sw.ext{border-top-color:var(--ext);border-top-width:3px}
.hlegend .sw.dep{border-top-color:var(--dep)}
.hlegend .sw.dep.deferred{border-top-style:dotted}
.hlegend .sw.call{border-top-color:var(--call)}
.hlegend .sw.call.weak{border-top-style:dashed}
.hlegend .bx{width:11px;height:11px;border-radius:3px;border:1px solid currentColor}
.hnode.k-fn .hnm{color:var(--fn)}
.hnode.center{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.hnode .hline{font-size:9.5px;color:var(--muted);margin-top:1px;font-family:var(--mono)}

/* --- Graph: movement ---------------------------------------------------
   Boxes keep their identity across redraws (see reconcile() in the JS), so a
   re-center animates the boxes that survive from their old position to their
   new one instead of the whole diagram cutting. left/top are transitioned
   rather than transform, because positions are already absolute pixels
   computed from the IR — a transform would need a second coordinate system
   for no gain. */
.hnode{transition:left .34s cubic-bezier(.2,.7,.2,1),top .34s cubic-bezier(.2,.7,.2,1),
  opacity .22s ease,border-color .15s ease}
.hnode.entering{opacity:0;transform:scale(.94)}
.hnode.leaving{opacity:0;pointer-events:none}
#hsvg{transition:opacity .18s ease}
#hsvg.settling{opacity:0}
.hnode.pulse{animation:hpulse .7s ease-out}
@keyframes hpulse{
  0%{box-shadow:0 0 0 0 var(--accent)}
  100%{box-shadow:0 0 0 12px transparent}
}
/* Hover focus: dim everything that is not a direct neighbour. Class-driven so
   it costs no layout recomputation on a graph that can hold 90 boxes. */
#hgraph.focusing .hnode{opacity:.22}
#hgraph.focusing .hnode.near{opacity:1}
#hgraph.focusing .hedge{opacity:.08}
#hgraph.focusing .hedge.near{opacity:1;stroke-width:2}
/* Persistent per-box dim (":DocMap"'s "hide/dim a module" — see the JS
   section above this one for the state it reads). Same opacity mechanism as
   hover-focus, deliberately independent of it: a dimmed box has to stay
   dimmed even when hover-focus would otherwise light it up as a ".near"
   neighbour, which is why both overrides below repeat the "#hgraph.focusing"
   prefix — equal specificity to the rules above, decided by source order. */
.hnode.hidden{opacity:.08;pointer-events:none}
#hgraph.focusing .hnode.hidden{opacity:.08}
#hgraph.focusing .hnode.hidden.near{opacity:.08}
.hedge{transition:opacity .15s ease}
@media (prefers-reduced-motion:reduce){
  .hnode,#hsvg,.hedge{transition:none}
  .hnode.pulse{animation:none}
}

/* --- Context menu ------------------------------------------------------- */
#ctx{position:fixed;z-index:50;min-width:210px;padding:5px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel);box-shadow:0 8px 28px rgba(0,0,0,.18);display:none}
#ctx.open{display:block}
#ctx .ci{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;
  font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
#ctx .ci:hover,#ctx .ci.hi{background:var(--accent-soft);color:var(--accent)}
#ctx .ci.disabled{color:var(--muted);cursor:default;opacity:.6}
#ctx .ci.disabled:hover{background:none;color:var(--muted)}
#ctx .ci .hint{margin-left:auto;font-size:10.5px;color:var(--muted)}
#ctx .sep{height:1px;background:var(--line);margin:4px 6px}

` ([keymaps](../BINDINGS.md#keymaps))"}],"name":"Next / previous","summary":"Jumps to the next or previous image link in the buffer and shows it; both directions wrap around.","tab":false},{"line":38,"meta":[{"key":"Module","value":"`images/browse.lua` (`M.open`, `M.scan`, `M.roots`, `M.snacks_available`)"},{"key":"Usercmds","value":"`:Image pickers [cfile|cwd|path] [dir]` ([usercmds](../BINDINGS.md#user-commands))"},{"key":"Config","value":"`opts.display.browse_exclude` (directories skipped besides the always-excluded `.git`, default `{\".deps\", \"node_modules\"}`)"}],"name":"Directory pickers","summary":"Browses images under `cfile`, `cwd`, or an explicit path, with a live thumbnail preview when snacks.picker is installed (a custom preview function, not snacks.image's Kitty-only one), falling back to a plain list without preview otherwise. `<Tab>` multi-selects in the snacks picker; confirming a multi-selection shows the chosen images as a gallery instead of one image.","tab":false},{"line":53,"meta":[{"key":"Module","value":"`images/compare.lua` (`M.open`)"},{"key":"Usercmds","value":"`:Image compare [cfile|cwd|path] [dir]` ([usercmds](../BINDINGS.md#user-commands))"}],"name":"Compare","summary":"Picks two images from a directory scan and shows them side by side. With ImageMagick installed, they're scaled proportionally to their true relative size, so a small icon and a large photo don't render at the same size; without it, both are shown side by side at equal size.","tab":false},{"line":63,"meta":[{"key":"Module","value":"`images/init.lua` (`M.clear`)"},{"key":"Usercmds","value":"`:Image clear` ([usercmds](../BINDINGS.md#user-commands))"}],"name":"Clear","summary":"Removes any displayed image, releases a pin, and closes a `:Image zen` window if one is open.","tab":false}],"intro":"Finding, stepping through and comparing images, whether the source is a single buffer or a whole directory tree.","path":"docs/FEATURES/BROWSING.md","theme":"BROWSING"},{"entries":[{"body":"### With a filename argument or prompt\n\n`:Image paste {name}` sanitizes and uses `{name}` directly, skipping any\nprompt — a name on the command line always takes priority over\n`opts.paste.ask_filename`. With `ask_filename = true` and no argument, a\nprompt asks for a name prefilled with what the template would have\nproduced; any path component typed in is dropped and the extension is\nalways forced to `.png`. Cancelling this prompt writes nothing at all,\nsince the clipboard hasn't been read yet — unlike the alt-text prompt\nbelow, where the file is already on disk by the time you could cancel.\n\n`opts.paste.ask_alt_text = true` prompts for alt text before inserting the\nlink, producing `![alt](path)` instead of `![](path)`. Cancelling here\nstill inserts the plain link — a lost link would be the worse surprise\nonce the file already exists on disk.","line":6,"meta":[{"key":"Module","value":"`images/paste.lua` (`M.run`, `find_existing_resource_dir`, `sanitize_filename`)"},{"key":"Usercmds","value":"`:Image paste [name]` ([usercmds](../BINDINGS.md#user-commands))"},{"key":"Keymaps","value":"`<leader>iv` ([keymaps](../BINDINGS.md#keymaps))"},{"key":"Config","value":"`opts.paste.dir` (default `\"assets\"`), `opts.paste.existing_dir_names` (default `{\"Resources\", \"Ressourcen\"}`), `opts.paste.name_template`, `opts.paste.link_template`"}],"name":"Paste from clipboard","summary":"Saves the clipboard image next to the document and inserts a markdown link at the cursor. Writes to `assets/<document>-<timestamp>.png` by default — unless a `Resources`/`Ressourcen` folder already exists next to the document, in which case that one is reused instead of creating `assets` alongside it. No image on the clipboard leaves no folder behind either way.","tab":true},{"line":40,"meta":[{"key":"Module","value":"`images/screenshot.lua` (`M.capture`, `M.available`), `images/paste.lua` (`M.screenshot`)"},{"key":"Usercmds","value":"`:Image screenshot` ([usercmds](../BINDINGS.md#user-commands))"},{"key":"Keymaps","value":"`<leader>is` ([keymaps](../BINDINGS.md#keymaps))"},{"key":"Config","value":"`opts.display.screenshot.windows_timeout_ms` (default `60000`), `opts.display.screenshot.windows_poll_interval_ms` (default `600`)"}],"name":"Screenshot","summary":"Takes a screenshot interactively and continues exactly like paste, skipping the \"have something on the clipboard already\" step. Uses `screencapture -i` on macOS, `grim`+`slurp` or `maim -s` on Linux, and the Windows Snipping Tool (`ms-screenclip:`) on Windows.","tab":false},{"line":60,"meta":[{"key":"Module","value":"`images/paste.lua` (`M.replace`)"},{"key":"Usercmds","value":"`:Image replace [path]` ([usercmds](../BINDINGS.md#user-commands))"}],"name":"Replace","summary":"Overwrites an existing image file with the current clipboard image, keeping the markdown link that already points at it unchanged.","tab":false},{"line":68,"meta":[{"key":"Module","value":"`images/convert.lua` (`M.to_pdf`)"},{"key":"Usercmds","value":"`:Image export [path]` ([usercmds](../BINDINGS.md#user-commands))"}],"name":"Export to PDF","summary":"Exports an image as a PDF next to the source file. Routes through `pdfport.nvim`'s `create()` API when that plugin is installed (asynchronous, lossless via `img2pdf` if available, else `magick`); otherwise requires ImageMagick directly and runs synchronously.","tab":false},{"body":"### Why boxes are padded generously\n\nSelection happens entirely in terminal cells — there is no pixel-precise\nmouse input available in a terminal at all, so each marked box gets a\nconfigurable safety margin (default one cell) added around it before\nburning in. Over-redacting is the safe failure mode; under-redacting is\nnot. See `docs/ROADMAP/REDACT.md` for the fuller design rationale.","line":78,"meta":[{"key":"Module","value":"`images/redact.lua` (`M.open`, `confirm_box`, `undo_box`, `write_redacted`), `images/convert.lua` (`M.redact`)"},{"key":"Usercmds","value":"`:Image redact [path]` ([usercmds](../BINDINGS.md#user-commands))"},{"key":"Config","value":"`opts.display.redact.padding_cells` (default `1`)"}],"name":"Redact","summary":"Opens a full-screen censor mode over an image: enter Visual mode (`v`/`<C-v>`), move to the opposite corner of the area to black out, `<CR>` marks the box — repeat for as many boxes as needed, `u` undoes the last one, `w` burns every marked box in via ImageMagick and writes a new file (`photo.png` → `photo.redacted.png`). The source file is never touched.","tab":true},{"line":101,"meta":[{"key":"Module","value":"`images/orphans.lua` (`M.find`), `images/init.lua` (`M.orphans`)"},{"key":"Usercmds","value":"`:Image orphans` ([usercmds](../BINDINGS.md#user-commands))"}],"name":"Orphan cleanup","summary":"Scans `paste.dir` for image files that no link in the buffer points to anymore, and offers to delete them one at a time.","tab":false},{"line":110,"meta":[{"key":"Module","value":"`images/info.lua` (`M.collect`, `M.human_size`, `M.lines`)"},{"key":"Usercmds","value":"`:Image info [path]` ([usercmds](../BINDINGS.md#user-commands))"}],"name":"Image metadata","summary":"Reports format, pixel dimensions and file size for an image. Dimensions require ImageMagick; without it, only format and size are shown.","tab":false}],"intro":"Getting an image onto disk, linked from the current document, or turned into something else.","path":"docs/FEATURES/CAPTURE.md","theme":"CAPTURE"},{"entries":[{"line":6,"meta":[{"key":"Module","value":"`images/init.lua` (`M.show`), `images/resolve.lua` (`M.under_cursor`, `M.to_path`), `images/terminal.lua` (`M.draw`)"},{"key":"Usercmds","value":"`:Image`, `:Image show [path]` ([usercmds](../BINDINGS.md#user-commands))"},{"key":"Keymaps","value":"`<leader>im` ([keymaps](../BINDINGS.md#keymaps))"}],"name":"Show the image under the cursor","summary":"Resolves the markdown/plain-text link under the cursor (or an explicit path/URL) and draws it via the iTerm2 OSC 1337 protocol.","tab":false},{"line":16,"meta":[{"key":"Module","value":"`images/init.lua` (`M.hover`), `images/hover_float.lua`"},{"key":"Config","value":"`opts.display.hover_mode` (default `\"overlay\"`), `opts.display.clear_events`"}],"name":"Hover overlay / hover float","summary":"Shows the image whenever the cursor sits on a link, without an explicit command. `display.hover_mode = \"overlay\"` (default) draws straight over the text and clears on the next cursor move; `\"float\"` shows the same image in a small, unfocused floating window under the cursor instead — same lifecycle, same draw call, different container. Only the single-image path is affected; the gallery keeps its own layout either way.","tab":false},{"line":29,"meta":[{"key":"Module","value":"`images/init.lua` (`M.pin`)"},{"key":"Usercmds","value":"`:Image pin` ([usercmds](../BINDINGS.md#user-commands))"}],"name":"Pin","summary":"Keeps the currently shown image on screen instead of clearing it on the next `clear_events` trigger (cursor move, insert mode, buffer leave, window scroll).","tab":false},{"line":38,"meta":[{"key":"Module","value":"`images/terminal.lua` (`M.capability`, `M.reset_capability`), `images/guard.lua` (`M.check`, `M.reset`)"},{"key":"Usercmds","value":"`:Image check` ([usercmds](../BINDINGS.md#user-commands))"},{"key":"Config","value":"`opts.display.assume_supported` (default `false`, silences the warning without changing draw behavior)"}],"name":"Terminal capability detection","summary":"Before the first draw, the terminal is checked against the small set that implements OSC 1337 (WezTerm, iTerm2, Konsole), detected from environment variables. An unknown terminal produces a warning once per session and still attempts the draw — there is no capability query for this protocol, so this is a heuristic and a false negative must not break a working setup.","tab":false},{"line":53,"meta":[{"key":"Module","value":"`images/ascii.lua` (`M.open`, `M.available`)"},{"key":"Config","value":"`opts.display.ascii_fallback.enabled` (default `true`)"}],"name":"ASCII / block-character fallback","summary":"When the terminal check fails, `:Image show`/hover draw a colored block-character (`█`) rendering instead of a silently ineffective OSC 1337 sequence — a true-color foreground sampled per terminal cell straight from the image, the same technique `chafa`/`viu` use, rather than a brightness character ramp. Requires ImageMagick to read pixel data. Only the single-image path gets this fallback.","tab":false},{"line":65,"meta":[{"key":"Module","value":"`images/remote.lua` (`M.is_remote`, `M.fetch`)"},{"key":"Config","value":"`opts.display.remote.enabled` (default `false`), `opts.display.remote.timeout_ms`, `opts.display.remote.max_bytes`"}],"name":"Remote image display","summary":"`:Image show <url>` and hovering a markdown link pointing at `http(s)://…` download and cache the image before drawing. Off by default — a document merely being opened should not silently trigger a network request, the same posture email clients take toward remote images. Downloads are cached by URL with a size and time limit. Gallery, compare, pickers and zen do not resolve remote images yet — only the single-image path does.","tab":false},{"line":79,"meta":[{"key":"Module","value":"`images/zen.lua` (`M.open`, `M.close`, `M.dimensions`)"},{"key":"Usercmds","value":"`:Image zen [path]` ([usercmds](../BINDINGS.md#user-commands))"},{"key":"Config","value":"`opts.display.zen.width`/`height` (fractions of the editor, default `0.9`/`0.85`)"}],"name":"Zen: full-screen single image","summary":"Shows one image full-screen in a real, editable window rather than an overlay — survives a snacks hover popup opened alongside it. Redraws on `WinResized`/`VimResized` to follow the window's size, clears on `WinClosed`.","tab":false},{"body":"### Why the timing matters\n\n`nvim_ui_send` writes to the terminal immediately, while Neovim only\nrepaints once control returns to the main loop. Open a window and draw\ninto it in the same tick and Neovim paints that window's cells over the\nimage right after it was sent — the popup is visible, the image is gone\nor half gone. `images.terminal.draw` flushes anything already pending\nbefore sending its own payload, and every caller that opens a window\nfirst (zen, hover float, redact) defers its draw by one tick\n(`opts.defer = true`) so the flush actually covers the repaint the window\nitself causes. `show`/hover need neither, since they draw over existing\ntext without creating a window. Every consumer of `images.draw()` gets\nthis handled once, in one place, instead of re-solving the same timing\nproblem per caller.","line":91,"meta":[{"key":"Module","value":"`images/anchor.lua` (`M.draw`, `M.resolve_window`), `images/scale.lua` (`M.POSITIONS`, `M.anchor_box`)"},{"key":"Usercmds","value":"`:Image draw <position> [path]` ([usercmds](../BINDINGS.md#user-commands))"}],"name":"Positioned draw primitive","summary":"Draws an image at a named anchor (\"full\" or one of nine corner/edge/center anchors) inside a target window — the reliable, single-shot primitive that zen, the hover float, redact and the picker preview all delegate to internally, and that other plugins can call directly.","tab":true},{"line":119,"meta":[{"key":"Module","value":"`images/init.lua` (`M.statusline`)"}],"name":"Status line segment","summary":"Reports whether an image is currently shown, for embedding in a statusline plugin like lualine.","tab":false}],"intro":"Everything involved in actually drawing an image, or deciding it can't be drawn and falling back gracefully.","path":"docs/FEATURES/DISPLAY.md","theme":"DISPLAY"},{"entries":[{"line":6,"meta":[{"key":"Module","value":"`images/resolve.lua` (`M.to_path`), `images/browse.lua` (`draw_in_window`)"}],"name":"markdown.nvim link resolution","summary":"Link targets are resolved through `markdown.nvim` when present, falling back to an internal resolver otherwise — a soft dependency, never required. The relationship runs the other way too: `markdown.nvim`'s `mi` prefers images.nvim as its in-Neovim preview provider over Kitty-only plugins, and its `:Markdown links show` reuses `images.browse.draw_in_window()` (a thin wrapper around `images.draw()`) for a live per-item image preview when snacks.picker is also installed.","tab":false},{"line":19,"meta":[{"key":"Config","value":"`opts.command` (default `\"Image\"`)"}],"name":"lib.nvim command grammar and picker","summary":"`lib.nvim` provides the `:Image` command grammar via `usercmd.composer` (dispatch and `<Tab>` completion come from the same spec that generates `docs/BINDINGS.md`), the picker used by `:Image list`, and the `kit.compare` component behind `:Image compare`. Without lib.nvim's UI kit, pickers fall back to `vim.ui.select`.","tab":false},{"line":29,"meta":[],"name":"snacks.picker previews","summary":"A soft dependency for `:Image pickers`: with snacks.nvim installed, browsing shows a live image thumbnail per entry using a custom preview function; without it, `:Image pickers` falls back to a plain list with no preview.","tab":false},{"line":36,"meta":[],"name":"filetree.nvim and open.nvim","summary":"`filetree.nvim` uses images.nvim as the first backend of its own preview feature, and `open.nvim` routes `:Open image` here.","tab":false},{"line":41,"meta":[],"name":"pdfport.nvim for export","summary":"`:Image export` routes through `pdfport.nvim`'s `create()` API when that plugin is installed (asynchronous, lossless via `img2pdf` if available, otherwise `magick` through pdfport's own fallback chain). Soft dependency, `pcall`'d — without pdfport.nvim, the previous synchronous ImageMagick-only export path is unchanged.","tab":false},{"line":49,"meta":[{"key":"Module","value":"`lua/images/health.lua` (`check_deps`, `check_lib_deps`)"},{"key":"Usercmds","value":"`:Lib deps show images.nvim`, `:Lib deps install images.nvim` (provided by lib.nvim, not this plugin)"},{"key":"Config","value":"`opts.deps_popup` (default `true`), `vim.g.lib_nvim_deps_disable_first_run`, `vim.g.lib_nvim_deps_disabled_plugins`"}],"name":"lib.nvim.deps: missing-tool reporting","summary":"ImageMagick and `chafa` are declared as optional dependencies, with the reasoning per tool, in `docs/install.json`, parsed by lib.nvim's `deps` module. The first time `setup()` runs after installing images.nvim, a popup shows what's missing and why, once ever.","tab":false},{"line":63,"meta":[{"key":"Module","value":"`images/health.lua` (`M.check`)"}],"name":"Health check","summary":"`:checkhealth images` verifies terminal capability, clipboard tool, screenshot tool availability, ImageMagick, and both this plugin's and lib.nvim's declared dependencies in one report.","tab":false}],"intro":"How images.nvim connects to its sibling plugins and to optional external tools.","path":"docs/FEATURES/INTEGRATIONS.md","theme":"INTEGRATIONS"}],"folder":"docs/FEATURES","intro":"# images.nvim features\n\nimages.nvim shows images inside Neovim's terminal using the iTerm2 (OSC\n1337) protocol instead of the Kitty graphics protocol every other image\nplugin relies on — the deliberate choice that makes it work on WezTerm and\nnative Windows, where Kitty-only plugins draw nothing. Features below are\ngrouped by what they're for, not by source file:\n\n- **DISPLAY.md** — actually putting pixels on screen: the single-image\n  path, hover, the ASCII fallback, remote images, the zen window, terminal\n  capability detection.\n- **CAPTURE.md** — getting images onto disk and linked from a document:\n  paste, screenshot, replace, export, redact.\n- **BROWSING.md** — finding and comparing images across a buffer or a\n  directory tree: list, gallery, next/prev, pickers, compare, orphans.\n- **INTEGRATIONS.md** — how images.nvim fits with lib.nvim, markdown.nvim,\n  snacks.nvim, filetree.nvim, open.nvim, and pdfport.nvim."},"meta":{"branch":"main","counts":{"file":25,"module":2,"namespace":2},"godbolt":false,"out_depth":2,"schema":2,"source":"lua","title":"images.nvim","types_dir":"  nicht `buf` sein. Termcodes auf beiden Seiten, weil\n  -- `lhs` je nach registrierendem Plugin als \"<2-LeftMouse>\" oder bereits als\n  -- rohe Tastenfolge zurückkommt.\n  local want = vim.api.nvim_replace_termcodes(DOUBLE_CLICK, true, true, true)\n  for _, existing in ipairs(vim.api.nvim_buf_get_keymap(buf, \"n\")) do\n    if vim.api.nvim_replace_termcodes(existing.lhs or \"\", true, true, true) == want then return end\n  end\n\n  vim.keymap.set(\"n\", DOUBLE_CLICK, function()\n    if not require(\"images\").hover() then\n      -- Kein Bildlink getroffen: Doppelklick soll sich normal verhalten\n      -- (Wortauswahl), statt stumm geschluckt zu werden.\n      vim.cmd(\"normal! viw\")\n    end\n  end, { buffer = buf, desc = \"images: Bild bei Doppelklick auf Link\" })\nend","snippet_omitted":0,"summary":"Doppelklick auf einen Markdown-Link zeigt das Bild.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":11,"documented":true,"generic":[],"internal":false,"line":100,"line_end":125,"local_refs":1,"name":"common_prefix","nodiscard":false,"overload":[],"params":[{"desc":"","name":"keys","optional":false,"type":"ImagesNvim.KeymapConfig"}],"returns":[{"desc":"","type":"string|nil"}],"see":[],"shape":"61cf0526-304ae183","shape_size":286,"signature":"common_prefix(keys)","snippet":"local function common_prefix(keys)\n  local lhs_list = {}\n  for _, action in ipairs(ACTIONS) do\n    local lhs = keys[action.option]\n    if type(lhs) == \"string\" and lhs ~= \"\" then lhs_list[#lhs_list + 1] = lhs end\n  end\n  if #lhs_list < 2 then return nil end\n\n  local prefix = lhs_list[1]\n  for i = 2, #lhs_list do\n    local other = lhs_list[i]\n    local n = math.min(#prefix, #other)\n    while n > 0 and prefix:sub(1, n) ~= other:sub(1, n) do\n      n = n - 1\n    end\n    prefix = prefix:sub(1, n)\n    if prefix == \"\" then return nil end\n  end\n  -- Ein Präfix, das bereits eine vollständige Bindung ist, wäre als\n  -- Gruppenname irreführend — which-key würde dann sowohl eine Aktion als\n  -- auch eine Gruppe unter derselben Taste zeigen.\n  for _, lhs in ipairs(lhs_list) do\n    if lhs == prefix then return nil end\n  end\n  return prefix\nend","snippet_omitted":0,"summary":"Längstes gemeinsames Präfix der konfigurierten Bindungen, z.B.","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":9,"documented":true,"generic":[],"internal":false,"line":130,"line_end":152,"local_refs":0,"name":"M.register","nodiscard":false,"overload":[],"params":[{"desc":"","name":"cfg","optional":false,"type":"ImagesNvim.Config"}],"returns":[{"desc":"","type":"nil"}],"see":[],"shape":"77811e59-2c864e2d","shape_size":292,"signature":"M.register(cfg)","snippet":"function M.register(cfg)\n  local keys = cfg.keymaps or {}\n\n  local prefix = common_prefix(keys)\n  if prefix then require(\"images.bindings.which_key\").setup(prefix) end\n\n  vim.api.nvim_create_autocmd(\"FileType\", {\n    group = vim.api.nvim_create_augroup(\"images.keymaps\", { clear = true }),\n    pattern = keys.filetypes or { \"markdown\" },\n    desc = \"images: buffer-lokale Keymaps setzen\",\n    ---@param ev { buf: integer }\n    callback = function(ev)\n      if not vim.api.nvim_buf_is_valid(ev.buf) then return end\n      for _, action in ipairs(ACTIONS) do\n        local lhs = keys[action.option]\n        if type(lhs) == \"string\" and lhs ~= \"\" then\n          vim.keymap.set(\"n\", lhs, action.run, { buffer = ev.buf, desc = action.desc })\n        end\n      end\n      if keys.double_click then map_double_click(ev.buf) end\n    end,\n  })\nend","snippet_omitted":0,"summary":"Keymaps registrieren.","test":[],"tested":true,"todo":[]}],"id":"lua/images/bindings/keymaps.lua","kind":"file","module":"images.bindings.keymaps","name":"keymaps.lua","parent":"lua/images/bindings","path":"lua/images/bindings/keymaps.lua","plugins":[],"required_by":["lua/images"],"requires":["lua/images","lua/images/bindings/which_key.lua"],"requires_external":[],"requires ges.remote"},{"alias":"images","deferred":true,"line":57,"module":"images"},{"alias":"images","deferred":true,"line":71,"module":"images"},{"alias":"images","deferred":true,"line":86,"module":"images"},{"alias":"images","deferred":true,"line":103,"module":"images"},{"deferred":true,"line":117,"module":"images"},{"deferred":true,"line":125,"module":"images"},{"deferred":true,"line":134,"module":"images"},{"deferred":true,"line":143,"module":"images"},{"deferred":true,"line":151,"module":"images"},{"deferred":true,"line":160,"module":"images"},{"deferred":true,"line":169,"module":"images"},{"deferred":true,"line":178,"module":"images"},{"deferred":true,"line":190,"module":"images"},{"deferred":true,"line":198,"module":"images"},{"deferred":true,"line":210,"module":"images"},{"deferred":true,"line":219,"module":"images"},{"deferred":true,"line":226,"module":"images.scale"},{"deferred":true,"line":231,"module":"images"},{"deferred":true,"line":239,"module":"images"},{"deferred":true,"line":247,"module":"images"},{"deferred":true,"line":255,"module":"images"}],"source":"lua/images/bindings/usrcmds.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":2,"lines":262,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Ein Verb mit Routen statt einer Familie flacher Commands: `<Tab>`-Completion, typisierte Argumente und die Doku-Generierung kommen dadurch aus derselben Spec…","symbols":[],"types":[]},{"body":"which-key is a **soft** dependency: if it is not installed this is a no-op. When present, registers a single group label so images.nvim's `<leader>i*` keymaps (show, gallery, next, prev, paste) show up under a named \"images\" group instead of a bare prefix. Individual key descriptions already come from each mapping's `desc`, so nothing else needs registering. Supports both the which-key v3 (`add`) and v2 (`register`) APIs.\n\nSame pattern as buffer-ctx.nvim's `bindings/which_key.lua` — copied\nrather than reinvented.","calls_external":[],"calls_raw":[{"callee":"pcall","from_fn":"M.setup","line":20},{"callee":"type","from_fn":"M.setup","line":21},{"callee":"type","from_fn":"M.setup","line":22},{"callee":"wk.add","from_fn":"M.setup","line":24},{"callee":"type","from_fn":"M.setup","line":26},{"callee":"wk.register","from_fn":"M.setup","line":28},{"callee":"pcall","from_fn":"M.available","line":37},{"callee":"type","from_fn":"M.available","line":38}],"children":[],"depth":3,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":5,"documented":true,"generic":[],"internal":false,"line":19,"line_end":32,"local_refs":0,"name":"M.setup","nodiscard":false,"overload":[],"params":[{"desc":"e.g. \"<leader>i\"","name":"prefix","optional":false,"type":"string"}],"returns":[{"desc":"","name":"registered","type":"boolean"}],"see":[],"shape":"4c683f52-371b3548","shape_size":177,"signature":"M.setup(prefix)","snippet":"function M.setup(prefix)\n  local ok, wk = pcall(require, \"which-key\")\n  if not ok or type(wk) ~= \"table\" then return false end\n  if type(wk.add) == \"function\" then\n    -- which-key v3\n    wk.add({ { prefix, group = \"images: view images\" } })\n    return true\n  elseif type(wk.register) == \"function\" then\n    -- which-key v2\n    wk.register({ [prefix] = { name = \"+images: view images\" } }, { mode = \"n\" })\n    return true\n  end\n  return false\nend","snippet_omitted":0,"summary":"Register the group with which-key, if available.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":2,"documented":true,"generic":[],"internal":false,"line":36,"line_end":39,"local_refs":0,"name":"M.available","nodiscard":false,"overload":[],"params":[],"returns":[{"desc":"","type":"boolean"}],"see":[],"shape":"2682791d-5efa8f39","shape_size":49,"signature":"M.available()","snippet":"function M.available()\n  local ok, wk = pcall(require, \"which-key\")\n  return ok and type(wk) == \"table\"\nend","snippet_omitted":0,"summary":"Whether which-key is installed (for :c images.redact` öffnen je ein Fenster und zeichnen an dessen Geometrie, `images.browse`s Picker-Vorschau zeichnet an der Geometrie eines fremden (snacks-)Fensters. Jede Kopie hatte ihre eigene Sorgfaltsstufe: nur zen/hover_float/redact hatten den `vim.schedule`-Fix für ein im selben Tick geöffnetes Fenster (siehe unten), browse nicht, weil sein Zielfenster beim Aufruf schon länger stand. Ab hier gibt es nur noch eine Implementierung, die alle vier Aufrufer teilen.\n\n**Warum `defer` ein expliziter Parameter ist, keine automatische\nErkennung:** `nvim_ui_send` schreibt sofort ans Terminal, Neovims eigener\nRepaint läuft aber erst, wenn die Steuerung in die Hauptschleife\nzurückkehrt — und zwar über alles, was seit dem letzten Rücksprung\nschmutzig wurde. Wer ein Fenster öffnet und im selben Tick hineinzeichnet,\nsendet das Bild, und Neovim malt die (leeren) Zellen dieses gerade erst\ngeöffneten Fensters danach darüber — Fenster da, Bild weg. `images.\nterminal.draw`s eigener Flush (`:redraw`) fängt nur ab, was VOR dem\nSenden bereits anstand, nicht den Repaint, den das Öffnen selbst nach\nsich zieht — dafür muss der Sprung in den nächsten Tick sein\n(`vim.schedule`). Ob ein Fenster \"gerade erst\" geöffnet wurde, lässt sich\nvon hier aus nicht zuverlässig erkennen (kein API-Feld dafür); deshalb\nentscheidet der Aufrufer, der es weiß, statt einer Heuristik, die in\nbeide Richtungen falsch liegen kann.","calls_external":[],"calls_raw":[{"callee":"vim.api.nvim_get_current_win","from_fn":"M.resolve_window","line":41},{"callee":"vim.api.nvim_win_is_valid","from_fn":"M.resolve_window","line":43},{"callee":"vim.api.nvim_buf_is_valid","from_fn":"M.resolve_window","line":45},{"callee":"vim.api.nvim_get_current_win","from_fn":"M.resolve_window","line":46},{"callee":"vim.api.nvim_win_get_buf","from_fn":"M.resolve_window","line":47},{"callee":"ipairs","from_fn":"M.resolve_window","line":48},{"callee":"vim.api.nvim_list_wins","from_fn":"M.resolve_window","line":48},{"callee":"vim.api.nvim_win_get_buf","from_fn":"M.resolve_window","line":49},{"callee":"(\"Kein Fenster zeigt Buffer %d\"):format","from_fn":"M.resolve_window","line":51},{"callee":"(\"Ungültiges Fenster- oder Buffer-Handle: %s\"):format","from_fn":"M.resolve_window","line":54},{"callee":"tostring","from_fn":"M.resolve_window","line":54},{"callee":"vim.api.nvim_win_is_valid","from_fn":"draw_now","line":64},{"callee":"vim.api.nvim_win_get_position","from_fn":"draw_now","line":66},{"callee":"vim.api.nvim_win_get_width","from_fn":"draw_now","line":67},{"callee":"vim.api.nvim_win_get_height","from_fn":"draw_now","line":68},{"callee":"require(\"images.scale\").anchor_box","from_fn":"draw_now","line":70},{"callee":"require","from_fn":"draw_now","line":70},{"callee":"require(\"images.terminal\").clear","from_fn":"draw_now","line":73},{"callee":"require","from_fn":"draw_now","line":73},{"callee":"require(\"images.terminal\").draw","from_fn":"draw_now","line":74},{"callee":"require","from_fn":"draw_now","line":74},{"callee":"M.resolve_window","from_fn":"M.draw","line":92},{"callee":"opts.on_done","from_fn":"M.draw","line":94},{"callee":"vim.schedule","from_fn":"M.draw","line":99},{"callee":"draw_now","from_fn":"M.draw","line":100},{"callee":"opts.on_done","from_fn":"M.draw","line":101},{"callee":"draw_now","from_fn":"M.draw","line":106},{"callee":"opts.on_done","from_fn":"M.draw","line":107}],"children":[],"depth":2,"endpoints":[],"export":"table","functions":[{"async":false,"bug":[],"complexity":8,"documented":true,"generic":[],"internal":false,"line":40,"line_end":55,"local_refs":1,"name":"M.resolve_window","nodiscard":false,"overload":[],"params":[{"desc":"","name":"target","optional":false,"type":"integer|nil"}],"returns":[{"desc":"","name":"winid","type":"integer|nil"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"3d55e423-6465220b","shape_size":218,"signature":"M.resolve_window(target)","snippet":"function M.resolve_window(target)\n  if target == nil or target == 0 then return vim.api.nvim_get_current_win() end\n\n  if vim.api.nvim_win_is_valid(target) then return target end\n\n  if vim.api.nvim_buf_is_valid(target) then\n    local current = vim.api.nvim_get_current_win()\n    if vim.api.nvim_win_get_buf(current) == target then return current end\n    for _, w in ipairs(vim.api.nvim_list_wins()) do\n      if vim.api.nvim_win_get_buf(w) == target then return w end\n    end\n    return nil, (\"Kein Fenster zeigt Buffer %d\"):format(target)\n  end\n\n  return nil, (\"Ungültiges Fenster- oder Buffer-Handle: %s\"):format(tostring(target))\nend","snippet_omitted":0,"summary":"`target` zu einem konkreten, validen Fenster auflösen.","test":[],"tested":true,"todo":[]},{"async":false,"bug":[],"complexity":6,"documented":false,"generic":[],"internal":false,"line":63,"line_end":75,"local_refs":2,"name":"draw_now","nodiscard":false,"overload":[],"params":[{"desc":"bereits als gültig geprüft","name":"winid","optional":false,"type":"integer"},{"desc":"siehe `images.scale.POSITIONS`","name":"position","optional":false,"type":"string"},{"desc":"","name":"file","optional":false,"type":"string"},{"desc":"","name":"scale","optional":false,"type":"number|nil"}],"returns":[{"desc":"","name":"ok","type":"boolean"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"10c71f8f-483c1f4d","shape_size":229,"signature":"draw_now(winid, position, file, scale)","snippet":"local function draw_now(winid, position, file, scale)\n  if not vim.api.nvim_win_is_valid(winid) then return false, \"Fenster nicht mehr gültig\" end\n\n  local pos = vim.api.nvim_win_get_position(winid)\n  local width = vim.api.nvim_win_get_width(winid)\n  local height = vim.api.nvim_win_get_height(winid)\n\n  local cols, rows, col_off, row_off, box_err = require(\"images.scale\").anchor_box(width, height, position, scale)\n  if not (cols and rows and col_off and row_off) then return false, box_err end\n\n  require(\"images.terminal\").clear()\n  return require(\"images.terminal\").draw(file, pos[1] + 1 + row_off, pos[2] + 1 + col_off, cols, rows)\nend","snippet_omitted":0,"summary":"","test":[],"tested":false,"todo":[]},{"async":false,"bug":[],"complexity":7,"documented":true,"generic":[],"internal":false,"line":89,"line_end":109,"local_refs":1,"name":"M.draw","nodiscard":false,"overload":[],"params":[{"desc":"Fenster- oder Buffer-Handle; nil/0 = aktuelles Fenster","name":"target","optional":false,"type":"integer|nil"},{"desc":"siehe `images.scale.POSITIONS`","name":"position","optional":false,"type":"string"},{"desc":"absoluter Pfad","name":"file","optional":false,"type":"string"},{"desc":"","name":"opts","optional":false,"type":"Images.Anchor.Opts|nil"}],"returns":[{"desc":"bei `defer = true`: ob der Aufruf angenommen wurde, nicht ob bereits gezeichnet ist","name":"ok","type":"boolean"},{"desc":"","name":"err","type":"string|nil"}],"see":[],"shape":"6ae266f5-5488f7c4","shape_size":203,"signature":"M.draw(target, position, file, opts)","snippet":"function M.draw(target, position, file, opts)\n  opts = opts or {}\n\n  local winid, werr = M.resolve_window(target)\n  if not winid then\n    if opts.on_done then opts.on_done(false, werr) end\n    return false, werr\n  end\n\n  if opts.defer then\n    vim.schedule(function()\n      local ok, err = draw_now(winid, position, file, opts.scale)\n      if opts.on_done then opts.on_done(ok, err) end\n    end)\n    return true\n  end\n\n  local ok, err = draw_now(winid, position, file, opts.scale)\n  if opts.on_done then opts.on_done(ok, err) end\n  return ok, err\nend","snippet_omitted":0,"summary":"Ein Bild in `target` an `position` zeichnen.","test":[],"tested":true,"todo":[]}],"id":"lua/images/anchor.lua","kind":"file","module":"images.anchor","name":"anchor.lua","parent":"lua/images","path":"lua/images/anchor.lua","plugins":[],"required_by":["lua/images","lua/images/browse.lua","lua/images/hover_float.lua","lua/images/redact.lua","lua/images/zen.lua"],"requires":["lua/images/scale.lua","lua/images/terminal.lua"],"requires_external":[],"requires_raw":[{"deferred":true,"line":70,"module":"images.scale"},{"deferred":true,"line":73,"module":"images.terminal"},{"deferred":true,"line":74,"module":"images.terminal"}],"source":"lua/images/anchor.lua","stats":{"files_lua":1,"files_md":0,"files_other":0,"functions":3,"lines":111,"modules":0,"namespaces":0,"symbols":0,"types":0},"summary":"Buffer zeigt) an einer benannten Position zeichnen.","symbols":[],"types":[]},{"body":"Ursprünglich als color_my_ascii.nvim-Integration angedacht. Dessen\nHighlighter färbt aber bekannte ASCII-Zeichenklassen (Pfeile,\nBox-Drawing, Operatoren, …) gegen ein benanntes Schema — Muster-basiert,\neine Farbe pro Klasse. Für ein Bild wird dagegen eine beliebige RGB-Farbe\npro Zelle gebraucht, die aus echten Pixeln kommt; das ist eine andere Art\nFärbung, die color_my_ascii nicht anbietet. Deshalb hier ein eigener,\nschlanker Pfad direkt über `nvim_set_hl`/Extmarks statt einer Abhängigkeit,\ndie nicht passt.\n\nBraucht ImageMagick zwingend — die vierte bewusste Ausnahme neben SVG,\n`:Image export` und `:Image redact` (siehe docs/ROADMAP/README.md):\nPixelfarben aus einer beliebigen Rasterdatei zu lesen braucht einen\nechten Bild-Decoder, den reines Lua nicht hat.\n\nJede Terminalzelle wird ein \"█\"-Zeichen mit eigener Vordergrundfarbe —\nTruecolor-Blockgrafik wie sie graphikprotokoll-lose Bildbetrachter\n(chafa, viu) einsetzen, statt eines Helligkeits-Zeichensatzes\n(\" .:-=+*#%@\"). Farbtreuer, ohne die Zusatzfrage \"welches Zeichen für\nwelche Helligkeit\".\n\nBewusst nur der Einzelbild-Pfad (`images.init.M.show`) — dieselbe\nScope-Grenze wie bei den Remote-Bildern (siehe images.remote): Galerie,\ncompare, pickers und zen bekommen das (noch) nicht.","calls_external":[],"calls_raw":[{"callee":"vim.api.nvim_create_namespace","line":34},{"callee":"vim.api.nvim_win_is_valid","from_fn":"M.is_open","line":43},{"callee":"vim.api.nvim_win_is_valid","from_fn":"M.close","line":49},{"callee":"pcal funden)\" end\n\n  local info = require(\"images.info\").collect(path)\n  local image_px = (info and info.width and info.height) and { width = info.width, height = info.height } or nil\n  local cols, rows = require(\"images.scale\").fit_cells(display.max_cols, display.max_rows, image_px)\n\n  local raw, err = sample(path, cols, rows)\n  if not raw then return false, err end\n\n  M.close()\n\n  local lines = {}\n  for _ = 1, rows do\n    lines[#lines + 1] = BLOCK:rep(cols)\n  end\n\n  local win, buf = require(\"lib.nvim.window.make_scratch\")({\n    relative = \"cursor\",\n    row = 1,\n    col = 0,\n    width = cols,\n    height = rows,\n    lines = lines,\n    enter = false,\n    focusable = false,\n    border = \"rounded\",\n    title = \" ASCII (kein OSC 1337) \",\n  })\n  if not win or not buf then return false, \"ASCII-Fenster konnte nicht geöffnet werden\" end\n  winid = win\n\n  -- BLOCK (\"█\") ist 3 Bytes in UTF-8 — Byte-Spalten für die Extmark-Grenzen,\n  -- nicht Anzeigespalten.\n  for row = 1, rows do\n    for col = 1, cols do\n      local idx = ((row - 1) * cols + (col - 1)) * 3 + 1\n      local r, g, b = raw:byte(idx), raw:byte(idx + 1), raw:byte(idx + 2)\n      local hex = string.format(\"#%02x%02x%02x\", r, g, b)\n      vim.api.nvim_buf_set_extmark(buf, NS, row - 1, (col - 1) * 3, {","snippet_omitted":18,"summary":"Bild als farbige Blockgrafik in einem Floating-Window unter dem Cursor zeichnen.","test":[],"tested":true,"todo":[]}],"id":"lua/images/ascii.lua","kind":"file","module":"images.ascii","name":"ascii.lua","parent":"lua/images","path":"lua/images/ascii.lua","plugins":[],"required_by":["lua/images"],"requires":["lua/images/info.lua","lua/images/scale.lua"],"requires_external":["lib.nvim.window.make_scratch"],"requires_raw":[{"alias":"info","deferred":true,"line":117,"member":"collect","module":"images.info"},{"deferred":true,"line":119,"module":"images.scale"},{"deferred":true,"line":131,"module":"lib.nvim.window.make_scratch"}],"source":"lua/
